name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  # Defense-in-depth after publication. The coordinator's binding gate is the
  # exact-SHA v* push above, with its channel read from committed release notes.
  release:
    types: [released]

concurrency:
  # Keyed by event so a push never cancels a long release or ad hoc validation:
  # pushes supersede pushes (the gate is minutes), while each event class only
  # supersedes its own earlier run. With a single group, every push killed the
  # multi-hour validation already in flight.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    # Push/PR gate: fast, deterministic, and free of Swift compilation. The old
    # gate compiled the app, the CLI, the whole Xcode project, and five test
    # invocations; it could not finish inside its 30 minute timeout, so every
    # push run since beta25 was cancelled at the limit and gated nothing.
    # Releases are verified locally (full 14k-test suite and the dependency
    # regression tiers); CI's job on push is to catch cheap structural drift
    # quickly. The Swift build work now lives in the release/dispatch
    # build-smoke job.
    name: Fast gate
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate dependency manifest
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "scripts/deps")
          import manifest_io
          path = "Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json"
          json.load(open(path))
          m = manifest_io.load(path)
          import tempfile, pathlib
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as f:
              tmp = f.name
          manifest_io.dump(m, tmp)
          if pathlib.Path(path).read_text() != pathlib.Path(tmp).read_text():
              raise SystemExit("manifest is not byte-stable under manifest_io round-trip")
          print("manifest valid and byte-stable")
          EOF

      - name: Check Package.resolved and Xcode project pin consistency
        run: bash scripts/check-package-resolved-consistency.sh

      - name: Shell script syntax
        run: |
          rc=0
          for f in scripts/*.sh scripts/deps/*.sh scripts/release/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f" || { echo "syntax error: $f" >&2; rc=1; }
          done
          exit "$rc"

      - name: Install script test dependencies
        run: |
          brew install ripgrep
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --upgrade pip
          .ci-python/bin/python -m pip install Pillow openpyxl PyYAML

      - name: Run release and fixture script tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .ci-python/bin/python -B -m unittest discover -s scripts/tests

  package-smoke:
    name: Unsigned package (${{ matrix.channel }})
    runs-on: macos-26
    timeout-minutes: 120
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        channel: [preview, stable]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      - name: Build and verify unsigned candidate
        env:
          LUNGFISH_SPARKLE_PUBLIC_ED_KEY: FtnZIDTqGTwkglQR0z8iSgVvxvT26a05QB3cI4xQw/c=
        run: |
          package_log="$PWD/.build/package-only-${{ matrix.channel }}.log"
          mkdir -p "$PWD/.build"
          if python3 scripts/release/release.py package ${{ matrix.channel }} \
              >"$package_log" 2>&1; then
            :
          else
            status=$?
            exit "$status"
          fi

      - name: Upload unsigned package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-package-${{ matrix.channel }}-evidence
          if-no-files-found: ignore
          path: |
            build/Release/${{ matrix.channel }}/*/package-metadata.txt
            build/Release/${{ matrix.channel }}/*/unsigned-candidate-receipt.json
            .build/package-only-${{ matrix.channel }}.log

  release-context:
    name: Release context
    runs-on: macos-26
    timeout-minutes: 5
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse exact committed Channel field
        id: release
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[1-9][0-9]{3}\.([1-9]|1[0-2])\.[1-9][0-9]*$ ]]; then
            echo "release tag is not canonical CalVer: $tag" >&2
            exit 64
          fi
          version="${tag#v}"
          notes="docs/release-notes/${version}.md"
          test -f "$notes"
          preview_count="$(grep -c '^Channel: Preview$' "$notes" || true)"
          stable_count="$(grep -c '^Channel: Stable$' "$notes" || true)"
          if [ "$preview_count" -eq 1 ] && [ "$stable_count" -eq 0 ]; then
            echo "channel=preview" >> "$GITHUB_OUTPUT"
          elif [ "$preview_count" -eq 0 ] && [ "$stable_count" -eq 1 ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            echo "release notes must contain exactly one exact Channel field" >&2
            exit 65
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release-focused:
    name: Focused release tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: [release-context]
    if: ${{ needs.release-context.result == 'success' }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install focused test dependencies
        run: |
          brew install ripgrep
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --upgrade pip
          .ci-python/bin/python -m pip install Pillow openpyxl PyYAML

      - name: Run contract-defined focused release tests
        run: |
          modules="$(python3 - <<'PYTHON'
          import json
          print(" ".join(json.load(open("config/release-contract.json"))["gates"]["focusedReleaseTests"]))
          PYTHON
          )"
          # Contract validation rejects option-like or shell-bearing module names.
          .ci-python/bin/python -B -m unittest $modules

  release-dependency-receipt:
    name: Dependency receipt
    runs-on: macos-26
    timeout-minutes: 120
    needs: [release-context]
    if: ${{ needs.release-context.result == 'success' }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      - name: Build dependency manager
        run: swift build --product lungfish-cli

      - name: Restore managed dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.lungfish/conda
            ~/.lungfish/databases
            ~/.lungfish/dependency-receipt.json
          key: release-dependencies-${{ runner.os }}-${{ hashFiles('Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json') }}

      - name: Install pinned micromamba bootstrap
        run: |
          source="Sources/LungfishWorkflow/Resources/Tools/micromamba"
          destination="$HOME/.lungfish/conda/bin/micromamba"
          expected="$(python3 -c 'import json; print(json.load(open("Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json"))["bootstrap"]["micromamba"]["sha256"]["osx-arm64"])')"
          actual="$(shasum -a 256 "$source" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p "$(dirname "$destination")"
          install -m 0755 "$source" "$destination"
          "$destination" --version

      - name: Reconcile dependency receipt
        run: |
          .build/debug/lungfish-cli tools update --apply --yes --required-only
          .build/debug/lungfish-cli tools update --apply --yes

      - name: Verify dependency receipt
        run: python3 -c 'from pathlib import Path; from scripts.release.release import verify_dependency_receipt_file; verify_dependency_receipt_file(Path.cwd(), Path.home() / ".lungfish/dependency-receipt.json")'

  release-preview-gates:
    name: Preview source gates
    runs-on: macos-26
    timeout-minutes: 180
    needs: [release-context, release-focused, release-dependency-receipt, fast]
    if: ${{ needs.release-context.outputs.channel == 'preview' }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      # release-dependency-receipt runs on a different GitHub runner. Restore
      # the exact cache that job just provisioned before executing tests that
      # resolve managed tools and Python runtimes from ~/.lungfish.
      - name: Restore provisioned dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.lungfish/conda
            ~/.lungfish/databases
            ~/.lungfish/dependency-receipt.json
          key: release-dependencies-${{ runner.os }}-${{ hashFiles('Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json') }}
          fail-on-cache-miss: true

      - name: Verify restored dependency receipt
        run: python3 -c 'from pathlib import Path; from scripts.release.release import verify_dependency_receipt_file; verify_dependency_receipt_file(Path.cwd(), Path.home() / ".lungfish/dependency-receipt.json")'

      - name: Run Preview source gates
        run: |
          bash scripts/full-suite-gate.sh --tier unit
          bash scripts/full-suite-gate.sh --tier integration

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-tag-gate-logs
          path: .build/gate-logs

  release-stable-full:
    name: Stable full gate
    runs-on: macos-26
    timeout-minutes: 180
    needs: [release-context, release-focused, release-dependency-receipt, fast]
    if: ${{ needs.release-context.outputs.channel == 'stable' }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      # release-dependency-receipt runs on a different GitHub runner. Restore
      # the exact cache that job just provisioned before executing tests that
      # resolve managed tools and Python runtimes from ~/.lungfish.
      - name: Restore provisioned dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.lungfish/conda
            ~/.lungfish/databases
            ~/.lungfish/dependency-receipt.json
          key: release-dependencies-${{ runner.os }}-${{ hashFiles('Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json') }}
          fail-on-cache-miss: true

      - name: Verify restored dependency receipt
        run: python3 -c 'from pathlib import Path; from scripts.release.release import verify_dependency_receipt_file; verify_dependency_receipt_file(Path.cwd(), Path.home() / ".lungfish/dependency-receipt.json")'

      - name: Run Stable full source gate
        run: bash scripts/full-suite-gate.sh --tier full

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-full-tag-gate-logs
          path: .build/gate-logs

  release-stable-conformance:
    name: Stable conformance gate
    runs-on: macos-26
    timeout-minutes: 180
    needs: [release-context, release-focused, release-dependency-receipt, fast]
    if: ${{ needs.release-context.outputs.channel == 'stable' }}

    steps:
      - name: Check out exact tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      - name: Restore provisioned dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.lungfish/conda
            ~/.lungfish/databases
            ~/.lungfish/dependency-receipt.json
          key: release-dependencies-${{ runner.os }}-${{ hashFiles('Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json') }}
          fail-on-cache-miss: true

      - name: Verify restored dependency receipt
        run: python3 -c 'from pathlib import Path; from scripts.release.release import verify_dependency_receipt_file; verify_dependency_receipt_file(Path.cwd(), Path.home() / ".lungfish/dependency-receipt.json")'

      - name: Provision exact dependency set
        run: bash scripts/deps/verify.sh --tier 2 --root "$HOME/.lungfish-release-verify" --seed-from "$HOME/.lungfish"

      - name: Verify dependency receipt
        run: python3 -c 'from pathlib import Path; from scripts.release.release import verify_dependency_receipt_file; verify_dependency_receipt_file(Path.cwd(), Path.home() / ".lungfish-release-verify/dependency-receipt.json")'

      - name: Run Stable conformance source gate
        run: LUNGFISH_STORAGE_ROOT="$HOME/.lungfish-release-verify" bash scripts/full-suite-gate.sh --tier conformance --require-tools

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-conformance-tag-gate-logs
          path: .build/gate-logs

  build-smoke:
    name: Build and smoke tests
    runs-on: macos-26
    timeout-minutes: 90
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Seed Xcode Package.resolved
        run: bash scripts/check-package-resolved-consistency.sh --repair

      - name: Build app executable
        run: swift build --product Lungfish

      - name: Build CLI executable
        run: swift build --product lungfish-cli

      - name: Build Xcode app project without signing
        run: |
          LUNGFISH_SKIP_EMBED_LUNGFISH_CLI=1 \
          LUNGFISH_SKIP_SANITIZE_BUNDLED_TOOLS=1 \
          xcodebuild -project Lungfish.xcodeproj -scheme Lungfish \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Repair Xcode Package.resolved after Xcode build
        run: bash scripts/check-package-resolved-consistency.sh --repair

      - name: Check Package.resolved consistency
        run: bash scripts/check-package-resolved-consistency.sh

      - name: Install smoke test tool dependencies
        run: |
          brew install htslib samtools seqkit
          mkdir -p "$HOME/.lungfish/conda/envs/htslib/bin"
          mkdir -p "$HOME/.lungfish/conda/envs/samtools/bin"
          mkdir -p "$HOME/.lungfish/conda/envs/seqkit/bin"
          ln -sf "$(brew --prefix htslib)/bin/bgzip" "$HOME/.lungfish/conda/envs/htslib/bin/bgzip"
          ln -sf "$(brew --prefix samtools)/bin/samtools" "$HOME/.lungfish/conda/envs/samtools/bin/samtools"
          ln -sf "$(brew --prefix seqkit)/bin/seqkit" "$HOME/.lungfish/conda/envs/seqkit/bin/seqkit"

      - name: Run smoke package tests
        run: swift test --filter '^(LungfishCoreTests\.(BundleManifestTests|GenomicRegionTests|RuntimeResourceLocatorTests|SequenceTests)|LungfishWorkflowTests\.(BAMPrimerTrimProvenanceTests|MappingProvenanceTests|ScientificProvenancePolicyTests)|LungfishCLITests\.ScientificCLIProvenanceCoverageTests)(/|$)'

      - name: Run synchronized miSeq correctness and instrumentation tests
        run: |
          swift test --filter GenotypeResultPresentationPolicyTests
          swift test --filter GenotypeEffectiveHaplotypeProjectionTests
          swift test --filter GenotypeAnnotationStoreCallOverrideTests
          swift test --filter GenotypeResultViewportTests/testHaplotypedMiSeq
          swift test --filter GenotypeManualHaplotypePerformanceTests

      - name: Install script test dependencies
        run: |
          brew install ripgrep
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --upgrade pip
          .ci-python/bin/python -m pip install Pillow openpyxl PyYAML

      - name: Run release and fixture script tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .ci-python/bin/python -B -m unittest discover -s scripts/tests

      - name: Compare deterministic project-storage skips
        run: |
          task9_implementation_sha="$(git log --diff-filter=A --format=%H -1 -- scripts/verification/project-storage-task9-skip-policy.json)"
          task9_base_sha="$(python3 scripts/verification/compare_project_storage_skips.py --policy scripts/verification/project-storage-task9-skip-policy.json --print-baseline-sha)"
          scripts/verification/run_project_storage_skip_comparison.sh \
            --suite ci-focused \
            --base-sha "$task9_base_sha" \
            --implementation-sha "$task9_implementation_sha" \
            --report .build/project-storage-skip-comparison/ci-focused-report.json

      - name: Test current HEAD project-storage implementation
        run: |
          task9_current_head_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          swift test --no-parallel --filter \
            'ProjectStorageScannerLargeTreeTests|ProjectStorageScannerTests|ProjectStorageCleanupPreparationLargeTreeTests|ProjectStorageCleanupProvenanceTests|ProjectStoragePublishedCleanupOutcomeReaderTests|ProjectStorageAutomaticCleanupServiceTests|ProjectStoragePerformanceTests|ProjectTempCleanupTests'
          test "$(git rev-parse HEAD)" = "$task9_current_head_sha"
          test -z "$(git status --porcelain)"

      - name: Upload project-storage skip comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-storage-skip-comparison
          path: |
            .build/project-storage-skip-comparison/ci-focused-base.log
            .build/project-storage-skip-comparison/ci-focused-base-status.json
            .build/project-storage-skip-comparison/ci-focused-implementation.log
            .build/project-storage-skip-comparison/ci-focused-implementation-status.json
            .build/project-storage-skip-comparison/ci-focused-report.json

  full:
    name: Full suite
    runs-on: macos-26
    timeout-minutes: 120
    needs: [fast, toolset-conformance]
    # Dispatch-only, deliberately NOT tag-triggered: the full suite is exactly
    # what the local release gate already ran before the tag existed, so on a
    # release it duplicates a stronger local check on a slower, flakier machine.
    # The tag board keeps what only CI can provide: the Xcode project build and
    # the fresh-machine toolset provisioning + conformance.
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build CLI
        run: swift build --product lungfish-cli

      - name: Compute manifest hash
        id: manifest
        run: echo "hash=$(shasum -a 256 Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Restore managed toolset
        uses: actions/cache@v4
        with:
          path: |
            ~/.lungfish/conda
            ~/.lungfish/databases/kraken2/viral
            ~/.lungfish/databases/metagenomics-db-registry.json
            ~/.lungfish/dependency-receipt.json
          key: lungfish-tools-${{ runner.os }}-${{ steps.manifest.outputs.hash }}

      - name: Provision required tools
        run: .build/debug/lungfish-cli tools update --apply --yes --required-only

      - name: Install full-suite Python dependencies
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --upgrade pip
          .ci-python/bin/python -m pip install numpy biopython scipy pandas
          echo "$PWD/.ci-python/bin" >> "$GITHUB_PATH"

      - name: Run full package tests
        run: swift test

  toolset-conformance:
    name: Toolset conformance
    runs-on: macos-26
    timeout-minutes: 120
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'release' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select supported Xcode
        run: python3 scripts/release/release_xcode.py --shell >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build CLI
        run: swift build --product lungfish-cli

      - name: Compute manifest hash
        id: manifest
        run: echo "hash=$(shasum -a 256 Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache managed tools and viral DB
        uses: actions/cache@v4
        with:
          path: |
            ~/.lungfish/conda
            ~/.lungfish/databases/kraken2/viral
            ~/.lungfish/databases/metagenomics-db-registry.json
            ~/.lungfish/dependency-receipt.json
          key: lungfish-tools-${{ runner.os }}-${{ steps.manifest.outputs.hash }}

      - name: Provision required tools
        run: .build/debug/lungfish-cli tools update --apply --yes --required-only

      - name: Verify dependency receipt
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path

          manifest = json.loads(Path("Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json").read_text())
          receipt_path = Path.home() / ".lungfish" / "dependency-receipt.json"
          receipt = json.loads(receipt_path.read_text())
          # Swift JSONEncoder escapes forward slashes by default. Reproduce the
          # app's sorted-key encoding so this independently checks manifestHash.
          canonical_manifest = json.dumps(
              manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=False
          ).replace("/", "\\/").encode()
          canonical_manifest_hash = hashlib.sha256(canonical_manifest).hexdigest()
          required_environments = {
              tool["environment"] for tool in manifest.get("tools", [])
          }
          receipt_environments = receipt.get("environments", {})
          bad_states = {
              name: receipt_environments.get(name, {}).get("state") or "missing"
              for name in required_environments
              if receipt_environments.get(name, {}).get("state") != "installed"
          }
          if receipt.get("dependencySet") != manifest.get("dependencySet"):
              raise SystemExit("dependency receipt set does not match the manifest")
          if receipt.get("synthesized"):
              raise SystemExit("dependency receipt is synthesized rather than reconciled")
          if receipt.get("manifestHash") != canonical_manifest_hash:
              raise SystemExit("dependency receipt hash does not match the canonical manifest")
          if bad_states:
              raise SystemExit(f"dependency receipt has incomplete required environments: {bad_states}")
          print(
              "verified dependency receipt: "
              f"set={receipt['dependencySet']} "
              f"manifest={receipt['manifestHash']} "
              f"required-installed={len(required_environments)}"
          )
          PYTHON

      - name: Provision conformance packs
        run: |
          .build/debug/lungfish-cli conda install --pack read-mapping
          .build/debug/lungfish-cli conda install --pack assembly
          .build/debug/lungfish-cli conda install --pack phylogenetics
          .build/debug/lungfish-cli conda install --pack multiple-sequence-alignment
          .build/debug/lungfish-cli conda install --pack metagenomics
          .build/debug/lungfish-cli conda install --pack full-length-mhc-genotyping
          # ivar and lofreq, needed by ReadsToVariantsEndToEndTests and
          # BAMPrimerTrimSubcommandTests, which the conformance filter runs.
          .build/debug/lungfish-cli conda install --pack variant-calling

      - name: Provision Kraken2 viral DB
        run: .build/debug/lungfish-cli conda db download Viral

      - name: Provision managed databases
        # RecipeIntegrationTests and FASTQBatchImporterRecipeIntegrationTests
        # need the Deacon panhuman host-depletion index, which is a managedData
        # entry rather than a Kraken2 catalog database, so `db download` does
        # not cover it.
        run: .build/debug/lungfish-cli conda db install-managed deacon-panhuman

      - name: Install python dependencies for parity tests
        # IVarConverterViralReconParityTests runs ivar_variants_to_vcf.py via
        # `/usr/bin/env python3`, so the packages must be importable from
        # whichever python3 is first on PATH -- not from an unreferenced venv.
        # Putting the venv's bin at the front of PATH makes `env python3`
        # resolve to it, matching how the fast job provisions its script tests.
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --upgrade pip
          .ci-python/bin/python -m pip install numpy biopython scipy pandas
          echo "$PWD/.ci-python/bin" >> "$GITHUB_PATH"

      - name: Verify parity test python dependencies are importable
        # Fail here with a clear message rather than inside the test run, where
        # it would surface as an opaque script exit code.
        run: python3 -c 'import numpy, Bio, scipy, pandas; print("parity deps OK")'

      - name: Run conformance suites
        run: |
          # LUNGFISH_REQUIRE_TOOLS=1 is set internally by --require-tools: every
          # tool-availability XCTSkip in the conformance allowlist becomes an
          # XCTFail instead, so a missing tool or database fails this job
          # rather than silently skipping.
          bash scripts/full-suite-gate.sh --require-tools --filter 'Conformance|FASTQToolIntegrationTests|RecipeIntegrationTests|NativeToolRunnerTests|MAFFTAlignmentPipelineTests|ClassificationPipelineIntegrationTests|ReadsToVariantsEndToEndTests|BAMPrimerTrimSubcommandTests|IVarConverterViralReconParityTests|FASTQIngestionPipelineTests|FASTQBatchImporterRecipeIntegrationTests|GenotypeWorkbookManagedRuntimeProbeTests|FASTQOperationRoundTripTests|FastqGenotypingCommandTests|PrimerTrimThenIVarTests|ExtractReadsByIdBAMProcessTests'

      - name: Golden diff
        run: |
          dependency_set="$(python3 -c 'import json;print(json.load(open("Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json"))["dependencySet"])')"
          bash scripts/deps/regenerate-goldens.sh --set "$dependency_set" --out .build/goldens
          python3 scripts/deps/diff_goldens.py --recipes scripts/deps/goldens.json --candidate .build/goldens --set "$dependency_set"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolset-conformance-logs
          path: .build/gate-logs

  stable-release-defense:
    name: Stable release defense
    runs-on: macos-26
    timeout-minutes: 5
    needs: [build-smoke, toolset-conformance]
    # This board starts only after publication. It is defense in depth; the
    # coordinator already required the Stable full and conformance tag-push
    # jobs for the exact tag SHA before it allowed the public release.
    if: ${{ github.event_name == 'release' && needs.build-smoke.result == 'success' && needs.toolset-conformance.result == 'success' }}

    steps:
      - name: Confirm released tag identity
        run: |
          test "${{ github.event.release.tag_name }}" = "${GITHUB_REF_NAME}"
          test -n "${GITHUB_SHA}"
