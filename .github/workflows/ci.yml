name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: Fast gate
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Seed Xcode Package.resolved
        run: bash scripts/check-package-resolved-consistency.sh --repair

      - name: Build app executable
        run: swift build --product Lungfish

      - name: Build CLI executable
        run: swift build --product lungfish-cli

      - name: Build Xcode app project without signing
        run: |
          LUNGFISH_SKIP_EMBED_LUNGFISH_CLI=1 \
          LUNGFISH_SKIP_SANITIZE_BUNDLED_TOOLS=1 \
          xcodebuild -project Lungfish.xcodeproj -scheme Lungfish \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Repair Xcode Package.resolved after Xcode build
        run: bash scripts/check-package-resolved-consistency.sh --repair

      - name: Check Package.resolved consistency
        run: bash scripts/check-package-resolved-consistency.sh

      - name: Install smoke test tool dependencies
        run: |
          brew install htslib samtools seqkit
          mkdir -p "$HOME/.lungfish/conda/envs/htslib/bin"
          mkdir -p "$HOME/.lungfish/conda/envs/samtools/bin"
          mkdir -p "$HOME/.lungfish/conda/envs/seqkit/bin"
          ln -sf "$(brew --prefix htslib)/bin/bgzip" "$HOME/.lungfish/conda/envs/htslib/bin/bgzip"
          ln -sf "$(brew --prefix samtools)/bin/samtools" "$HOME/.lungfish/conda/envs/samtools/bin/samtools"
          ln -sf "$(brew --prefix seqkit)/bin/seqkit" "$HOME/.lungfish/conda/envs/seqkit/bin/seqkit"

      - name: Run smoke package tests
        run: swift test --filter '^(LungfishCoreTests\.(BundleManifestTests|GenomicRegionTests|RuntimeResourceLocatorTests|SequenceTests)|LungfishWorkflowTests\.(BAMPrimerTrimProvenanceTests|MappingProvenanceTests|ScientificProvenancePolicyTests)|LungfishCLITests\.ScientificCLIProvenanceCoverageTests)(/|$)'

      - name: Install script test dependencies
        run: |
          brew install ripgrep
          python3 -m venv .ci-python
          .ci-python/bin/python -m pip install --upgrade pip
          .ci-python/bin/python -m pip install Pillow openpyxl

      - name: Run release and fixture script tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: .ci-python/bin/python -B -m unittest discover -s scripts/tests

      - name: Compare deterministic project-storage skips
        run: |
          task9_implementation_sha="$(git log --diff-filter=A --format=%H -1 -- scripts/verification/project-storage-task9-skip-policy.json)"
          task9_base_sha="$(python3 scripts/verification/compare_project_storage_skips.py --policy scripts/verification/project-storage-task9-skip-policy.json --print-baseline-sha)"
          scripts/verification/run_project_storage_skip_comparison.sh \
            --suite ci-focused \
            --base-sha "$task9_base_sha" \
            --implementation-sha "$task9_implementation_sha" \
            --report .build/project-storage-skip-comparison/ci-focused-report.json

      - name: Test current HEAD project-storage implementation
        run: |
          task9_current_head_sha="$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          swift test --no-parallel --filter \
            'ProjectStorageScannerLargeTreeTests|ProjectStorageScannerTests|ProjectStorageCleanupPreparationLargeTreeTests|ProjectStorageCleanupProvenanceTests|ProjectStoragePublishedCleanupOutcomeReaderTests|ProjectStorageAutomaticCleanupServiceTests|ProjectStoragePerformanceTests|ProjectTempCleanupTests'
          test "$(git rev-parse HEAD)" = "$task9_current_head_sha"
          test -z "$(git status --porcelain)"

      - name: Upload project-storage skip comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-storage-skip-comparison
          path: |
            .build/project-storage-skip-comparison/ci-focused-base.log
            .build/project-storage-skip-comparison/ci-focused-base-status.json
            .build/project-storage-skip-comparison/ci-focused-implementation.log
            .build/project-storage-skip-comparison/ci-focused-implementation-status.json
            .build/project-storage-skip-comparison/ci-focused-report.json

  full:
    name: Full suite
    runs-on: macos-26
    timeout-minutes: 45
    needs: fast
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app/Contents/Developer

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run full package tests
        run: swift test
