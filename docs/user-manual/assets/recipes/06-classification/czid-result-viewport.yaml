# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: Classifications/czid-demo open,Sidebar and Inspector hidden,sunburst left,taxon table right,imported-result action bar visible.
id: czid-result-viewport
chapter: 06-classification/08-importing-cz-id-results
caption: "An imported CZ-ID result open in the taxonomy viewport, with the summary cards across the top, the sunburst on the left, the per-taxon table on the right, and the action bar along the bottom naming the imported result."
viewport_class: none
app_state:
  fixture: '{demo_project}'
  open_files: []
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Open Classifications/czid-demo from the demo sidebar.
  # PROSE-ONLY: Hide Sidebar and Inspector and resize named main window to1400×900 points.
  # PROSE-ONLY: Drag the viewer split divider to approximately36% width to reveal all taxon table columns,without dragging any table headers.
  # PROSE-ONLY: Capture the imported CZ-ID viewport.
crop:
  mode: window
post:
  retina: true
  format: png
