viewport_class: taxonomy
app_state:
  fixture: '{demo_project}'
  open_files:
  - analysis: Imports/nvd-100
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Import Practice Data/nvd-demo/results with File > Import Center... > Classification Results > NVD Results
  # PROSE-ONLY: Select NVD: 100 and the NODE_1 (500 bp) row of SampleA
  # PROSE-ONLY: Click BLAST Verify in the action bar and wait for the drawer to show the result
  # PROSE-ONLY: Capture the full window
crop:
  mode: window
post:
  retina: true
  format: png
