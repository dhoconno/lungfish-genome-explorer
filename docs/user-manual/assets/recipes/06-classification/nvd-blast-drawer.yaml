# Captured from Lungfish Preview 2026.9.71 with capture-window.sh (2026-09 campaign).
# App state: A Pathogen Detection demo project copy with its NVD demo results imported as NVD: 100, including the simulated contig FASTAs, NODE_1 of SampleA selected and verified with BLAST against NCBI core_nt (1 supporting, 0 contradicting, Supported).
id: nvd-blast-drawer
chapter: 06-classification/09-novel-virus-detection
caption: The BLAST results drawer open across the bottom of the NVD viewport below the outline and above
