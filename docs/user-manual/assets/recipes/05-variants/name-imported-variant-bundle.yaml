# Captured from Lungfish Preview 2026.9.64 (2026-09-30 recapture).
# App state: Import Center Variants import of the benchmark VCF with README selected, Name Imported Variant Bundle alert.
id: name-imported-variant-bundle
chapter: 05-variants/06-importing-existing-vcfs
caption: The Name Imported Variant Bundle prompt that appears when no reference bundle is open, with the
  project path in its message and the file's base name filled into the text field.
viewport_class: none
app_state:
  fixture: '{demo_project}'
  open_files: []
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Select README.md so no bundle is displayed
  # PROSE-ONLY: Import Center > Variants > VCF card Import..., choose HG002.chr20.10.0-10.5Mb.benchmark.vcf.gz
  # PROSE-ONLY: Screen-region capture of the alert
crop:
  mode: region
post:
  retina: true
  format: png
