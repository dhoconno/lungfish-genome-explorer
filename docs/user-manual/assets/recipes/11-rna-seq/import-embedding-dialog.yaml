# Captured from Lungfish Preview 2026.11.18 (14772) with capture-window.sh (2026-11-26 docs refresh, sitting 1)
id: import-embedding-dialog
chapter: 11-rna-seq/05-the-cell-map
caption: The Import Embedding pane with the STARsolo pbmc_1k_v3 cut chosen as the result and 10x's projection.csv and clusters.csv chosen as its files.
viewport_class: none
app_state:
  fixture: docs/user-manual/fixtures/rnaseq-single-cell
  open_files:
    - path: tenx-analysis-pbmc_1k_v3/analysis/tsne/2_components/projection.csv
    - path: tenx-analysis-pbmc_1k_v3/analysis/clustering/graphclust/clusters.csv
  window_size: [1440, 900]
  appearance: light
steps:
  - action: open_application
    app: com.lungfish.browser.preview
  - action: resize_window
    width: 1440
    height: 900
  - action: wait_ready
    signal: main_window_visible
  # PROSE-ONLY: Tools > RNA-seq > Import Embedding...
  # PROSE-ONLY: click Choose... under Single-cell RNA-seq result and pick STARsolo_pbmc_1k_v3_cut.lungfishrnaseq in the project's Analyses folder
  # PROSE-ONLY: click Choose... under Coordinates, press Command-Shift-G, type the full path of analysis/tsne/2_components/projection.csv, press Return, click Open
  # PROSE-ONLY: click Choose... under Clusters, press Command-Shift-G, type the full path of analysis/clustering/graphclust/clusters.csv, press Return, click Open
  # PROSE-ONLY: capture the Workflow Operations window, then click Run (the import)
crop:
  mode: window
post:
  retina: true
  format: png
