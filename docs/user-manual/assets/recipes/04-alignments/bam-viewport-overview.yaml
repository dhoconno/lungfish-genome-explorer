# Captured from Lungfish Preview 2026.11.15 with capture-window.sh (2026-11-21 docs refresh)
# App state: the minimap2 mapping result of the demo selected, its one contig row selected, sidebar and drawer hidden, Inspector open on its Bundle tab. The contig table sits above the alignment at its whole-region zoom (502 bp/px) with the variant summary, the coverage curve with its Depth key and 100% covered figure, the max and mean label, and the zoom-in message.
# Capture: ACTIVATE=0 capture-window.sh <window id> 04-alignments bam-viewport-overview (1600 x 1000 PNG of the whole window).
id: bam-viewport-overview
chapter: 04-alignments/02-reading-an-alignment
caption: "The mapping viewer for the HG002 chromosome 20 slice with Mapping Layout set to List above detail, so the contig table and its Track, Mapped Reads, Mean Depth and Coverage Breadth columns sit above the alignment at its whole-region zoom. The coverage curve carries the Depth key and percent-covered figure at its left-hand edge and the max and mean label at its right-hand edge, and a message asks you to zoom in before individual reads are drawn."
viewport_class: alignment
app_state:
  fixture: '{demo_project}'
  open_files:
  - project: Human Mapping and Variants (with results).lungfish
  - mapping: Analyses/minimap2-2026-09-25T00-00-00
  window_size:
  - 1440
  - 900
  appearance: light
steps:
- action: open_file
  path: '{demo_project}'
- action: wait_ready
  signal: main_window_visible
  # PROSE-ONLY: Pressed Later on the Update tools to 2026.2 sheet
- action: resize_window
  size:
  - 1440
  - 900
  # PROSE-ONLY: Clicked minimap2-2026-09-25T00-00-00 under Analyses in the sidebar
  # PROSE-ONLY: Clicked the chr20 row of the mapped contigs table (it was not yet selected)
  # PROSE-ONLY: Inspector > View > Mapping Layout was already List above detail (this Mac's preference; the default is Detail left, list right). Choose List above detail there for the same picture
  # PROSE-ONLY: Chose View > Hide Drawer
  # PROSE-ONLY: Chose View > Hide Sidebar (the window shrinks by the sidebar width)
- action: resize_window
  size:
  - 1440
  - 900
  # PROSE-ONLY: Dragged the divider at the Inspector's left edge about 55 points right, so the Coverage Breadth column shows whole
crop:
  mode: window
post:
  retina: true
  format: png
