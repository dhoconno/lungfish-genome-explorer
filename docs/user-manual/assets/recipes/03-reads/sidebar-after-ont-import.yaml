# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: barcode01 selected inside top-level ont-run folder after GUI import with recipe toggled on then off. Stored crop is in window points,not display points.
id: sidebar-after-ont-import
chapter: 03-reads/07-ont-runs
caption: The sidebar after importing the NRG1 run folder, showing the six barcode bundles, barcode85 to
  barcode91, inside the ont-run folder under Imports.
viewport_class: none
app_state:
  fixture: '{demo_project}'
  open_files: []
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Select fastq_pass through ONT Run Folder importer.
  # PROSE-ONLY: Show optional recipe controls for the preceding screenshot,then disable Apply processing recipe after import.
  # PROSE-ONLY: Click Import and select the resulting ont-run/barcode01 bundle.
  # PROSE-ONLY: Capture CROP=0 400 341 390 from the1400×900-point main window.
crop:
  mode: region
  region:
  - 0
  - 400
  - 341
  - 390
post:
  retina: true
  format: png
