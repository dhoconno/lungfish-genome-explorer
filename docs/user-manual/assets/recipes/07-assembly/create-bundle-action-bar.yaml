# Captured from Lungfish Preview 2026.9.13 with capture-window.sh (2026-09 campaign).
# App state: Substitution: the demo project holds no MEGAHIT run, so this uses the HG002-chrM SPAdes run instead, with its one (and therefore longest) contig row selected. The action bar reads 1 contig selected, with BLAST Contig, Copy FASTA, Export FASTA, and Create Bundle enabled.
id: create-bundle-action-bar
chapter: 07-assembly/04-extracting-contigs
caption: "The action bar under the contig table reading 1 contig selected, with BLAST Contig, Copy FASTA, Export FASTA, and Create Bundle all enabled."
viewport_class: assembly
app_state:
  fixture: '{demo_project}'
  open_files:
  - assembly: Analyses/HG002-chrM
  window_size:
  - 1400
  - 900
  appearance: light
steps:
- action: open_application
  app: Lungfish Preview
- action: wait_ready
  signal: main_window_visible
- action: resize_window
  size:
  - 1400
  - 900
  # PROSE-ONLY: Select Analyses/HG002-chrM in the sidebar
  # PROSE-ONLY: Click the longest (only) contig row in the contig table
crop:
  mode: region
  region:
  - 196
  - 828
  - 850
  - 60
post:
  retina: true
  format: png
