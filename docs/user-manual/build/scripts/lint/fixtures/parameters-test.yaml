version: 0
operations:
  test.trim:
    title: Trim reads
    entry_points: ["Tools > Trimming > Trim"]
    gating: []
    sources: []
    settings:
      - label: Minimum length
        control: number
        default: 50
        allowed: "1 to 10000"
        effect: Drops reads shorter than this after trimming.
        when_to_change: rarely
        cli_flag: --min-length
      - label: Quality cutoff
        control: number
        default: 20
        allowed: "0 to 60"
        effect: Trims bases below this Phred score from read ends.
        when_to_change: rarely
        cli_flag: --quality
    cli_only: []
    notes: test only
  test.colon:
    title: Map reads
    entry_points: ["Tools > Mapping > Map"]
    gating: []
    sources: []
    settings:
      - label: "Threads:"
        control: number
        default: 4
        allowed: "1 to 64"
        effect: Sets how many processor cores the mapper uses.
        when_to_change: rarely
        cli_flag: --threads
      - label: "Extra arguments:"
        control: text
        default: ""
        allowed: "any"
        effect: Passes more options to the mapper.
        when_to_change: rarely
        cli_flag: null
      - label: "Memory mapping:"
        control: toggle
        default: false
        allowed: "on or off"
        effect: Reads the database from disk as it runs.
        when_to_change: rarely
        cli_flag: --memory-mapping
      - label: "Min mapping quality:"
        control: number
        default: 0
        allowed: "0 to 60"
        effect: Drops alignments below this mapping quality.
        when_to_change: rarely
        cli_flag: --min-mapq
    cli_only: []
    notes: test only, labels with the trailing colon the app draws
