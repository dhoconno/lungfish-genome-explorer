        control: text
        default: "0.05"
        allowed: a decimal between 0 and 1, or blank
        effect: Discarded when the run starts, neither passed to GATK nor recorded in provenance. GATK decides which alleles to emit from its own genotype likelihoods rather than from a frequency cut-off.
        when_to_change: Leave it alone. Use Extra arguments for a real GATK threshold.
