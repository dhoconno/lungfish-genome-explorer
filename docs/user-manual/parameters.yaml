        cli_flag: --extra-args
    cli_only:
      - flag: --emit-ref-confidence
        default: GVCF
        effect: Chooses whether the run writes a GVCF, which records confidence at every position including the matching ones, or a plain VCF of variants only. The dialog always asks for the plain VCF.
      - flag: --ploidy
        default: "2"
        effect: Sets how many copies of each chromosome the sample carries, which is 2 for a human and 1 for a virus.
      - flag: --intervals
        default: none
        effect: Restricts the run to the regions in a BED or interval-list file, which is much faster than calling the whole genome.
      - flag: --pcr-indel-model
        default: CONSERVATIVE
        effect: Tells GATK how much insertion and deletion noise to expect from the library's PCR step.
      - flag: --stand-call-conf
        default: "30.0"
        effect: Sets the confidence score a call must reach before it is emitted, when the run is not writing a GVCF.
      - flag: --max-alternate-alleles
        default: "6"
        effect: Caps how many different alternate bases GATK will consider at one position, which bounds the work at messy sites.
      - flag: --pair-hmm-threads
        default: "4"
        effect: Sets how many threads the read-to-haplotype scoring step uses.
      - flag: --execute
        default: "false"
        effect: Actually runs GATK through the managed pack. Without it the command is only constructed and printed.
      - flag: --dry-run
        default: "false"
        effect: Prints the command preview and stops.
    notes: >-
      Both GATK entries sit behind the gatk-core pack, which is marked experimental, so
      the sidebar row is disabled with the reason "Requires GATK Core Pack" until the
      pack is installed. The GATK HaplotypeCaller Settings section holds no controls,
      only the line "GATK HaplotypeCaller will write a standard genotype VCF for the
      selected BAM." The dialog fixes reference confidence to NONE, so it always
      produces a plain VCF, and it takes the reference FASTA and the BAM path from the
      bundle rather than asking. The full germline toolchain, ten subcommands in all,
      is on the command line only, and is registered separately as variants.gatk-plans.

  variants.call-gatk-whatshap-phased:
    title: Call Variants (GATK + WhatsHap Phased)
    entry_points:
      - "Tools > Call Variants..."
      - "Inspector > Analysis > Variant Calling > Call Variants..."
      - "CLI: lungfish-cli variants phase --reference <fasta> --bam <bam> --output-vcf <vcf>"
    gating: [gatk-core, phasing, experimental]
    sources:
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingCatalog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingToolPanes.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+VariantWorkflow.swift
      - Sources/LungfishWorkflow/Variants/PhasedVariantCallingPlan.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings:
      - label: Alignment Track
        control: popup
        default: the first analysis-ready BAM alignment track in the bundle
        allowed: any analysis-ready BAM alignment track in the bundle
        effect: Chooses which alignment the plan is built around. Phasing needs reads long enough to span two nearby variants, so the choice of alignment decides whether phasing can work at all.
        when_to_change: Change it whenever the bundle holds more than one alignment.
        cli_flag: --bam
      - label: Output Variant Track Name
        control: text
        default: the alignment name, then a bullet, then GATK + WhatsHap Phased
        allowed: any text, and the app appends a number when the name is already taken
        effect: Names the track the plan would create. The phased VCF path is set to the bundle's variants/phased folder.
        when_to_change: Change it when you want a shorter or more descriptive label than the generated one.
        cli_flag: null
      - label: Minimum Allele Frequency
        control: text
        default: "0.05"
        allowed: a decimal between 0 and 1, or blank
        effect: Recorded with the plan but not passed to either tool.
        when_to_change: Leave it alone. Use Extra arguments for a real GATK threshold.
        cli_flag: null
      - label: Minimum Depth
        control: text
        default: "10"
        allowed: a whole number, or blank
        effect: Recorded with the plan but not passed to either tool.
        when_to_change: Leave it alone. Use Extra arguments for a real GATK threshold.
        cli_flag: null
      - label: Extra arguments
        control: text
        default: empty
        allowed: any GATK HaplotypeCaller flags, written exactly as GATK expects them
        effect: Adds your own arguments to the HaplotypeCaller half of the plan. The dialog offers no equivalent for the WhatsHap half.
        when_to_change: Use it to restrict the calling step to an interval list.
        cli_flag: --extra-gatk-args
    cli_only:
      - flag: --output-dir
        default: the folder holding the output VCF
        effect: Chooses where the written command plan and its provenance record land.
      - flag: --sample
        default: none
        effect: Names the sample WhatsHap should phase, for a VCF carrying more than one.
      - flag: --threads
        default: "1"
        effect: Sets how many threads the GATK scoring step uses, where the GUI plan takes the machine's processor count.
      - flag: --extra-whatshap-args
        default: none
        effect: Adds your own arguments to the WhatsHap phase command.
      - flag: --execute
        default: "false"
        effect: Actually runs GATK and WhatsHap through the managed packs. Without it the plan is written and printed but nothing runs.
      - flag: --dry-run
        default: "false"
        effect: Writes and prints the command plan without running either tool.
    notes: >-
      Hidden in 2026.9.40. The Call Variants dialog no longer lists this entry
      (BAMVariantCallingCatalog.swift phasedCallerCatalogEnabled = false), so its
      settings describe controls a reader cannot reach, and lungfish-cli
      variants phase is the only phased route.
      Phasing works out which nearby variants sit on the same copy of a chromosome,
      which matters when two changes in one gene could either disable both copies or
      leave one intact. This entry needs two packs, gatk-core and phasing, and both are
      marked experimental. The Settings section holds no controls, only the line "GATK
      HaplotypeCaller and WhatsHap will be assembled as a phase-aware command plan."
      Selecting this caller and clicking Run currently ends in an alert titled "Variant
      Calling Not Ready", because the dialog builds a phased plan into
      pendingPhasedVariantPlan while the launcher in
      InspectorViewController+VariantWorkflow.swift only ever reads pendingGATKRequest
      and pendingRequest. The working route to a phased plan is the command line, with
      lungfish-cli variants phase. That is registered separately as variants.phase.

  variants.filter-table:
    title: Filtering the variants table
    entry_points:
      - "Open a reference bundle, then the table drawer's Variants tab"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Viewer/AnnotationTableDrawerView.swift
      - Sources/LungfishApp/Views/Viewer/AnnotationTableDrawerView+Columns.swift
      - Sources/LungfishApp/Views/Viewer/AnnotationTableDrawerView+Filtering.swift
      - Sources/LungfishApp/Views/Viewer/SmartFilterTokens.swift
      - Sources/LungfishApp/Views/Viewer/VariantQueryBuilderSheet.swift
      - Sources/LungfishApp/Views/Viewer/QueryRule.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+AnnotationDrawer.swift
    settings:
      - label: Calls / Genotypes
        control: radio
        default: Calls
        allowed: Calls, Genotypes
        effect: Switches the table between one row per variant and one row per sample genotype at each variant. At narrow window widths the second label shortens to GT.
        when_to_change: Switch to Genotypes when the VCF holds several samples and you want to compare their calls side by side.
        cli_flag: null
      - label: Region / Genome
        control: radio
        default: Region
        allowed: Region, Genome
        effect: Decides whether the table lists only the variants inside the stretch the viewport is showing, or queries the whole genome. Its tooltip reads "Choose whether variants follow the visible region or query the whole genome".
        when_to_change: Switch to Genome when you are counting or filtering across the whole reference rather than reading one locus.
        cli_flag: null
      - label: Presets
        control: popup
        default: no chips applied, and the strip starts collapsed
        allowed: fourteen chips in four sections, Biological Effect, Quality / QC, Population / Frequency, and Sample / Genotype
        effect: Opens a strip of one-click filters. Biological Effect holds SNV, Indel, High Impact, Moderate+, and ClinVar Path. Quality / QC holds PASS, Qual >= 30, and DP >= 10. Population / Frequency holds Rare (<1%), Minor (<=20%), Mixed (20-80%), and Dominant (>=80%). Sample / Genotype holds Bookmarked, and its Het Only chip is defined but never offered in this release (SmartToken.isAvailable returns false with the reason "Genotype filtering not yet supported").
        when_to_change: Use it whenever you want a common filter without composing a query. The button is titled "Presets" followed by a triangle, and it hides itself when the window is narrow or the VCF defines no INFO keys.
        cli_flag: null
      - label: Query Builder...
        control: popup
        default: one blank rule, with Match All logic
        allowed: any number of rules across the seven categories
        effect: Opens the Variant Query Builder sheet, which is the only way to compose a filter by hand. Each rule picks a category, a field, an operator, and a value, and the sheet writes the resulting query text for you.
        when_to_change: Use it when a preset chip is not specific enough, for example to keep a coordinate window or to test one sample's genotype.
        cli_flag: --filter
      - label: Auto / Haploid / Diploid
        control: popup
        default: Auto
        allowed: Auto, Haploid, Diploid
        effect: Tells the three frequency chips how to read allele fractions. Auto guesses from the size of the reference, and the other two force the choice. Its tooltip offers Auto from reference size, or forcing haploid or diploid.
        when_to_change: Force Haploid when you are reading a virus or a bacterium and the automatic guess got it wrong.
        cli_flag: null
      - label: Clear
        control: popup
        default: hidden until a filter is active
        allowed: press to clear
        effect: Drops every active variant filter, both the chips and anything the Query Builder wrote. Its tooltip reads "Clear variant filter".
        when_to_change: Use it whenever you want the full table back.
        cli_flag: null
      - label: Profiles
        control: popup
        default: No Profile
        allowed: the built-in profiles Clinical, Research, QC, and High Confidence, profiles you saved, and Save Current as Profile...
        effect: Applies a saved set of filter rules to the variant table in one step, or saves the current rules under a name.
        when_to_change: Pick a profile when you reapply the same filter often.
        cli_flag: null
    cli_only: []
    notes: >-
      The variant free-text field is permanently hidden, so the chips and the Search
      Builder are the whole filtering surface. The drawer opens by itself when the
      bundle you load carries a variant or annotation track, sits at 250 points tall by
      default, and remembers a height you drag it to. The query language behind both
      surfaces recognises the clause keys text, chr, pos, range, region, qual, sc,
      filter, genes, and type, and anything else becomes a filter on an INFO key of that
      name. Colons and equals signs are interchangeable, so pos:100-200 and pos=100-200
      both work, and coordinates take a range rather than a comparison. Clauses are
      separated with a semicolon and always combine with AND. Per-sample clauses take
      the form Sample[<name>].<field> with GT, AF, and DP as the only fields. Three
      chip groups behave like radio buttons within themselves, the two type chips, the
      two impact chips, and the three frequency chips. The Query Builder is disabled on
      a very large variant database, and its tooltip then explains why. The sheet's own
      built-in presets include High-Confidence Coding, Rare Pathogenic, and Quality
      Review, and Save Preset... stores one of your own.

  variants.query:
    title: Query bundle variants
    entry_points:
      - "CLI: lungfish-cli variants query <bundle-path> --filter <filter> --output <vcf>"
    gating: []
    sources:
      - Sources/LungfishCLI/Commands/VariantsCommand.swift
      - Sources/LungfishIO/Bundles/VariantSmartFilter.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings: []
    cli_only:
      - flag: <bundle-path>
        default: none
        effect: Names the .lungfishref bundle whose variant database is queried. The bundle must already carry a variant track.
      - flag: --filter
        default: none
        effect: Holds the smart filter that decides which variants are written out, for example Sample[NA12878].GT=1/1. Several clauses are separated with a semicolon and always combine with AND.
      - flag: -o, --output
        default: none
        effect: Names the VCF the matching variants are written to.
      - flag: --limit
        default: "5000"
        effect: Caps how many variants the export writes, so a broad filter on a large database does not run away.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
      - flag: -t, --threads
        default: auto
        effect: Sets how many threads the query may use.
    notes: >-
      This command has no dialog. The in-app equivalent is the table drawer's Search
      Builder, but the two do not share a grammar. --filter accepts per-sample clauses
      only (VariantSmartFilter), so a Query Builder query carrying filter, pos, type,
      qual, or an INFO comparison is rejected with "Unsupported smart-filter clause"
      (settled at the chapter 28 review on 2026-09-07). The command stages the output first,
      writes a provenance record beside it, and publishes the new VCF only once that
      record is safely saved, restoring the previous record if anything fails. The
      grammar accepts per-sample clauses of the form Sample[<name>].<field>, a count
      over all samples written as count(Sample[*].GT=1/1) >= 5, and a sample-to-sample
      comparison such as Sample[A].GT != Sample[B].GT. Per-sample clauses accept only
      GT, AF, and DP, and DP matches a per-sample FORMAT field only, so a VCF whose
      FORMAT is GT:PL:AD returns nothing for a DP clause even when INFO/DP is set.

  variants.extract-sample:
    title: Extract one sample's variants
    entry_points:
      - "CLI: lungfish-cli variants extract-sample <bundle-path> --sample <sample> --output <vcf>"
    gating: []
    sources:
      - Sources/LungfishCLI/Commands/VariantsCommand.swift
      - Sources/LungfishApp/Views/Viewer/AnnotationTableDrawerView+Columns.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings: []
    cli_only:
      - flag: <bundle-path>
        default: none
        effect: Names the .lungfishref bundle whose variant database holds the sample.
      - flag: --sample
        default: none
        effect: Names the one sample to pull out, using the sample name as the VCF spells it.
      - flag: -o, --output
        default: none
        effect: Names the single-sample VCF that is written.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
      - flag: -t, --threads
        default: auto
        effect: Sets how many threads the extraction may use.
    notes: >-
      This command has no dialog. It is the narrow cousin of variants query, splitting
      one sample out of a multi-sample variant database rather than filtering rows. The
      drawer's Samples tab is the closest in-app surface, but it only hides and shows
      samples in the table rather than writing a file. Sample names can be read off that
      tab, whose columns are a visibility checkbox, Sample, Display Name, and Source.

  variants.gatk-plans:
    title: GATK germline command plans
    entry_points:
      - "CLI: lungfish-cli gatk <subcommand>"
    gating: [gatk-core, experimental]
    sources:
      - Sources/LungfishWorkflow/Conda/PluginPack.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/gatk.txt
    settings: []
    cli_only:
      - flag: --execute
        default: "false"
        effect: Runs the composed command through the managed gatk-core environment and writes a provenance record naming the files it produced. Every subcommand accepts it, and without it the command is only printed.
      - flag: --dry-run
        default: "false"
        effect: Prints the composed command and runs nothing, overriding --execute whenever both are given. Every subcommand accepts it, and on its own it changes nothing because not executing is already the default.
      - flag: --extra-args
        default: none
        effect: Appends your own arguments to the end of the composed command. Every subcommand accepts it. On joint-genotype the arguments land only on the GenotypeGVCFs step, never on the combine or import step.
      - flag: --reference
        default: none
        effect: Names the reference FASTA the subcommand is run against, with its .fai index and .dict dictionary beside it. Required for haplotype-caller, joint-genotype, leftalign, and bqsr.
      - flag: --output
        default: none
        effect: Names the file the subcommand writes. Required by every subcommand that produces one.
      - flag: haplotype-caller
        default: none
        effect: Builds a HaplotypeCaller command that calls germline variants from one BAM, with --bam, --emit-ref-confidence, --ploidy, --intervals, --pcr-indel-model, --stand-call-conf, --max-alternate-alleles, and --pair-hmm-threads.
      - flag: joint-genotype
        default: none
        effect: Builds the commands that combine several per-sample GVCFs into one cohort VCF. Takes --gvcf repeated once per sample, --intermediate, --intervals, and --combine-strategy.
      - flag: --gvcf
        default: none
        effect: Names one input GVCF for joint-genotype, repeated once per sample rather than given a list. Passing none is accepted when it should be refused, so the command exits 0 and prints a CombineGVCFs line carrying no input file.
      - flag: --intermediate
        default: none
        effect: Names the combined store the first joint-genotype step writes and the second reads. Required either way, a path ending .g.vcf.gz when CombineGVCFs runs and a plain folder name when GenomicsDBImport runs.
      - flag: --combine-strategy
        default: auto
        effect: Chooses which GATK tool gathers the GVCFs, accepting auto, combine-gvcfs, or genomicsdb. Under auto a cohort of 50 samples or fewer uses CombineGVCFs and a larger one uses GenomicsDB. An unrecognised value is parsed leniently, falling back to auto with no warning, so a typo such as genomics-db quietly runs the automatic choice.
      - flag: filter
        default: none
        effect: Builds a VariantFiltration command that labels the FILTER column of every row failing one of its tests, leaving the row in place.
      - flag: --preset
        default: best-practices-both
        effect: Chooses which published list of hard filter tests the filter applies, accepting best-practices-snp, best-practices-indel, best-practices-both, and custom. The custom value is unfinished rather than a working option. It applies no filter expressions at all, so the command copies the file and marks nothing, and there is no companion flag for supplying your own tests.
      - flag: select
        default: none
        effect: Builds a SelectVariants command that writes out the subset of rows you describe and discards the rest. Takes --sample, --type, and --intervals.
      - flag: --sample
        default: empty
        effect: Restricts the output to the named sample's column, dropping every other sample from the file. Empty keeps all samples.
      - flag: --type
        default: empty
        effect: Restricts the output to one class of variant, accepting SNP, INDEL, and MIXED. The value is parsed leniently, so an unrecognised class is not rejected and no restriction is applied. Empty keeps every class.
      - flag: --intervals
        default: empty
        effect: Restricts the subcommand to the stretches of the reference named in an interval list, a BED file, a Picard-style interval list, or a bare contig name. Accepted by haplotype-caller, joint-genotype, select, and leftalign with the same meaning.
      - flag: variants-to-table
        default: none
        effect: Builds a VariantsToTable command that flattens a VCF into a spreadsheet-friendly TSV.
      - flag: --fields
        default: CHROM,POS,REF,ALT,QUAL,AF,DP
        effect: Lists which VCF fields become columns of the table, as one comma-separated string. Spaces after commas are ignored.
      - flag: bqsr
        default: none
        effect: Builds the BaseRecalibrator and ApplyBQSR commands that correct systematic base-quality errors, with --bam, --known-sites, --recal-table, --output, and --create-output-bam-index.
      - flag: --known-sites
        default: none
        effect: Names a VCF of positions where human variation is already expected, repeated once per catalogue such as dbSNP and Mills. Its header must declare the same contig lengths as the reference or GATK stops.
      - flag: --recal-table
        default: none
        effect: Names the recalibration table BaseRecalibrator writes and ApplyBQSR reads.
      - flag: --create-output-bam-index
        default: "true"
        effect: Writes a .bai index beside the recalibrated BAM.
      - flag: markdup
        default: none
        effect: Builds a Picard MarkDuplicates command, with --bam repeated per lane, --metrics, --create-index, --remove-duplicates, and --validation-stringency. No chapter of this manual covers it.
      - flag: validate-sam
        default: none
        effect: Builds a Picard ValidateSamFile command that checks a BAM for format problems, with --mode set to SUMMARY or VERBOSE, --validate-index, and --ignore-warnings. No chapter of this manual covers it.
      - flag: leftalign
        default: none
        effect: Builds a LeftAlignAndTrimVariants command that rewrites each indel at the leftmost position it can occupy. Requires --reference, and takes --split-multi-allelics, --max-indel-length, and --max-leading-bases.
      - flag: --split-multi-allelics
        default: "false"
        effect: Splits a row carrying more than one alternate allele into one row per allele. LGE writes this argument into the GATK command with an explicit true or false every time, so it appears in the preview even when the flag is left off.
      - flag: --max-indel-length
        default: "200"
        effect: Sets the longest indel leftalign will attempt to realign, in bases. An indel above the limit is passed through in whatever position the caller wrote it, and nothing in the output says so.
      - flag: --max-leading-bases
        default: "1000"
        effect: Sets how far to the left leftalign will shift an indel while looking for its canonical position, in bases.
      - flag: collect-metrics
        default: none
        effect: Builds a Picard CollectVariantCallingMetrics command that summarises a call set against a known-variants VCF, with --output-prefix, --dbsnp, --sequence-dictionary, and --gvcf-input.
      - flag: --output-prefix
        default: none
        effect: Names the path stem the two metrics files are built from. Required, and Picard appends .variant_calling_summary_metrics and .variant_calling_detail_metrics to it.
      - flag: --dbsnp
        default: none
        effect: Names the VCF of already-known variants every call is checked against. Required, and it must describe the same contigs as the calls or the step fails.
      - flag: --sequence-dictionary
        default: empty
        effect: Names the .dict file describing the reference's contigs and their lengths. Optional, and Picard otherwise falls back on the dictionary embedded in the VCF headers.
      - flag: --gvcf-input
        default: "false"
        effect: Tells Picard the input is a GVCF rather than an ordinary VCF, since the counting logic differs.
    notes: >-
      This whole toolchain is command line only. The GUI reaches just one of its ten
      subcommands, HaplotypeCaller, through the Call Variants dialog, and with far fewer
      settings. The command overview states the contract plainly, that it "Builds
      reproducible GATK command lines by default" and that --execute is what actually
      runs anything. The gatk-core pack is marked experimental and pins GATK 4.6.2.0.
      Every subcommand takes --reference or --vcf as its main input and --output as its
      destination, and the same three shared flags above. Two values are parsed
      leniently rather than rejected, --combine-strategy on joint-genotype and --type on
      select, and --preset custom is an unfinished option that applies no filter at all.
      Three GATK options on joint-genotype are fixed and have no flag, the calling
      confidence threshold of 30.0, -G AS_StandardAnnotation, and each step's working
      directory.

  variants.phase:
    title: Phase-aware GATK plus WhatsHap plan
    entry_points:
      - "CLI: lungfish-cli variants phase --reference <fasta> --bam <bam> --output-vcf <vcf>"
    gating: [gatk-core, phasing, experimental]
    sources:
      - Sources/LungfishWorkflow/Variants/PhasedVariantCallingPlan.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishWorkflow/Conda/PluginPack.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings: []
    cli_only:
      - flag: --reference
        default: none
        effect: Names the reference FASTA both tools are run against.
      - flag: --bam
        default: none
        effect: Names the input alignment. Phasing needs reads long enough to span two nearby variants, so long reads or linked reads work best.
      - flag: --output-vcf
        default: none
        effect: Names the final phased VCF the plan produces.
      - flag: --output-dir
        default: the folder holding the output VCF
        effect: Chooses where the written command plan and its provenance record land.
      - flag: --sample
        default: none
        effect: Names the sample WhatsHap should phase, for a VCF carrying more than one.
      - flag: --threads
        default: "1"
        effect: Sets how many threads the GATK read-to-haplotype scoring step uses.
      - flag: --extra-gatk-args
        default: none
        effect: Adds your own arguments to the HaplotypeCaller half of the plan.
      - flag: --extra-whatshap-args
        default: none
        effect: Adds your own arguments to the WhatsHap phase half of the plan.
      - flag: --execute
        default: "false"
        effect: Runs GATK and WhatsHap through the managed tool packs rather than only writing the plan.
      - flag: --dry-run
        default: "false"
        effect: Writes and prints the command plan without running either tool.
    notes: >-
      Phasing sorts nearby variants onto the same copy of a chromosome or onto opposite
      copies, which is what separates two changes that disable both copies of a gene
      from two that leave one copy intact. The plan is two steps, GATK HaplotypeCaller
      to make the calls and WhatsHap to phase them against the reads. This is the
      working route to a phased plan, since the dialog's GATK + WhatsHap Phased entry
      builds its plan but never launches it and ends in a "Variant Calling Not Ready"
      alert. Two experimental packs are needed, gatk-core for GATK 4.6.2.0 and phasing
      for WhatsHap 2.3.

  classify.kraken2:
    title: Kraken2
    entry_points:
      - "Tools > Classification > Kraken2..."
      - "Right-click a FASTQ in the sidebar > Classify with Kraken2..."
      - "CLI: lungfish-cli conda classify <fastq-files> --db <db> --profile --output-dir <dir>"
    gating: [metagenomics]
    sources:
      - Sources/LungfishApp/Views/Metagenomics/ClassificationWizardSheet.swift
      - Sources/LungfishWorkflow/Metagenomics/ClassificationConfig.swift
      - Sources/LungfishWorkflow/Metagenomics/BrackenProfileModels.swift
      - Sources/LungfishApp/App/ToolsMenuModel.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishKit/MultiBundleRunModePicker.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/conda.txt
    settings:
      - label: Database
        control: popup
        default: the first installed database that finished downloading
        allowed: any installed Kraken2 database, listed with its size on disk
        effect: Names the reference collection every read is compared against. A read can only be given a name that exists in this database, so a viral-only database will never report a bacterium.
        when_to_change: Pick a small database like Viral when you already know what family you are looking for, and a Standard or PlusPF database when you want an unbiased survey.
        cli_flag: --db
      - label: Sensitivity
        control: radio
        default: Balanced
        allowed: Sensitive, Balanced, Precise
        effect: Sets the Confidence and Min hit groups values together, trading how many reads get a name against how often that name is right. Sensitive uses confidence 0.0 with 1 hit group, Balanced uses 0.2 with 2, and Precise uses 0.5 with 3.
        when_to_change: Move to Precise when a false positive would be costly, such as reporting a pathogen, and to Sensitive when you are hunting for something rare and can check the hits by hand.
        cli_flag: --preset
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: Run separately per bundle
        effect: Shows how several selected samples are handled. The choice is locked because pooling reads across samples before classification would mix up the per-sample abundance numbers.
        when_to_change: rarely
        cli_flag: null
      - label: "Confidence:"
        control: slider
        default: "0.20"
        allowed: 0.00 to 1.00 in steps of 0.05, set with the slider or typed into its number field
        effect: Sets how much of a read must match a taxon before Kraken2 will commit to that name. A read that falls short is pushed up to a broader group or left unclassified rather than being named.
        when_to_change: Raise it when the report is full of implausible species, and lower it when too many reads come back unclassified.
        cli_flag: --confidence
      - label: "Min hit groups:"
        control: number
        default: "2"
        allowed: 1 to 10
        effect: Sets how many separate database hits a read must have before Kraken2 names it at all, where a hit group is a run of overlapping k-mers that share one minimizer found in the database. One long chance match is easier to get than two independent ones.
        when_to_change: Raise it when short repeated sequence is producing spurious calls, and lower it for very short reads that cannot hold two separate matches.
        cli_flag: --min-hit-groups
      - label: "Threads:"
        control: number
        default: "4"
        allowed: 1 up to the number of processor cores on your Mac
        effect: Sets how many processor cores Kraken2 uses at once. More threads finish sooner and leave less of the machine free for other work.
        when_to_change: Lower it when you need the machine responsive for something else while the run proceeds.
        cli_flag: --threads
      - label: "Memory mapping:"
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Reads the database from disk in pieces instead of loading the whole thing into memory. The run is much slower but it does not need the database to fit in RAM.
        when_to_change: Turn it on when the wizard warns that the database needs more memory than your Mac has. The wizard turns it on for you when you pick such a database.
        cli_flag: --memory-mapping
      - label: "Extra arguments:"
        control: text
        default: empty
        allowed: any shell-style argument list that Kraken2 accepts
        effect: Passes text straight through to Kraken2 without the app checking it. An unclosed quote blocks the run and the dialog says so.
        when_to_change: Use it only for a Kraken2 option the wizard does not expose, after reading the Kraken2 documentation.
        cli_flag: --extra-args
    cli_only:
      - flag: --profile
        default: "false"
        effect: Runs Bracken abundance re-estimation after classification. The wizard always does this, so the CLI needs the flag to match.
      - flag: --paired
        default: "false"
        effect: Treats the two input files as read 1 and read 2 of the same fragments.
      - flag: --read-format
        default: auto
        effect: Sets the read layout, one of auto, unpaired, paired, or interleaved. auto scans a single input, and a file or bundle whose records strictly alternate read 1 and read 2 runs as pairs, split into two temporary mate files for Kraken2's --paired mode. Pairs mixed with merged reads, and true single-end input, run unpaired. Two separate files still need --paired. The wizard makes the same choice for each sample.
      - flag: --recursive
        default: "false"
        effect: When an input is a folder, also picks up eligible FASTQ or FASTA files inside its subfolders.
      - flag: --quick
        default: "false"
        effect: Stops examining a read as soon as one taxon matches, which is faster and less careful.
      - flag: --bracken-read-length
        default: "150"
        effect: Tells Bracken how long the reads are so it can pick the matching precomputed distribution file.
      - flag: --bracken-level
        default: automatic for the selected database
        effect: Sets the rank Bracken reports at, one of D, P, C, O, F, G, or S.
      - flag: --bracken-threshold
        default: "10"
        effect: Drops taxa with fewer than this many reads before Bracken redistributes abundance.
      - flag: --output-dir
        default: the current directory
        effect: Chooses where the report, per-read output, and Bracken profile are written.
    notes: >-
      The wizard always runs Bracken after Kraken2, using rank automatic, read length 150,
      and threshold 10, and it exposes none of those three as controls. Results land in
      Analyses/kraken2-<timestamp>/ inside the project, never beside the source FASTQ. When
      the selected database needs more memory than the Mac has, a banner names the required
      and available gigabytes and the memory mapping box is checked for you. Bracken runs
      from a scratch folder whose path holds no spaces, so a project folder or database
      path with a space in its name works.

  classify.esviritu:
    title: EsViritu
    entry_points:
      - "Tools > Classification > EsViritu..."
      - "CLI: lungfish-cli esviritu detect --input <fastq> --sample <name> --output <dir>"
    gating: [metagenomics]
    sources:
      - Sources/LungfishApp/Views/Metagenomics/EsVirituWizardSheet.swift
      - Sources/LungfishWorkflow/Metagenomics/EsVirituConfig.swift
      - Sources/LungfishKit/MultiBundleRunModePicker.swift
      - Sources/LungfishApp/App/ToolsMenuModel.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/esviritu.txt
    settings:
      - label: Sample
        control: text
        default: the sample name worked out from the file name, filled in when the sheet opens
        allowed: any text
        effect: Names the sample in the output files and in the result viewport. It only appears for a single-sample run.
        when_to_change: Set it when the file name is not the label you want to see in reports.
        cli_flag: --sample
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: Run separately per bundle, with a second Combine all inputs and run once row shown but disabled, under a title that names the number of selected bundles
        effect: Shows how several selected samples are handled. Only the per-bundle row can be chosen, and the caption beneath it says each bundle gets its own operations entry and the results are merged into one summary (corrected 2026-09-07 at the chapter 34 review, the earlier pooling rationale was a source comment rather than on-screen text).
        when_to_change: rarely
        cli_flag: null
      - label: Enable quality filtering (fastp)
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Trims sequencing adapters and drops poor-quality bases before detection. Turning it off feeds the raw reads straight to EsViritu.
        when_to_change: Turn it off when the reads were already trimmed and filtered by an earlier step, so they are not cleaned twice.
        cli_flag: --no-qc
      - label: "Threads:"
        control: number
        default: the number of processor cores currently available on your Mac
        allowed: 1 up to the number of processor cores on your Mac
        effect: Sets how many processor cores EsViritu uses at once. More threads finish sooner and leave less of the machine free.
        when_to_change: Lower it when you need the machine responsive for something else.
        cli_flag: --threads
      - label: "Extra arguments:"
        control: text
        default: empty
        allowed: any shell-style argument list that EsViritu accepts
        effect: Passes text straight through to EsViritu without the app checking it. An unclosed quote blocks the run and the dialog says so.
        when_to_change: Use it only for an EsViritu option the wizard does not expose.
        cli_flag: --extra-args
    cli_only:
      - flag: --db
        default: auto-detect
        effect: Points at a specific EsViritu database folder instead of the installed one the wizard finds for you.
      - flag: --paired
        default: "false"
        effect: Treats the two input files as read 1 and read 2 of the same fragments.
      - flag: --read-format
        default: auto
        effect: >-
          Sets how EsViritu reads the input. auto checks a single file. A file whose records
          strictly alternate read 1 and read 2 runs as interleaved pairs. A file that mixes
          pairs with merged or unpaired reads, or holds single-end reads, runs as unpaired.
          The other values are unpaired, paired and interleaved.
      - flag: --recursive
        default: "false"
        effect: When an input is a folder, also picks up eligible FASTQ files inside its subfolders.
      - flag: --output
        default: the current directory
        effect: Chooses where the detection tables and coverage files are written.
    notes: >-
      The database is not a control. EsViritu uses the one curated viral database the app
      installs, and the wizard shows its version and size instead of a picker, with a
      Download Database... button when it is missing. Separate CLI subcommands manage it,
      esviritu download-db and esviritu db-status. Results land in
      Analyses/esviritu-<timestamp>/ inside the project.

  classify.taxtriage:
    title: TaxTriage
    entry_points:
      - "Tools > Classification > TaxTriage..."
      - "CLI: lungfish-cli taxtriage run --input <fastq> --sample <name> --output <dir>"
    gating: [metagenomics, docker]
    sources:
      - Sources/LungfishApp/Views/Metagenomics/TaxTriageWizardSheet.swift
      - Sources/LungfishWorkflow/TaxTriage/TaxTriageConfig.swift
      - Sources/LungfishWorkflow/TaxTriage/TaxTriagePipeline.swift
      - Sources/LungfishIO/Formats/FASTQ/FASTQSampleMetadata.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/taxtriage.txt
    settings:
      - label: Sample ID
        control: text
        default: "Sample_1, then Sample_2 and so on for each row you add"
        allowed: any text
        effect: Names one row of the sample list. TaxTriage reports each sample under this label.
        when_to_change: Change it to the identifier your lab already uses so the report matches your records.
        cli_flag: --sample
      - label: Sample role
        control: popup
        default: Clinical Sample
        allowed: Clinical Sample, Negative Control, Positive Control, Environmental Control, Extraction Blank
        effect: Tells TaxTriage what kind of material a row is, so control samples can be compared against the test samples when confidence is scored.
        when_to_change: Set it on every control you ran alongside the samples, since a blank labelled as a clinical sample tells the pipeline nothing.
        cli_flag: null
      - label: Kraken2 Database
        control: popup
        default: the first installed Kraken2 database
        allowed: any installed Kraken2 database
        effect: Names the reference collection TaxTriage classifies against. TaxTriage reuses the same databases the Kraken2 tool uses.
        when_to_change: Match it to the breadth of organism you expect, the same way you would for a plain Kraken2 run.
        cli_flag: --db
      - label: Sequencing Platform
        control: radio
        default: Illumina
        allowed: Illumina, Oxford Nanopore, PacBio
        effect: Tells the pipeline what kind of reads it is handling so it can choose error tolerances and alignment settings that match.
        when_to_change: Match it to the machine that produced the reads, since long noisy reads and short accurate reads need different handling.
        cli_flag: --platform
      - label: Skip assembly (faster)
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Leaves out the assembly stage and runs classification plus confidence scoring only. Turning it off adds de novo assembly, which is much slower but produces genome sequences.
        when_to_change: Turn it off when you want assembled genomes for the organisms found, and you can spare the extra hours.
        cli_flag: --no-skip-assembly
      - label: "K2 Confidence:"
        control: slider
        default: "0.20"
        allowed: 0.00 to 1.00 in steps of 0.05
        effect: Sets how much of a read must match a taxon before the Kraken2 step inside TaxTriage will commit to that name. Reads that fall short are pushed to a broader group.
        when_to_change: Raise it when the organism list is full of implausible species, and lower it when too much is left unclassified.
        cli_flag: --confidence
      - label: "Top hits:"
        control: number
        default: "10"
        allowed: 1 to 100
        effect: Sets how many organisms the report lists, ranked by how much evidence supports each one.
        when_to_change: Raise it when you expect a complex community and the top ten would cut off organisms you care about.
        cli_flag: --top-hits
      - label: "Max memory:"
        control: number
        default: 16 GB
        allowed: 2 to 256 GB in steps of 2
        effect: Caps how much memory the pipeline is allowed to use. Set it above what your Mac has and steps will fail rather than run.
        when_to_change: Raise it for a large database on a machine with plenty of memory, and lower it to leave room for other work.
        cli_flag: --max-memory
      - label: "Max CPUs:"
        control: number
        default: the number of processor cores currently available on your Mac
        allowed: 1 up to the number of processor cores on your Mac
        effect: Caps how many processor cores the pipeline may use at once.
        when_to_change: Lower it when you need the machine responsive for something else.
        cli_flag: --max-cpus
      - label: Skip Krona visualization
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Leaves out the interactive Krona chart of the community. The tables are unaffected.
        when_to_change: Turn it on to shorten the run when you only want the tables.
        cli_flag: --skip-krona
      - label: "Extra arguments:"
        control: text
        default: empty
        allowed: any shell-style argument list that TaxTriage or Nextflow accepts
        effect: Passes text straight through to the pipeline without the app checking it. An unclosed quote blocks the run and the dialog says so.
        when_to_change: Use it only for a pipeline option the wizard does not expose.
        cli_flag: --extra-args
    cli_only:
      - flag: --input2
        default: none
        effect: Names the read 2 file of a paired-end sample. The dialog picks R2 up from the file selection instead.
      - flag: --samplesheet
        default: none
        effect: Reads the whole sample list from a CSV file rather than naming samples one at a time.
      - flag: --recursive
        default: "false"
        effect: When the input is a folder, also picks up eligible FASTQ files inside its subfolders.
      - flag: --rank
        default: S
        effect: Sets the taxonomic rank the report is built at, one of D, P, C, O, F, G, or S.
      - flag: --nf-profile
        default: docker
        effect: Chooses the Nextflow execution profile, which decides how the pipeline's containers are run.
      - flag: --revision
        default: e10bfebda32a62711f38a4e23ab03b61725a9675
        effect: Pins which commit of the TaxTriage pipeline to run. Leave it alone unless you are reproducing an older run.
    notes: >-
      TaxTriage is the only classifier here that needs more than the metagenomics pack.
      It runs the jhuapl-bio/taxtriage Nextflow pipeline inside containers, so Nextflow
      and Docker (or Apple Containerization on macOS 26 and later) must both be present.
      The wizard checks for both and shows the result before it will let you run. Results
      land in Analyses/taxtriage-<timestamp>/ inside the project.

  classify.blast-verify:
    title: BLAST Verify
    entry_points:
      - "Taxonomy viewport action bar > BLAST Verify"
      - "Right-click a taxon in the taxonomy viewport > BLAST Matching Reads..."
      - "CLI: lungfish-cli blast verify --kreport <kreport> --source <fastq> --kraken-output <kraken> --taxid <taxid>"
    gating: []
    sources:
      - Sources/LungfishKit/BlastConfigPopoverView.swift
      - Sources/LungfishKit/BlastResultsDrawerTab.swift
      - Sources/LungfishKit/ClassifierActionBar.swift
      - Sources/LungfishApp/Views/Metagenomics/TaxonomyViewController.swift
      - Sources/LungfishApp/Views/Metagenomics/TaxonomyViewController+Blast.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/blast.txt
    settings:
      - label: "Reads to submit:"
        control: slider
        default: "20"
        allowed: 1 to 50 in the popover slider, capped at the number of reads the taxon actually has, and 1 to 100 on the command line
        effect: Sets how many of the taxon's reads are sent to NCBI to be checked against the whole nucleotide database. More reads give a firmer answer and take longer.
        when_to_change: Lower it to get a quick sanity check, and raise it when the first answer comes back mixed and you want a clearer verdict.
        cli_flag: --reads
    cli_only:
      - flag: --include-children
        default: "false"
        effect: Also submits reads assigned to taxa below the chosen one, such as the species inside a genus.
      - flag: --max-concurrent
        default: "1"
        effect: Caps how many BLAST submissions this process keeps in flight at once, which keeps you inside NCBI's usage limits.
      - flag: --extra-args
        default: none
        effect: Passes extra NCBI URL API parameters as KEY=VALUE tokens, for example WORD_SIZE=11.
    notes: >-
      There is nothing else to configure. The database is fixed at NCBI nt, the program at
      blastn, and the hit list at five hits per read, none of which the popover or the CLI
      exposes. The popover warns that the reads leave the app for NCBI. When a taxon has
      only one read the slider disappears and the popover states the fixed count
      instead. Results arrive in a drawer under the table with one of four verdicts,
      Supported, Mixed, Unsupported, or Inconclusive, plus supporting and contradicting
      counts. The drawer shows six columns by default and hides five, which are
      Accession, Coverage, Align Length, Tax ID, and Verdict, each reachable by
      right-clicking the column header.

  classify.extract-reads-by-taxon:
    title: Extract Reads
    entry_points:
      - "Right-click a taxon in the taxonomy viewport > Extract Reads..."
      - "Taxonomy viewport action bar > Extract FASTQ"
      - "CLI: lungfish-cli extract reads --by-classifier --tool kraken2 --result <run-dir> --taxon <taxid> --source <fastq> --output <fastq>"
      - "CLI (older form): lungfish-cli conda extract --kraken-output <kraken> --source <fastq> --output <fastq> --taxid <taxid>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Metagenomics/TaxonomyReadExtractionAction.swift
      - Sources/LungfishApp/Views/Metagenomics/ClassifierExtractionDialog.swift
      - Sources/LungfishKit/ClassifierActionBar.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/extract.txt
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/conda.txt
    settings:
      - label: "Format:"
        control: radio
        default: FASTQ
        allowed: FASTQ, FASTA
        effect: Chooses whether the pulled-out reads keep their per-base quality scores or come out as sequence only. FASTQ keeps the scores, FASTA drops them.
        when_to_change: Choose FASTA when the next tool only wants sequence, such as a BLAST submission or an alignment.
        cli_flag: --read-format
      - label: Include unmapped mates of mapped pairs
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Also pulls out the partner read of any pair where only one of the two was assigned to this taxon. The dialog shows how many extra reads that adds.
        when_to_change: Turn it on when you plan to assemble or map the extracted reads, since both halves of a pair carry more information than one.
        cli_flag: --include-unmapped-mates
      - label: "Destination:"
        control: radio
        default: Save as Bundle
        allowed: Save as Bundle, Save to File..., Copy to Clipboard, Share...
        effect: Chooses where the extracted reads go. Save as Bundle puts them in your project as a new dataset you can run other tools on.
        when_to_change: Choose Save to File when the reads are going to another program, and Copy to Clipboard only for a handful of reads to paste somewhere.
        cli_flag: --output
      - label: "Name:"
        control: text
        default: kraken2_ followed by the taxon name with spaces as underscores, with a timestamp appended when left unchanged
        allowed: any text, and it cannot be blank
        effect: Names the bundle or file that is written. It only appears for the Save as Bundle and Save to File destinations.
        when_to_change: Change it when the suggested name will not tell you what the reads are six months from now.
        cli_flag: --bundle-name
    cli_only:
      - flag: --tool
        default: none
        effect: Names the classifier whose result is read, one of esviritu, taxtriage, kraken2, naomgs, or nvd.
      - flag: --result
        default: none
        effect: Names the classifier run's result directory. Handing it a single .kraken file fails with a not-located message rather than one naming the expected argument.
      - flag: --taxon
        default: none
        effect: Names the taxonomy IDs to extract, repeatable, for a kraken2 result. The dialog takes these from the rows you selected.
      - flag: --sample
        default: none
        effect: Names the sample the following --accession and --taxon flags apply to, repeatable.
      - flag: --bundle
        default: "false"
        effect: Wraps the output in a .lungfishfastq bundle, which --bundle-name implies.
    notes: >-
      Copy to Clipboard is disabled above 10,000 reads, with a tooltip saying to choose
      another destination. The unmapped-mates checkbox is hidden for Kraken2 results, where
      it does not apply, and --include-unmapped-mates is rejected with --tool kraken2 in
      the same way. Bundles written this way go to the project's Extractions folder,
      not Imports. The older lungfish-cli conda extract command still exists with its
      own --kraken-output, --taxid, --kreport, --include-children, and --no-read-pairs
      options, but extract reads --by-classifier shares ClassifierReadResolver with the
      dialog and gives byte-identical output, so it is the form the manual documents
      (reconciled 2026-09-07 at the chapter 33 review).

  classify.taxonomy-browser:
    title: Taxonomy viewport
    entry_points:
      - "Select a classification result in the sidebar"
      - "Analyses > <tool>-<timestamp> in the project sidebar"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Metagenomics/TaxonomyViewController.swift
      - Sources/LungfishApp/Views/Metagenomics/TaxonomyTableView.swift
      - Sources/LungfishApp/Views/Metagenomics/TaxonomySunburstView.swift
      - Sources/LungfishKit/ClassifierSamplePickerView.swift
      - Sources/LungfishKit/ClassifierActionBar.swift
    settings:
      - label: "Filter taxa…"
        control: text
        default: empty
        allowed: any text
        effect: Hides every row whose taxon name, rank, or read count does not contain what you type. The count beside the field shows how many rows are left.
        when_to_change: Use it whenever you are looking for one organism in a report with thousands of rows.
        cli_flag: null
      - label: Bracken
        control: checkbox
        default: hidden
        allowed: shown when the result carries Bracken numbers, hidden otherwise
        effect: Adds a column of read counts that Bracken re-estimated, which corrects Kraken2's habit of parking reads at a broad rank instead of the species below it. The column appears on its own when Bracken ran.
        when_to_change: You do not control this. It appears when the result has Bracken numbers to show.
        cli_flag: null
      - label: Select All
        control: checkbox
        default: "true, so every sample starts selected"
        allowed: "true, false"
        effect: Ticks or unticks every sample currently visible in the sample picker, which sits in the Inspector's Samples & Metadata section under Sample Filter and appears for single-sample results too.
        when_to_change: Use it to start from all samples and untick a few, rather than ticking twenty by hand.
        cli_flag: null
      - label: "Filter…"
        control: text
        default: empty
        allowed: any text
        effect: Narrows the sample list in the sample picker to names containing what you type. It changes which samples you can tick, not which are already ticked.
        when_to_change: Use it on a run with many samples when you want to tick only one plate or one collection date.
        cli_flag: null
      - label: Column header filter
        control: text
        default: no filter on any column
        allowed: text or a numeric comparison, depending on the column
        effect: Restricts one column to rows matching a value or a numeric range you set from the column header's own menu. Several column filters apply together.
        when_to_change: Use it to hold a report to species rank only, or to rows above a read count you consider meaningful.
        cli_flag: null
    cli_only: []
    notes: >-
      The sunburst chart on the left has no settings. You navigate it by clicking a segment
      to select it, double-clicking to re-center on it, and right-clicking for Zoom to,
      Zoom Out to Root, Copy Taxon Name, Copy Taxonomy Path, Look Up on NCBI, and BLAST
      Matching Reads. Its only right-click item over empty space is Copy Chart as PNG.
      The table's columns are Sample, Taxon Name, Rank, Reads (the taxon and everything
      under it), Direct (that taxon alone), Bracken, and the percent column.

  classify.install-database:
    title: Databases
    entry_points:
      - "Tools > Plugin Manager... > Databases"
      - "Kraken2 wizard > Download Database..."
      - "CLI: lungfish-cli conda db download <name>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/PluginManager/PluginManagerView.swift
      - Sources/LungfishApp/Views/PluginManager/PluginManagerViewModel.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - Sources/LungfishApp/App/MainMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/conda.txt
    settings:
      - label: Download
        control: file
        default: no database is installed until you ask for one
        allowed: "Kraken2 collections Standard, Standard-8, Standard-16, PlusPF, PlusPF-8, PlusPF-16, Viral, MinusB, EuPathDB46, plus the locally built SILVA and Greengenes, plus the EsViritu Viral DB"
        effect: Fetches one database and unpacks it into the app's managed storage. The row shows the download size, the memory the database wants, and the progress while it runs.
        when_to_change: Download the one your work needs. The header names the database recommended for your Mac's memory, which is the safe first choice.
        cli_flag: "conda db download <name>"
      - label: Remove
        control: file
        default: nothing is removed unless you ask
        allowed: any installed database
        effect: Deletes an installed database and frees its disk space, after a confirmation sheet that names the database.
        when_to_change: Remove a database you no longer classify against, since the large ones take tens of gigabytes.
        cli_flag: "conda db remove <name> --delete-files"
      - label: Update
        control: file
        default: nothing is updated unless you ask
        allowed: any installed database that has a newer pinned version
        effect: Replaces an installed database with the version pinned in the app's dependency list. Databases built on your own machine cannot be updated in place and are reported as skipped.
        when_to_change: Update when the row says an update is available and you want your results to match the current pinned build.
        cli_flag: "conda db update <name> --yes"
      - label: Refresh
        control: file
        default: the list is loaded when you open the tab
        allowed: not applicable
        effect: Re-reads the catalog and the installed set, so a database installed elsewhere shows up.
        when_to_change: Use it when a download you started outside this window has finished and the list still looks stale.
        cli_flag: "conda db list"
      - label: Storage Settings...
        control: file
        default: the app's own managed storage folder
        allowed: any folder you have permission to write
        effect: Opens the setting that decides where downloaded databases live. The footer shows the current folder and the total space in use.
        when_to_change: Change it when the startup disk is too small for a Standard database and you want to keep them on an external drive.
        cli_flag: null
    cli_only:
      - flag: "conda db recommend"
        default: not applicable
        effect: Prints the database recommended for this machine's memory, the same one the Databases tab highlights.
      - flag: "conda db info <name>"
        default: not applicable
        effect: Prints the installed version of one database and whether an update is available.
      - flag: "conda db install-managed <id>"
        default: not applicable
        effect: Installs a managed helper dataset by identifier, such as the Deacon panhuman host-removal index. Add --list to see the identifiers.
      - flag: "conda db update --all --yes"
        default: not applicable
        effect: Updates every installed database that has an update available, in one command.
    notes: >-
      The Kraken2 collection set is closed at nine downloadable collections, and SILVA plus
      Greengenes are built on your machine rather than downloaded. The tab groups rows by
      tool, Kraken2 first, then EsViritu, then TaxTriage. There is no control for where a
      database comes from, since every source is pinned in the app's dependency manifest.

  classify.twelve-s-match:
    title: 12S Amplicon Matching
    entry_points:
      - "Tools > Genotyping > 12S Amplicon Matching..."
      - "Tools > Workflow Library... > 12S Amplicon Matching"
      - "CLI: lungfish-cli fastq 12s-match <inputs> --reference <ref> --output-dir <dir> --output-name <name>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationsDialog.swift
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationDialogState.swift
      - Sources/LungfishApp/Views/Inspector/Sections/TwelveSResultDisplaySection.swift
      - Sources/LungfishWorkflow/TwelveS/TwelveSAmpliconReadClassifier.swift
      - Sources/LungfishWorkflow/TwelveS/TwelveSAbundanceReassigner.swift
      - Sources/LungfishTwelveSUI/TwelveSResultDisplayState.swift
      - Sources/LungfishTwelveSUI/TwelveSAmpliconResultViewController.swift
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
    settings:
      - label: Reference
        control: file
        default: none, and the run will not start without one
        allowed: a deduplicated 12S FASTA, or a .lungfish12sref bundle
        effect: Names the collection of known 12S sequences every read is matched against. A species missing from this reference can never be reported.
        when_to_change: Use a reference built for the animal group you are studying, since a fish-only reference will not name the mammals in a gut sample.
        cli_flag: --reference
      - label: Analysis Metadata
        control: file
        default: "No analysis metadata selected"
        allowed: a CSV or TSV of per-sample metadata
        effect: Freezes a table of per-sample information into the result so the viewport can show it as extra columns.
        when_to_change: Supply it when you want collection site, date, or host recorded alongside the species counts.
        cli_flag: --sample-metadata
      - label: Read Platform
        control: radio
        default: Illumina exact
        allowed: Illumina exact, ONT indel-tolerant
        effect: Chooses how forgiving the match must be. Illumina exact accepts only reads that contain a reference sequence with no substitutions, while ONT indel-tolerant also allows insertions and deletions.
        when_to_change: Switch to ONT indel-tolerant for Oxford Nanopore reads, whose main error type is the insertion or deletion this mode allows.
        cli_flag: --matching-mode
      - label: Result Name
        control: text
        default: a name built from the selected read files
        allowed: any text
        effect: Names the .lungfish12s result bundle the run writes.
        when_to_change: Change it when the suggested name will not identify the run later.
        cli_flag: --output-name
      - label: Min Soft Clip
        control: number
        default: "1"
        allowed: 0 or more
        effect: Sets how many of the read's own bases must sit on each side of the matched reference stretch. It rejects reads that only just overlap the target.
        when_to_change: Raise it when short partial overlaps are producing matches you do not trust.
        cli_flag: --min-soft-clip
      - label: Max Indels
        control: number
        default: "3"
        allowed: 0 or more
        effect: Sets how many inserted or deleted bases a read may carry and still count as a match. The field only takes effect in the ONT indel-tolerant platform setting.
        when_to_change: Raise it for noisier Nanopore chemistry, and lower it when you want only near-perfect matches.
        cli_flag: --max-indels
      - label: Run vsearch chimera review
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Checks the unresolved sequence clusters for chimeras, which are artificial sequences stitched together from two real templates during PCR. Each cluster comes back marked as not reviewed, not detected, candidate, or confirmed, and the review itself writes only not detected or candidate.
        when_to_change: Leave it on. Turn it off only to shorten a run where you will not look at the unresolved clusters.
        cli_flag: --chimera-review
      - label: Directory
        control: file
        default: the project's 12S amplicon results folder
        allowed: any folder you have permission to write
        effect: Chooses where the result bundle is written.
        when_to_change: Change it only when the result belongs outside the project folder.
        cli_flag: --output-dir
      - label: Minimum Exact Reads
        control: number
        default: "0"
        allowed: 0 to 1,000,000
        effect: Hides species rows in the result viewport with fewer exact-matching reads than this. It filters the display only and does not change the stored result.
        when_to_change: Raise it to cut the long tail of one-read and two-read hits that are usually noise.
        cli_flag: --min-exact-reads
      - label: Exclude Human
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Hides the Homo sapiens row, taxid 9606, from the species table.
        when_to_change: Turn it on for diet or environmental studies, where human reads are handler contamination rather than a result.
        cli_flag: --exclude-human
      - label: Only With Alternates
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Shows only species whose matched sequence is shared with at least one other species, so the name is not certain.
        when_to_change: Turn it on when you want to review exactly which calls are ambiguous before reporting them.
        cli_flag: --require-alternate-matches
      - label: Taxon Groups
        control: checkbox
        default: every group shown
        allowed: the groups present in the reference, for example Mammal, Fish, Bird
        effect: Includes or excludes whole groups of animals from the species table. Each group's pill cycles through neutral, included, and excluded.
        when_to_change: Use it to hold a mixed result to one group, such as fish only in a diet study.
        cli_flag: --taxon-group
      - label: Minimum Unresolved Reads
        control: number
        default: "0"
        allowed: 0 to 1,000,000
        effect: Hides unresolved sequence clusters with fewer reads than this. It applies to the Unresolved table and the Excel export.
        when_to_change: Raise it to skip singleton clusters, which are usually sequencing error rather than a real unknown species.
        cli_flag: --min-unresolved-reads
      - label: Chimera
        control: popup
        default: All
        allowed: All, Not Reviewed, Not Detected, Candidate, Confirmed
        effect: Restricts the unresolved clusters shown to one chimera verdict.
        when_to_change: Choose Not Detected to look only at clusters that might be genuinely new sequence, rather than PCR artifacts.
        cli_flag: --chimera-status
    cli_only:
      - flag: --ambiguity-resolution
        default: strict
        effect: Decides how a read matching several species is assigned. strict gives it to whichever species has any lead elsewhere in the sample, conservative requires the winner to have at least twice the runner-up and at least ten reads.
      - flag: --reference-metadata
        default: the metadata inside the reference bundle, when there is one
        effect: Supplies a target metadata TSV that overrides the one packaged with the reference bundle.
      - flag: --force
        default: "false"
        effect: Replaces an output bundle that already exists at that path.
      - flag: "fastq 12s-reference-metadata"
        default: not applicable
        effect: Builds the target metadata TSV from a deduplicated FASTA plus a MIDORI metadata TSV.
      - flag: "fastq 12s-reference-bundle"
        default: not applicable
        effect: Packages that FASTA and metadata pair into a reusable .lungfish12sref bundle. The dialog's Create 12S Reference button does the same thing.
      - flag: "fastq 12s-export"
        default: not applicable
        effect: Writes the species rows to CSV, TSV, or Excel from the command line, taking the same filters the viewport offers.
      - flag: "fastq 12s-export-unresolved"
        default: not applicable
        effect: Writes unresolved clusters above a read threshold to FASTA, with --min-reads defaulting to 5. The viewport has no FASTA export.
    notes: >-
      The workflow expects reads that are already merged. It does not merge Illumina pairs
      for you, so merge them with a read-processing operation first or the 244 base targets
      will come back empty. 12S Amplicon Matching is a specialized workflow, so it has to be
      enabled in the Workflow Library before it appears under Tools > Genotyping. The
      viewport's own controls, from Minimum Exact Reads down, filter the display and do not
      change the stored result, which is why each maps to an export flag rather than a run
      flag.

  assemble.spades:
    title: SPAdes
    entry_points:
      - "Tools > Assembly > SPAdes..."
      - "CLI: lungfish-cli assemble <fastq-files> --assembler spades"
    gating: [assembly]
    sources:
      - Sources/LungfishApp/Views/Assembly/AssemblyWizardSheet.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOptionCatalog.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyTool.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyReadType.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyCompatibility.swift
      - Sources/LungfishWorkflow/Assembly/ManagedAssemblyPipeline.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyRunRequest.swift
      - Sources/LungfishKit/MultiBundleRunModePicker.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/assemble.txt
    settings:
      - label: Assembler
        control: radio
        default: SPAdes when the sheet is opened from the SPAdes menu item
        allowed: SPAdes, MEGAHIT, SKESA, Flye, Hifiasm, narrowed to the assemblers that accept the detected read class
        effect: Picks which assembler runs the job. Once the sheet has worked out what kind of reads you gave it, the picker lists only the assemblers that accept that kind, so an Illumina bundle offers SPAdes, MEGAHIT, and SKESA while a Nanopore bundle offers Flye and Hifiasm.
        when_to_change: Switch when you want to compare two assemblers on the same reads without leaving the sheet.
        cli_flag: --assembler
      - label: Read Type
        control: radio
        default: the class read off the FASTQ headers, shown as a locked label with the caption "Locked from FASTQ header detection."
        allowed: Illumina short reads, ONT reads, PacBio HiFi/CCS
        effect: States which sequencing chemistry produced the reads, which is what decides the assembler list. When the headers give a clear answer the row is a locked label, and when they do not the row becomes a picker you must set before Run turns on.
        when_to_change: Set it by hand when the Detected row says no single read class was found, which happens with headers the app does not recognize.
        cli_flag: --read-type
      - label: Profile
        control: popup
        default: Isolate
        allowed: Isolate, Meta, Plasmid
        effect: Chooses the SPAdes run mode. Isolate assumes one organism at even depth, Meta expects a mixed community at uneven depth, and Plasmid hunts for the small circular molecules in a bacterial prep.
        when_to_change: Pick Meta for a metagenome or an enrichment that carries more than one organism, and Plasmid when the plasmid rather than the chromosome is the point.
        cli_flag: --profile
      - label: Threads
        control: slider
        default: the smaller of your Mac's core count and 8
        allowed: 1 to the number of cores your Mac reports
        effect: Sets how many CPU threads the assembler may use at once. More threads finish sooner up to the point where memory or disk becomes the limit.
        when_to_change: Lower it when you want to keep cores free for other work while a long assembly runs.
        cli_flag: --threads
      - label: Memory Limit
        control: slider
        default: three quarters of installed memory, capped at 32
        allowed: 1 GB to the installed memory your Mac reports, in whole gigabytes
        effect: Caps how much RAM SPAdes may claim. SPAdes stops with an error rather than swapping when it hits the cap, so the number is a ceiling and not a reservation.
        when_to_change: Raise it for a large or high-coverage library that fails partway through, and lower it when you need memory for other applications.
        cli_flag: --memory-gb
      - label: Min Contig
        control: number
        default: "0"
        allowed: 0 to 1000000 bp, in steps of 100
        effect: Is meant to drop contigs shorter than this length from the result. With SPAdes chosen the stepper is shown and editable but the value never reaches the run, so it has no effect at all.
        when_to_change: Leave it at 0 for SPAdes. Screen short contigs afterwards by sorting the assembly viewport's Length (bp) column.
        cli_flag: --min-contig-length
      - label: Careful mode
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Turns on SPAdes' --careful flag, which adds a mismatch and short indel correction pass after assembly. The run takes noticeably longer and the contigs carry fewer small errors.
        when_to_change: Turn it on for a small genome where per-base accuracy matters more than wall time, such as a viral or plasmid assembly.
        cli_flag: null
      - label: Skip error correction
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Passes SPAdes' --only-assembler flag, which skips the read-correction stage and goes straight to assembly. It saves a large share of the run time and gives up the correction of sequencing errors before graph building.
        when_to_change: Turn it on when the reads were already corrected upstream, or when a correction stage is running out of memory.
        cli_flag: null
      - label: Extra arguments
        control: text
        default: empty
        allowed: any command line text SPAdes accepts, quoted the way a shell would expect
        effect: Appends whatever you type to the SPAdes command exactly as written. This is the only way to reach SPAdes options the sheet does not expose, such as --viral or a custom k-mer list.
        when_to_change: Use it for an option the sheet has no control for. A phrase the parser cannot read blocks Run and prints the reason in the footer.
        cli_flag: --extra-args
      - label: Project Name
        control: text
        default: the input file stem with _R1, _R2, _1, _2, and .lungfishfastq stripped, plus _assembly, or the literal assembly when no input name can be read
        allowed: any non-empty text
        effect: Names the assembly bundle the run produces. An empty name blocks Run.
        when_to_change: Rename it when you are assembling the same reads more than once and want to tell the results apart.
        cli_flag: --project-name
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: Run separately per bundle only. Combine all inputs, run once is shown but locked.
        effect: Says how a selection of more than one bundle is handled. Each bundle assembles on its own and produces its own result.
        when_to_change: Never in this version. The combined option is locked with the reason "Combining multiple bundles into one assembly run is not yet supported; each bundle assembles separately."
        cli_flag: null
    cli_only:
      - flag: --paired
        default: "false"
        effect: Treats the two input files as the forward and reverse mates of one library. The sheet works this out from the file names instead.
      - flag: --output
        default: the project's Analyses folder
        effect: Writes the run somewhere other than the default. Aliases are -o and --output-dir.
      - flag: --extra-arg
        default: none
        effect: Adds one extra assembler argument, and may be repeated, as an alternative to the single --extra-args string.
      - flag: --format
        default: text
        effect: Prints the run summary as text, json, or tsv.
    notes: >-
      The Inputs section at the top of the sheet is three read-only rows, Dataset, Read
      Layout, and Detected. There is no input picker, so you choose the reads in the
      sidebar before opening the menu item. Output Folder is likewise a read-only row
      showing the resolved path. The sheet is 620 by 640 points and results land in
      Analyses/spades-<timestamp>/. Careful mode and Skip error correction live inside
      the "Curated extra arguments" disclosure under Advanced Settings, and neither has
      a CLI flag of its own, so on the command line you pass them through --extra-args.
      Min Contig is a defect worth flagging. AssemblyOptionCatalog maps Minimum Contig
      Length to SPAdes with the summary "Lungfish post-filter", which is what makes the
      wizard show the stepper, but ManagedAssemblyPipeline.buildSpadesCommand never
      reads the value and AssemblyOutputNormalizer computes statistics from the
      unfiltered contigs.fasta. The setting is silently ignored.

  assemble.megahit:
    title: MEGAHIT
    entry_points:
      - "Tools > Assembly > MEGAHIT..."
      - "CLI: lungfish-cli assemble <fastq-files> --assembler megahit"
    gating: [assembly]
    sources:
      - Sources/LungfishApp/Views/Assembly/AssemblyWizardSheet.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOptionCatalog.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyCompatibility.swift
      - Sources/LungfishWorkflow/Assembly/ManagedAssemblyPipeline.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyRunRequest.swift
      - Sources/LungfishKit/MultiBundleRunModePicker.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/assemble.txt
    settings:
      - label: Assembler
        control: radio
        default: MEGAHIT when the sheet is opened from the MEGAHIT menu item
        allowed: SPAdes, MEGAHIT, SKESA, Flye, Hifiasm, narrowed to the assemblers that accept the detected read class
        effect: Picks which assembler runs the job. MEGAHIT is offered for Illumina short reads only.
        when_to_change: Switch to SPAdes when you want the more thorough short-read assembly and have the memory for it.
        cli_flag: --assembler
      - label: Read Type
        control: radio
        default: the class read off the FASTQ headers, shown as a locked label
        allowed: Illumina short reads, ONT reads, PacBio HiFi/CCS
        effect: States which sequencing chemistry produced the reads. MEGAHIT appears in the Assembler picker only while this reads Illumina short reads.
        when_to_change: Set it by hand when the Detected row says no single read class was found.
        cli_flag: --read-type
      - label: Profile
        control: popup
        default: Default
        allowed: Default, Meta Sensitive, Meta Large
        effect: Chooses a MEGAHIT preset. Default is the balanced setting, Meta Sensitive spends more time recovering low-abundance members of a community, and Meta Large is tuned for large complex metagenomes.
        when_to_change: Move to Meta Sensitive when rare organisms in a mixed sample are the point, and Meta Large for a soil or gut community.
        cli_flag: --profile
      - label: Threads
        control: slider
        default: the smaller of your Mac's core count and 8, then capped at 2 on Apple Silicon
        allowed: 1 to the number of cores your Mac reports
        effect: Sets how many CPU threads MEGAHIT may use. On Apple Silicon the app lowers whatever you pick to 2 and adds --no-hw-accel, because MEGAHIT 1.2.9 crashes above that on arm64.
        when_to_change: Rarely, since the Apple Silicon cap overrides the slider anyway.
        cli_flag: --threads
      - label: Memory Limit
        control: slider
        default: three quarters of installed memory, capped at 32
        allowed: 1 GB to the installed memory your Mac reports, in whole gigabytes
        effect: Caps how much RAM MEGAHIT may claim. MEGAHIT counts its budget in bytes, so the app converts your gigabyte figure before passing it.
        when_to_change: Lower it when you need memory for other applications during a long run.
        cli_flag: --memory-gb
      - label: Min Contig
        control: number
        default: "0"
        allowed: 0 to 1000000 bp, in steps of 100
        effect: Drops contigs shorter than this length from MEGAHIT's output. MEGAHIT receives the value as --min-contig-len, so the short pieces never reach the result at all.
        when_to_change: Raise it to something like 500 when a metagenome produces thousands of fragments too short to identify.
        cli_flag: --min-contig-length
      - label: Extra arguments
        control: text
        default: empty
        allowed: any command line text MEGAHIT accepts
        effect: Appends whatever you type to the MEGAHIT command exactly as written, which is the only route to options the sheet does not expose, such as a custom k-mer list.
        when_to_change: Use it for an option with no control. Text the parser cannot read blocks Run and prints the reason in the footer.
        cli_flag: --extra-args
      - label: Project Name
        control: text
        default: the input file stem with mate suffixes stripped, plus _assembly
        allowed: any non-empty text
        effect: Names the assembly bundle the run produces. An empty name blocks Run.
        when_to_change: Rename it when you assemble the same reads more than once and want to tell the results apart.
        cli_flag: --project-name
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: Run separately per bundle only. Combine all inputs, run once is shown but locked.
        effect: Says how a selection of more than one bundle is handled. Each bundle assembles on its own.
        when_to_change: Never in this version, since the combined option is locked.
        cli_flag: null
    cli_only:
      - flag: --paired
        default: "false"
        effect: Treats the two input files as the forward and reverse mates of one library.
      - flag: --output
        default: the project's Analyses folder
        effect: Writes the run somewhere other than the default. Aliases are -o and --output-dir.
      - flag: --extra-arg
        default: none
        effect: Adds one extra assembler argument, and may be repeated.
      - flag: --format
        default: text
        effect: Prints the run summary as text, json, or tsv.
    notes: >-
      MEGAHIT has no toggles inside the "Curated extra arguments" disclosure, so that
      disclosure holds only the catalog's read-only option descriptions and the Extra
      arguments field. The Default profile is not a value you pass. Its id is the empty
      string, and an empty id makes the app omit --presets entirely, so only
      meta-sensitive and meta-large are ever named on the command line. Version 1.2.9 is
      pinned by the tool lock, and results land in Analyses/megahit-<timestamp>/.

  assemble.skesa:
    title: SKESA
    entry_points:
      - "Tools > Assembly > SKESA..."
      - "CLI: lungfish-cli assemble <fastq-files> --assembler skesa"
    gating: [assembly]
    sources:
      - Sources/LungfishApp/Views/Assembly/AssemblyWizardSheet.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOptionCatalog.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyCompatibility.swift
      - Sources/LungfishWorkflow/Assembly/ManagedAssemblyPipeline.swift
      - Sources/LungfishKit/MultiBundleRunModePicker.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/assemble.txt
    settings:
      - label: Assembler
        control: radio
        default: SKESA when the sheet is opened from the SKESA menu item
        allowed: SPAdes, MEGAHIT, SKESA, Flye, Hifiasm, narrowed to the assemblers that accept the detected read class
        effect: Picks which assembler runs the job. SKESA is offered for Illumina short reads only.
        when_to_change: Switch to SPAdes when you want a profile control and a more exhaustive graph traversal.
        cli_flag: --assembler
      - label: Read Type
        control: radio
        default: the class read off the FASTQ headers, shown as a locked label
        allowed: Illumina short reads, ONT reads, PacBio HiFi/CCS
        effect: States which sequencing chemistry produced the reads. SKESA appears in the Assembler picker only while this reads Illumina short reads.
        when_to_change: Set it by hand when the Detected row says no single read class was found.
        cli_flag: --read-type
      - label: Threads
        control: slider
        default: the smaller of your Mac's core count and 8
        allowed: 1 to the number of cores your Mac reports
        effect: Sets how many CPU threads SKESA may use at once, passed as --cores.
        when_to_change: Lower it to keep cores free for other work.
        cli_flag: --threads
      - label: Memory Limit
        control: slider
        default: three quarters of installed memory, capped at 32
        allowed: 1 GB to the installed memory your Mac reports, in whole gigabytes
        effect: Caps how much RAM SKESA may claim, passed as --memory in gigabytes.
        when_to_change: Raise it for a deep bacterial library that runs out of memory.
        cli_flag: --memory-gb
      - label: Min Contig
        control: number
        default: "0"
        allowed: 0 to 1000000 bp, in steps of 100
        effect: Drops contigs shorter than this length from SKESA's output, passed as --min_contig.
        when_to_change: Raise it when short fragments crowd the contig table and you only care about the long scaffolds.
        cli_flag: --min-contig-length
      - label: Extra arguments
        control: text
        default: empty
        allowed: any command line text SKESA accepts
        effect: Appends whatever you type to the SKESA command exactly as written. Passing your own --min_count here replaces the value the app would otherwise pin.
        when_to_change: Use it for an option with no control, such as a different k-mer step.
        cli_flag: --extra-args
      - label: Project Name
        control: text
        default: the input file stem with mate suffixes stripped, plus _assembly
        allowed: any non-empty text
        effect: Names the assembly bundle the run produces. An empty name blocks Run.
        when_to_change: Rename it when you assemble the same reads more than once.
        cli_flag: --project-name
      - label: Run Mode
        control: radio
        default: Run separately per bundle
        allowed: Run separately per bundle only. Combine all inputs, run once is shown but locked.
        effect: Says how a selection of more than one bundle is handled. Each bundle assembles on its own.
        when_to_change: Never in this version, since the combined option is locked.
        cli_flag: null
    cli_only:
      - flag: --paired
        default: "false"
        effect: Treats the two input files as the forward and reverse mates of one library.
      - flag: --output
        default: the project's Analyses folder
        effect: Writes the run somewhere other than the default. Aliases are -o and --output-dir.
      - flag: --profile
        default: none
        effect: Accepted by the command but ignored for SKESA, which has no profiles.
      - flag: --extra-arg
        default: none
        effect: Adds one extra assembler argument, and may be repeated.
      - flag: --format
        default: text
        effect: Prints the run summary as text, json, or tsv.
    notes: >-
      SKESA has no Profile control. Its profile list is empty, and the sheet hides the
      whole Profile row when the list is empty. It also has no toggles in the "Curated
      extra arguments" disclosure. The app pins --min_count 2 on every SKESA run unless
      you supply your own, because SKESA's high-coverage auto-escalation can otherwise
      return an empty assembly from a small or subsetted library. SKESA writes its
      contigs to standard output, so the app redirects them into contigs.fasta itself.
      Version 2.5.1 is pinned by the tool lock, and results land in
      Analyses/skesa-<timestamp>/.

  assemble.flye:
    title: Flye
    entry_points:
      - "Tools > Assembly > Flye..."
      - "CLI: lungfish-cli assemble <fastq-file> --assembler flye"
    gating: [assembly]
    sources:
      - Sources/LungfishApp/Views/Assembly/AssemblyWizardSheet.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOptionCatalog.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyCompatibility.swift
      - Sources/LungfishWorkflow/Assembly/ManagedAssemblyPipeline.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOutputNormalizer.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/assemble.txt
    settings:
      - label: Assembler
        control: radio
        default: Flye when the sheet is opened from the Flye menu item
        allowed: SPAdes, MEGAHIT, SKESA, Flye, Hifiasm, narrowed to the assemblers that accept the detected read class
        effect: Picks which assembler runs the job. Flye is offered for Oxford Nanopore reads only, so an ONT bundle shows Flye beside Hifiasm and nothing else.
        when_to_change: Switch to Hifiasm when you want its haplotype-aware assembly of the same Nanopore reads.
        cli_flag: --assembler
      - label: Read Type
        control: radio
        default: the class read off the FASTQ headers, shown as a locked label
        allowed: Illumina short reads, ONT reads, PacBio HiFi/CCS
        effect: States which sequencing chemistry produced the reads. Flye appears in the Assembler picker only while this reads ONT reads.
        when_to_change: Set it by hand for a PacBio CLR library, which has no read class of its own and so comes back as no single read class detected.
        cli_flag: --read-type
      - label: Profile
        control: popup
        default: Nano HQ
        allowed: Nano HQ, Nano Raw, Nano Corrected
        effect: Tells Flye how accurate the individual reads are, which changes how aggressively it corrects them. Nano HQ suits modern high-accuracy basecalls, Nano Raw suits older or fast-mode basecalls, and Nano Corrected suits reads already polished upstream.
        when_to_change: Move to Nano Raw for reads basecalled before the high-accuracy models, or Nano Corrected when another tool already corrected them.
        cli_flag: --profile
      - label: Threads
        control: slider
        default: the smaller of your Mac's core count and 8
        allowed: 1 to the number of cores your Mac reports
        effect: Sets how many CPU threads Flye may use at once, passed as --threads.
        when_to_change: Lower it to keep cores free while a long assembly runs.
        cli_flag: --threads
      - label: Metagenome mode
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Turns on Flye's --meta flag, which expects a mixed community at uneven depth rather than one organism at even depth.
        when_to_change: Turn it on when the sample is a community rather than a single isolate.
        cli_flag: null
      - label: Extra arguments
        control: text
        default: empty
        allowed: any command line text Flye accepts
        effect: Appends whatever you type to the Flye command exactly as written. This is the only way to give Flye a genome-size hint, for example --genome-size 30k, since the sheet has no such field.
        when_to_change: Use it for a genome-size hint or a polishing-iteration count, neither of which has a control.
        cli_flag: --extra-args
      - label: Project Name
        control: text
        default: the input file stem with mate suffixes stripped, plus _assembly
        allowed: any non-empty text
        effect: Names the assembly bundle the run produces. An empty name blocks Run.
        when_to_change: Rename it when you assemble the same reads more than once.
        cli_flag: --project-name
    cli_only:
      - flag: --output
        default: the project's Analyses folder
        effect: Writes the run somewhere other than the default. Aliases are -o and --output-dir.
      - flag: --memory-gb
        default: none
        effect: Accepted by the command but ignored for Flye, which takes no memory budget. The sheet hides the Memory Limit slider for the same reason.
      - flag: --min-contig-length
        default: none
        effect: Accepted by the command but ignored for Flye. The sheet hides the Min Contig stepper for the same reason.
      - flag: --extra-arg
        default: none
        effect: Adds one extra assembler argument, and may be repeated.
      - flag: --format
        default: text
        effect: Prints the run summary as text, json, or tsv.
    notes: >-
      Flye takes exactly one input file. A selection of two or more is refused before Run
      with the message "ONT reads assembly expects a single FASTQ input in v1.", and the
      Run Mode picker never appears for long-read tools. Memory Limit and Min Contig are
      both hidden, since neither maps to Flye in the option catalog. Metagenome mode
      lives inside the "Curated extra arguments" disclosure under Advanced Settings and
      has no CLI flag of its own, so on the command line you pass --extra-args "--meta".
      Flye keeps its assembly graph as assembly_graph.gfa in the run folder. Version
      2.9.6 is pinned by the tool lock, and results land in Analyses/flye-<timestamp>/.

  assemble.hifiasm:
    title: Hifiasm
    entry_points:
      - "Tools > Assembly > Hifiasm..."
      - "CLI: lungfish-cli assemble <fastq-file> --assembler hifiasm"
    gating: [assembly]
    sources:
      - Sources/LungfishApp/Views/Assembly/AssemblyWizardSheet.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOptionCatalog.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyCompatibility.swift
      - Sources/LungfishWorkflow/Assembly/ManagedAssemblyPipeline.swift
      - Sources/LungfishWorkflow/Assembly/AssemblyOutputNormalizer.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/assemble.txt
    settings:
      - label: Assembler
        control: radio
        default: Hifiasm when the sheet is opened from the Hifiasm menu item
        allowed: SPAdes, MEGAHIT, SKESA, Flye, Hifiasm, narrowed to the assemblers that accept the detected read class
        effect: Picks which assembler runs the job. Hifiasm accepts both PacBio HiFi and Nanopore reads, so a HiFi bundle shows Hifiasm alone in the picker.
        when_to_change: Switch to Flye when the reads are Nanopore and you want Flye's repeat-graph approach instead.
        cli_flag: --assembler
      - label: Read Type
        control: radio
        default: the class read off the FASTQ headers, shown as a locked label
        allowed: Illumina short reads, ONT reads, PacBio HiFi/CCS
        effect: States which sequencing chemistry produced the reads. When it reads ONT reads the app adds hifiasm's --ont flag, and when it reads PacBio HiFi/CCS it does not.
        when_to_change: Set it by hand when the Detected row says no single read class was found.
        cli_flag: --read-type
      - label: Profile
        control: popup
        default: Diploid
        allowed: Diploid, Haploid/Viral
        effect: Says how many haplotypes to expect. Diploid keeps the two copies of a chromosome apart, and Haploid/Viral also passes --n-hap 1, -l0, and -f0, which tells hifiasm to expect one haplotype and to skip both purging and the bloom filter.
        when_to_change: Pick Haploid/Viral for a virus, a haploid genome, or any small target where the purging step wastes time.
        cli_flag: --profile
      - label: Threads
        control: slider
        default: the smaller of your Mac's core count and 8
        allowed: 1 to the number of cores your Mac reports
        effect: Sets how many CPU threads hifiasm may use at once, passed as -t.
        when_to_change: Lower it to keep cores free while a long assembly runs.
        cli_flag: --threads
      - label: Primary contigs only
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Adds hifiasm's --primary flag so it writes only the primary assembly rather than the alternate haplotigs as well. The app loads the primary contigs into the viewport either way, so this mostly saves disk and time.
        when_to_change: Turn it on when you have no use for the alternate haplotype and want the run to finish sooner.
        cli_flag: null
      - label: Extra arguments
        control: text
        default: empty
        allowed: any command line text hifiasm accepts
        effect: Appends whatever you type to the hifiasm command exactly as written. Anything you pass here that the Haploid/Viral profile would also add wins, since the profile only fills in arguments you did not supply.
        when_to_change: Use it for an option with no control, such as a purge level other than the profile's.
        cli_flag: --extra-args
      - label: Project Name
        control: text
        default: the input file stem with mate suffixes stripped, plus _assembly
        allowed: any non-empty text
        effect: Names the assembly bundle and, for hifiasm alone, also becomes the -o output prefix, so every file the run writes carries this name.
        when_to_change: Rename it when you assemble the same reads more than once.
        cli_flag: --project-name
    cli_only:
      - flag: --output
        default: the project's Analyses folder
        effect: Writes the run somewhere other than the default. Aliases are -o and --output-dir.
      - flag: --memory-gb
        default: none
        effect: Accepted by the command but ignored for hifiasm, which takes no memory budget. The sheet hides the Memory Limit slider for the same reason.
      - flag: --min-contig-length
        default: none
        effect: Accepted by the command but ignored for hifiasm. The sheet hides the Min Contig stepper for the same reason.
      - flag: --extra-arg
        default: none
        effect: Adds one extra assembler argument, and may be repeated.
      - flag: --format
        default: text
        effect: Prints the run summary as text, json, or tsv.
    notes: >-
      Hifiasm takes exactly one input file, and a selection of two or more is refused
      before Run, so the Run Mode picker never appears. Memory Limit and Min Contig are
      both hidden. Primary contigs only lives inside the "Curated extra arguments"
      disclosure under Advanced Settings and has no CLI flag, so on the command line you
      pass --extra-args "--primary". Hifiasm writes a GFA graph rather than a FASTA, and
      the app converts <project name>.bp.p_ctg.gfa into contigs.fasta before the viewport
      can list anything, so alternate haplotigs stay in the run folder unlisted. There is
      no genome-size control and no trio-binning control. Version 0.25.0 is pinned by the
      tool lock, and results land in Analyses/hifiasm-<timestamp>/.

  assemble.extract-contigs:
    title: Create Bundle
    entry_points:
      - "Assembly viewport action bar: Create Bundle"
      - "Assembly viewport contig table context menu: Extract to New Bundle..."
      - "CLI: lungfish-cli extract contigs --assembly <run folder> --contig <name> --bundle"
    gating: []
    sources:
      - Sources/LungfishAssemblyUI/AssemblyActionBar.swift
      - Sources/LungfishAssemblyUI/AssemblyContigMaterializationAction.swift
      - Sources/LungfishAssemblyUI/AssemblyContigTableView.swift
      - Sources/LungfishAssemblyUI/AssemblyResultViewController.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+Assembly.swift
      - Sources/LungfishCLI/Commands/ExtractContigsCommand.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/extract.txt
    settings:
      - label: Contig selection
        control: text
        default: nothing selected, and the action bar reads "Select contigs to materialize"
        allowed: one or more rows of the contig table
        effect: Chooses which contigs go into the new bundle. Every button in the action bar stays disabled until at least one row is selected, and the bar then reads the count back to you.
        when_to_change: Select the contigs you actually want as a mapping or variant-calling target rather than every fragment the assembler emitted.
        cli_flag: --contig
      - label: Bundle name
        control: text
        default: the contig's own identifier for a single selection, or <run folder name>-selected-contigs for several
        allowed: any name, with a counter appended when the name is already taken
        effect: Names the reference bundle the extraction writes into the project's Reference Sequences folder. A name already in use gets a counter, so nothing is overwritten.
        when_to_change: Rename it when the suggested name is a long assembler-generated identifier you would rather not see in the sidebar.
        cli_flag: --bundle-name
    cli_only:
      - flag: --assembly
        default: none
        effect: Points at the managed assembly run folder under Analyses that holds assembly-result.json, not at the .lungfishref bundle inside it.
      - flag: --contigs
        default: none
        effect: Reads the source contigs from a plain FASTA instead of from an assembly run folder.
      - flag: --contig-file
        default: none
        effect: Reads contig names from a text file, one per line, and may be repeated.
      - flag: --output
        default: standard output
        effect: Writes the selected contigs to a plain FASTA at this path instead of building a bundle. Omitting it prints the FASTA to standard output.
      - flag: --bundle
        default: "false"
        effect: Builds a .lungfishref bundle in the project instead of writing a plain FASTA. Requires --project-root.
      - flag: --project-root
        default: none
        effect: Names the project the new bundle belongs to, which is required in --bundle mode.
      - flag: --line-width
        default: "60"
        effect: Sets how many bases go on each line of the FASTA the command writes.
      - flag: --format
        default: text
        effect: Prints the result summary as text, json, or tsv.
    notes: >-
      There is no dialog. Extraction is driven entirely by which rows of the contig table
      are selected, so the only two things you decide are the selection and the name. The
      contig table columns are #, Contig, Length (bp), GC %, Share of Assembly (%), and
      Sequence Preview. There is no coverage column and no Nx plot anywhere in the
      assembly viewport, and the CLI has no length or coverage filter either, so
      selecting by depth means reading the depth off a SPAdes contig name such as
      NODE_1_length_29812_cov_412.7. In the app the button starts an operation named
      "Create Reference Bundle" that appears in the Operations Panel and can be
      cancelled. The same action bar also offers BLAST Contigs, Copy FASTA, and Export
      FASTA on the current selection, and the first of those retitles itself to BLAST
      Contig when exactly one contig is selected. The bundle's FASTA is not
      bgzip-compressed, unlike an assembly bundle's.

  msa.mafft:
    title: MAFFT
    entry_points:
      - "Tools > Multiple Sequence Alignment > MAFFT..."
      - "Right-click a FASTA selection > Align with MAFFT..."
      - "CLI: lungfish-cli align mafft <input-files> --project <project>"
    gating: [multiple-sequence-alignment]
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/App/ToolsMenuModel.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenu.swift
      - Sources/LungfishApp/Services/CLIMSAAlignmentRunner.swift
      - Sources/LungfishKit/MSASequenceScopePicker.swift
      - Sources/LungfishKit/FASTASequenceActionMenuBuilder.swift
      - Sources/LungfishWorkflow/MSA/MAFFTAlignmentPipeline.swift
      - Sources/LungfishWorkflow/MSA/MSAAlignmentRunRequest.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/align.txt
    settings:
      - label: Sequences to align
        control: radio
        default: All sequences (N)
        allowed: "All sequences (N), Selected sequences (M)"
        effect: Chooses whether the run covers every sequence in the source file or only the sequences you highlighted in the viewport. The row counts appear in the labels, so All sequences (12) and Selected sequences (4) tell you the size of each choice.
        when_to_change: Pick the selected scope when the file holds sequences you do not want in the alignment, such as an unrelated outgroup or a failed sample.
        cli_flag: --sequence
      - label: Batch Output
        control: radio
        default: Combine all inputs, run once (1 result), and the row is locked with the reason "Alignment requires all sequences in one run"; the row appears only when two or more input files are chosen
        allowed: Combine all inputs, run once (1 result)
        effect: States that every selected input file is pooled into a single alignment. An alignment of N sequences has no meaning file by file, so the per-file option is not offered.
        when_to_change: rarely
        cli_flag: null
      - label: Strategy
        control: popup
        default: Automatic
        allowed: "Automatic, L-INS-i, G-INS-i, E-INS-i, FFT-NS-2, PartTree"
        effect: Picks how hard MAFFT works to place gaps. Automatic lets MAFFT choose from the number and length of your sequences, the three INS-i settings are slow and accurate for a few hundred sequences, FFT-NS-2 is the fast progressive setting, and PartTree is for many thousands of sequences.
        when_to_change: Move to L-INS-i when you have under about 200 sequences of similar length and the automatic alignment leaves ragged gap columns.
        cli_flag: --strategy
      - label: Sequence Type
        control: radio
        default: Auto
        allowed: "Auto, Nucleotide, Protein"
        effect: Tells MAFFT whether the letters are DNA or amino acids, which decides the scoring table it uses. Auto lets MAFFT guess from the residues it sees.
        when_to_change: Set it by hand when a short or ambiguous sequence makes the guess wrong, which shows up as a protein alignment scored as DNA.
        cli_flag: --sequence-type
      - label: Output Order
        control: radio
        default: Input Order
        allowed: "Input Order, Aligned Order"
        effect: Chooses the order of rows in the finished alignment. Input Order keeps the order of your source file, and Aligned Order groups similar sequences together the way MAFFT's guide tree found them.
        when_to_change: Switch to Aligned Order when you want related sequences adjacent so that shared differences line up in the viewport.
        cli_flag: --output-order
      - label: Direction Adjustment
        control: popup
        default: "Off"
        allowed: "Off, Adjust Direction, Adjust Direction Accurately"
        effect: Lets MAFFT reverse-complement a sequence that was submitted on the wrong strand. Off trusts the strand you gave, and the accurate setting spends more time checking each sequence against the others.
        when_to_change: Turn it on when some inputs came from a sequencer or database that does not enforce a strand, and one row in the alignment is nearly all gaps.
        cli_flag: --adjust-direction
      - label: Symbol Policy
        control: popup
        default: Strict Alphabet
        allowed: "Strict Alphabet, Allow Any Symbol"
        effect: Decides what MAFFT does with letters outside the standard DNA or protein alphabet. Strict Alphabet stops on an unexpected character, and Allow Any Symbol carries it through the alignment unchanged.
        when_to_change: Choose Allow Any Symbol when your sequences carry selenocysteine, stop codons, or other characters MAFFT would otherwise reject.
        cli_flag: --symbols
      - label: Threads
        control: text
        default: blank, meaning the app picks a thread count
        allowed: blank, or an integer of 1 or more
        effect: How many processor cores MAFFT may use. Leaving it blank lets the app choose a count that suits the machine.
        when_to_change: Set a small number when you want to run another job at the same time and keep the machine responsive.
        cli_flag: --threads
      - label: Deterministic threading
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Keeps MAFFT's iterative refinement single-threaded so that the same input always produces the same alignment. Clearing it lets refinement run on several threads, which is faster but can shift a few gaps between runs.
        when_to_change: Clear it only when a large alignment is too slow and you do not need a byte-identical result on a rerun.
        cli_flag: "--allow-nondeterministic-threads, sent when the box is cleared"
      - label: Treat FASTQ records as assembled or consensus sequences
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Lets you feed FASTQ files to MAFFT by converting each record to FASTA first. Without it the dialog refuses FASTQ input, because aligning raw sequencing reads to each other is almost never what you want.
        when_to_change: Tick it when the FASTQ actually holds finished consensus or assembled sequences rather than raw reads.
        cli_flag: --allow-fastq-assembly-inputs
      - label: MAFFT Parameters
        control: text
        default: empty
        allowed: any text MAFFT accepts on its command line
        effect: Passes text straight to MAFFT after the chosen strategy. The dialog checks that the text parses as command-line arguments and refuses to run until it does.
        when_to_change: Use it for a MAFFT option the dialog does not expose, such as a custom gap-opening penalty.
        cli_flag: --extra-mafft-options
    cli_only:
      - flag: --output
        default: derived from the project directory and the input name
        effect: Writes the .lungfishmsa bundle to an explicit path instead of letting the project choose one.
      - flag: --name
        default: derived from the first input file name
        effect: Sets the display name of the alignment bundle.
      - flag: --extra-args
        default: empty
        effect: Passes further arguments to MAFFT verbatim, in addition to the ones from --extra-mafft-options.
    notes: >-
      MAFFT is the only aligner in Lungfish Genome Explorer, so the dialog has
      no aligner picker. The "Sequences to align" radio group is replaced by a
      single summary line when there is no choice to make, that is when nothing
      is selected or the selection is the whole file. Direction Adjustment,
      Symbol Policy, Threads, Deterministic threading, the FASTQ toggle, and
      MAFFT Parameters sit inside the collapsed Advanced Options group.

  msa.view:
    title: Alignment viewport display controls
    entry_points:
      - "Open a .lungfishmsa bundle from the sidebar"
      - "Inspector > View tab"
      - "Right-click a row in the alignment"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Viewer/MultipleSequenceAlignmentViewController.swift
      - Sources/LungfishApp/Views/Viewer/MSAAlignmentNumberingMode.swift
      - Sources/LungfishApp/Views/Inspector/Sections/ReadStyleSection.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController.swift
    settings:
      - label: All Sites / Variable Sites
        control: radio
        default: All Sites
        allowed: "All Sites, Variable Sites"
        effect: Chooses whether the viewport shows every alignment column or only the columns where the sequences disagree. Variable Sites hides the columns that are identical in every row, which pulls the differences together on one screen.
        when_to_change: Switch to Variable Sites on a long alignment of close relatives, where the differences would otherwise be thousands of columns apart.
        cli_flag: null
      - label: Nucleotide / Conservation
        control: radio
        default: Nucleotide
        allowed: "Nucleotide, Conservation"
        effect: Chooses the residue coloring. Nucleotide gives each base its own color, and Conservation shades each column by how many rows share its most common residue.
        when_to_change: Switch to Conservation when you care about which regions are constant rather than which base sits in a given cell.
        cli_flag: null
      - label: Numbering
        control: popup
        default: Alignment + Source
        allowed: "Alignment + Source, Alignment Columns, Source Coordinates, Hidden"
        effect: Chooses which coordinates the viewport labels. Alignment columns count gapped positions from the left edge of the alignment, and source coordinates count ungapped positions along each original sequence, so the two disagree wherever a gap sits.
        when_to_change: Choose Source Coordinates when you need a position you can look up in the original record, and Hidden when the numbers crowd a narrow window.
        cli_flag: null
      - label: Low support (of non-gap residues)
        control: slider
        default: 50
        allowed: 0 to 100 percent in steps of 5
        effect: The share of non-gap residues that must agree before a consensus position is drawn as a called base. Below the threshold the position is masked instead.
        when_to_change: Raise it when you want a consensus that only shows positions where the sequences strongly agree.
        cli_flag: null
      - label: High gap
        control: slider
        default: 50
        allowed: 0 to 100 percent in steps of 5
        effect: The share of rows that may be gaps before the consensus masks that column. At 50 a column with more than half its rows gapped is masked.
        when_to_change: Lower it when partial sequences are letting sparse columns into the consensus.
        cli_flag: null
      - label: Mask
        control: popup
        default: Auto
        allowed: "Auto, N, X"
        effect: Picks the character that stands in for a masked consensus position. Auto writes X for protein alignments and N for everything else.
        when_to_change: Set it by hand when the alignment alphabet is ambiguous and the automatic choice picks the wrong letter.
        cli_flag: null
      - label: Reference
        control: popup
        default: Consensus
        allowed: "Consensus, or any row name in the alignment"
        effect: Names the sequence every other row is compared against. The right-click items Use Consensus and Use as Reference set this same value from the alignment itself.
        when_to_change: Point it at a published reference or a wild-type sample when you want every difference reported relative to that sequence.
        cli_flag: null
      - label: Display
        control: popup
        default: Letters
        allowed: "Letters, Dots to Consensus, Dots to Reference"
        effect: Chooses whether matching residues are spelled out or replaced by dots. Dots leave only the differences as letters, so a wall of identical sequence collapses into a few visible changes.
        when_to_change: Switch to a dots mode as soon as the alignment is mostly identical, because the differences are then the only letters on screen. Dots to Reference stays disabled until a Reference row is chosen.
        cli_flag: null
      - label: Name gutter width
        control: slider
        default: the shipped gutter width, restored from the last session
        allowed: 160 to 640 points
        effect: Sets how much room the sequence names get on the left of the alignment. You change it by dragging the handle between the names and the residues, and the width is remembered for the next session.
        when_to_change: Widen it when long accession names are cut off, and narrow it to give the residues more room.
        cli_flag: null
    cli_only:
      - flag: "msa consensus --threshold"
        default: "0.6"
        effect: The command-line equivalent of the low-support control, as the minimum non-gap residue fraction required for a consensus base.
      - flag: "msa consensus --gap-policy"
        default: omit
        effect: Chooses whether gap columns are omitted from the written consensus or included as gaps.
      - flag: "msa distance --model"
        default: identity
        effect: Computes a pairwise matrix as identity or as p-distance, which is the arithmetic behind the conservation shading made explicit.
    notes: >-
      These controls change what the reader sees and never change the bundle on
      disk. Numbering, the consensus sliders, Mask, Reference, and Display live
      in the Inspector View tab, while All Sites, the color scheme, the zoom
      buttons, and the fit-to-width button live on the viewport toolbar. Zoom
      in, zoom out, fit columns, Previous Variable, and Next Variable are
      buttons rather than settings, so they carry no stored value.

  msa.export:
    title: Export Alignment
    entry_points:
      - "Right-click in the alignment viewport > Export Alignment..."
      - "CLI: lungfish-cli msa export <bundle-path> --output <output>"
      - "CLI: lungfish-cli msa extract <bundle-path> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Viewer/MSAAlignmentExportSheet.swift
      - Sources/LungfishApp/Views/Viewer/MultipleSequenceAlignmentViewController.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/msa.txt
    settings:
      - label: Destination
        control: radio
        default: Save to File...
        allowed: "Save as Bundle, Save to File..., Copy to Clipboard"
        effect: Chooses where the exported alignment goes. Save as Bundle creates a new bundle inside the project, Save to File writes a plain file anywhere, and Copy to Clipboard puts the text on the pasteboard.
        when_to_change: Choose Save as Bundle when the subset is the input to another Lungfish step, and Save to File when an outside program will read it.
        cli_flag: null
      - label: Sequences
        control: popup
        default: Aligned FASTA (keep gaps)
        allowed: "Aligned FASTA (keep gaps), Unaligned FASTA (remove gaps)"
        effect: Decides whether the export keeps the gap characters. Keeping gaps preserves the alignment as a grid, and removing them leaves you with the plain sequences at their original lengths.
        when_to_change: Remove gaps when the destination wants raw sequences, such as a BLAST search or a primer design tool.
        cli_flag: "--output-format for a file export, --output-kind for a bundle export"
      - label: Format
        control: popup
        default: aligned-fasta
        allowed: "aligned-fasta, phylip, nexus, clustal, stockholm, a2m, a3m, and only fasta when gaps are removed"
        effect: Picks the file format of a file export. PHYLIP and NEXUS are what most tree-building programs read, Clustal and Stockholm are readable alignment text, and a2m and a3m are the profile formats HMMER uses.
        when_to_change: Change it to match the program that will read the file, since a tree builder that wants PHYLIP will not accept FASTA.
        cli_flag: --output-format
      - label: Scope
        control: radio
        default: Selected subalignment (N rows) when rows are selected, otherwise Entire alignment (N)
        allowed: "Entire alignment (N), Selected subalignment (N rows)"
        effect: Chooses whether the export covers the whole alignment or only the rows and columns you selected. The row counts appear in the labels.
        when_to_change: Keep the selected scope when you highlighted a clade or a gene region and want only that piece in the output file.
        cli_flag: "--rows and --columns"
      - label: Bundle name
        control: text
        default: the current alignment name
        allowed: any text that is not blank
        effect: Names the new bundle when the destination is Save as Bundle. The Create Bundle button stays disabled until the field holds something.
        when_to_change: Set it whenever the export is a subset, so the bundle name says what the subset is.
        cli_flag: --name
    cli_only:
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file or bundle instead of stopping.
      - flag: "msa consensus --output-kind"
        default: fasta
        effect: Writes a consensus as a plain FASTA file or as a .lungfishref reference bundle.
      - flag: "msa mask columns --ranges"
        default: none
        effect: Marks the listed 1-based column ranges as masked in a derived bundle without deleting them.
      - flag: "msa trim columns --gap-threshold"
        default: none
        effect: Deletes columns whose gap fraction is above the given value in a derived bundle.
      - flag: "msa annotate add --columns"
        default: none
        effect: Records a named feature over the listed aligned columns of one row.
    notes: >-
      The Format row appears only for the file destination, because bundle and
      clipboard exports are always FASTA. Copy to Clipboard is disabled and
      explains itself when the alignment text would exceed 5 MB. The Scope row
      appears only when a selection exists, and the Bundle name row only for
      Save as Bundle. Under the hood a bundle export runs msa extract and a file
      or clipboard export runs msa export.

  tree.iqtree:
    title: Build Tree with IQ-TREE
    entry_points:
      - "Right-click in the alignment viewport > Build Tree with IQ-TREE..."
      - "CLI: lungfish-cli tree infer iqtree <msa-bundle-path> --project <project> --output <output>"
    gating: [phylogenetics]
    sources:
      - Sources/LungfishApp/Views/Phylogenetics/IQTreeInferenceDialog.swift
      - Sources/LungfishApp/Views/Viewer/MultipleSequenceAlignmentViewController.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/tree.txt
    settings:
      - label: Output Name
        control: text
        default: the alignment bundle name, with any .lungfishtree suffix removed
        allowed: any text that is not blank
        effect: Names the .lungfishtree bundle the run writes into the project's Phylogenetic Trees folder. Run stays disabled while the field is empty.
        when_to_change: Change it when the tree is one of several from the same alignment and the names would otherwise collide.
        cli_flag: --name
      - label: Model
        control: text
        default: MFP
        allowed: "MFP, or any IQ-TREE model string such as GTR+G or HKY+I+G"
        effect: Names the substitution model, which is the set of assumptions about how one base turns into another. MFP is not a model but an instruction to test many models on your data and use the one that fits best.
        when_to_change: Name a model directly when a reviewer or a published method requires that exact model, or when model testing takes too long on a large alignment.
        cli_flag: --model
      - label: Sequence Type
        control: radio
        default: Auto
        allowed: "Auto, DNA, Amino Acid, Codon, Binary, Morphological, NT to AA"
        effect: Tells IQ-TREE what the alignment characters are. Auto lets IQ-TREE decide from the residues, and NT to AA translates a nucleotide alignment before inferring the tree.
        when_to_change: Set it by hand when the alignment is a codon alignment or when you want a protein tree from nucleotide input.
        cli_flag: --sequence-type
      - label: Ultrafast Bootstrap
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Turns on branch support values from resampled alignments. A branch labelled 95 means that branch appeared in 95 percent of the resampled trees, and values at or above 95 are usually treated as well supported.
        when_to_change: Turn it on for any tree you plan to interpret or publish, because a tree without support values cannot be read for confidence.
        cli_flag: --bootstrap
      - label: Replicates (Ultrafast Bootstrap)
        control: text
        default: 1000
        allowed: integers of 1 or more
        effect: How many resampled alignments the ultrafast bootstrap builds. More replicates make the support numbers steadier and the run slower.
        when_to_change: rarely, because 1000 is the value IQ-TREE's authors recommend for the ultrafast method.
        cli_flag: --bootstrap
      - label: SH-aLRT
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Turns on a second, faster branch support test that compares each branch against the alternatives around it. It reports on the same 0 to 100 scale but is calculated differently from the bootstrap.
        when_to_change: Turn it on alongside the bootstrap when you want two independent support measures per branch.
        cli_flag: --alrt
      - label: Replicates (SH-aLRT)
        control: text
        default: 1000
        allowed: integers of 1 or more
        effect: How many replicates the SH-aLRT test uses. As with the bootstrap, more replicates cost time and steady the numbers.
        when_to_change: rarely
        cli_flag: --alrt
      - label: Seed
        control: text
        default: blank, meaning no seed is passed and IQ-TREE picks one from the clock
        allowed: blank, or an integer of 1 or more
        effect: Fixes the starting point of the random choices IQ-TREE makes, so the same alignment and the same seed give the same tree. Leaving it blank lets IQ-TREE pick one.
        when_to_change: Change it when you want to check that a different random start reaches the same tree.
        cli_flag: --seed
      - label: Threads
        control: text
        default: blank, meaning the app picks a thread count
        allowed: blank, or an integer of 1 or more
        effect: How many processor cores IQ-TREE may use. Leaving it blank lets the app choose.
        when_to_change: Set a small number to keep the machine responsive while a long inference runs.
        cli_flag: --threads
      - label: Safe numerical mode
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Makes IQ-TREE use slower arithmetic that avoids numerical underflow. Underflow shows up as a run that stops with a likelihood error rather than a tree.
        when_to_change: Turn it on after a run fails with a numerical error, which happens most often on very long alignments.
        cli_flag: --safe
      - label: Keep identical sequences
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Keeps sequences that are identical to another sequence in the analysis. By default IQ-TREE removes the duplicates and puts them back on the finished tree, which is faster and gives the same topology.
        when_to_change: Turn it on when you need every input name to appear as its own tip with its own branch length.
        cli_flag: --keep-identical
      - label: IQ-TREE Executable
        control: text
        default: empty, meaning the iqtree3 binary from the Phylogenetics pack
        allowed: a path to an iqtree3 executable
        effect: Points the run at a specific IQ-TREE binary instead of the one the app manages.
        when_to_change: Set it when you must reproduce a result with a particular IQ-TREE version.
        cli_flag: --iqtree-path
      - label: IQ-TREE Parameters
        control: text
        default: empty
        allowed: any text IQ-TREE accepts on its command line
        effect: Passes text straight to IQ-TREE after the settings above. The dialog checks that the text parses as command-line arguments before it lets the run start.
        when_to_change: Use it for an IQ-TREE option the dialog does not expose, such as a partition file or an outgroup constraint.
        cli_flag: --extra-iqtree-options
    cli_only:
      - flag: --rows
        default: every row in the alignment
        effect: Restricts the inference to the named rows, which is what the GUI does with the rows you selected before opening the dialog.
      - flag: --columns
        default: every column in the alignment
        effect: Restricts the inference to the given 1-based column ranges, which is what the GUI does with a column selection.
      - flag: --extra-args
        default: empty
        effect: Passes further arguments to IQ-TREE verbatim, in addition to those from --extra-iqtree-options.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output bundle instead of stopping.
    notes: >-
      The menu item stays disabled until at least two rows are selected in the
      alignment, and the row and column selection carries into the run as the
      Scope line in the dialog's Inputs section. The dialog has no outgroup
      field, so rooting is done afterwards with Re-root Here in the tree
      viewport. IQ-TREE Executable and IQ-TREE Parameters sit inside the
      collapsed Advanced Options group.

  tree.reroot:
    title: Re-root Here
    entry_points:
      - "Right-click a tip or internal node in the tree viewport > Re-root Here"
      - "CLI: lungfish-cli tree reroot --bundle <bundle> --on <node> --output <output>"
    gating: []
    sources:
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeViewController.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+AlignmentTreeBundles.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/tree.txt
    settings:
      - label: Node to root on
        control: text
        default: the node you right-clicked
        allowed: any tip or internal node in the open tree
        effect: Sets which node becomes the base of the tree, so every branch is redrawn as leading away from it. Re-rooting changes what the picture says about ancestry and descent while leaving the branch lengths and the groupings untouched.
        when_to_change: Root on a known outgroup, that is a sequence you are confident falls outside the group you are studying, because an unrooted tree cannot tell you which lineage came first.
        cli_flag: --on
      - label: Output bundle name
        control: text
        default: the source bundle name with -rerooted appended
        allowed: set by the app, not editable in the viewport
        effect: Names the new .lungfishtree bundle written into the project's Phylogenetic Trees folder. The original tree is never modified.
        when_to_change: rarely, because the viewport does not offer the field and the CLI takes the path directly.
        cli_flag: --output
    cli_only: []
    notes: >-
      There is no dialog. The command runs on the node you right-clicked and
      writes a new bundle beside the original, so the number after -rerooted
      grows if you re-root more than once. The new bundle keeps exactly the
      source tree's tips and is marked rooted (measured 2026-09-24 on the
      five-tip primate tree, which stays at 5 tips and 3 internal nodes). Related items in the same context
      menu are Collapse Clade, Copy Subtree as Newick, Copy Node Label, Center
      Node, and Reveal Provenance.

  tree.extract-subtree:
    title: Extract Subtree as New Bundle
    entry_points:
      - "Right-click a node in the tree viewport > Extract Subtree as New Bundle..."
      - "Right-click a node in the tree viewport > Export Subtree..."
      - "CLI: lungfish-cli tree extract-subtree --bundle <bundle> --node <node> --output <output>"
      - "CLI: lungfish-cli tree export subtree <bundle-path> --output <output>"
    gating: []
    sources:
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeViewController.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/tree.txt
    settings:
      - label: Node to extract
        control: text
        default: the node you right-clicked
        allowed: any tip or internal node in the open tree
        effect: Chooses the clade that becomes the new tree, meaning that node and everything descended from it. Everything outside the clade is left behind.
        when_to_change: Pick the node whose descendants are the group you want to look at on its own, such as one well supported lineage inside a large tree.
        cli_flag: --node
      - label: Output bundle name
        control: text
        default: the node label with -subtree appended
        allowed: set by the app, not editable in the viewport
        effect: Names the new .lungfishtree bundle written into the project's Phylogenetic Trees folder.
        when_to_change: rarely, because the viewport does not offer the field and the CLI takes the path directly.
        cli_flag: --output
      - label: Export file name
        control: file
        default: the node label with .nwk appended
        allowed: any writable path
        effect: Names the plain Newick file that Export Subtree writes through a save panel. Newick is the one-line bracketed text format that nearly every tree program reads.
        when_to_change: Change it in the save panel when another program expects a particular file name.
        cli_flag: --output
    cli_only:
      - flag: --label
        default: none
        effect: Selects the node to export by its unique display label instead of its node ID, on tree export subtree.
      - flag: --output-format
        default: newick
        effect: Names the export format for tree export subtree, and newick is currently the only one supported.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file instead of stopping.
    notes: >-
      Two related items sit next to each other in the node context menu.
      Extract Subtree as New Bundle writes a .lungfishtree bundle into the
      project with provenance, while Export Subtree writes a plain .nwk file
      through a save panel. Neither shows a settings dialog, so the node comes
      from the right-click and the names come from the node label. The new
      bundle keeps the source tree's rootedness, so a clade taken from an
      unrooted tree is marked unrooted.

  genotype.miseq-amplicon:
    title: miSeq amplicon MHC genotyping
    entry_points:
      - "Tools > Genotyping > miSeq amplicon MHC genotyping..."
      - "CLI: lungfish-cli fastq genotype <inputs> --reference <ref> --output-dir <dir>"
      - "CLI: lungfish-cli fastq genotype-cohort <bundles> --reference <ref> --output-dir <dir>"
    gating: [read-mapping]
    sources:
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationsDialog.swift
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishWorkflow/ONTGenotyping/ONTGenotypingPipeline.swift
      - Sources/LungfishWorkflow/ONTGenotyping/IlluminaAmpliconPairMerger.swift
      - Sources/LungfishWorkflow/ONTGenotyping/AmpliconGenotypingMode.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
      - docs/user-manual/reviews/fidelity-2026-09/ground-truth/09-genotyping.md
    settings:
      - label: Reference
        control: popup
        default: the first MHC reference found in the project, or nothing when the project holds none
        allowed: any reference in the project, or an allele FASTA file, a .lungfishref bundle, or a .lungfishmhcref bundle you pick with the Choose or Replace button beside the picker
        effect: Names the library of known allele sequences every read is compared against. An allele missing from this file can never be reported for any sample.
        when_to_change: Choose the library built for your species and amplicon panel, because a macaque panel will not name human alleles.
        cli_flag: --reference
      - label: FASTQ Bundles
        control: file
        default: whatever you selected in the sidebar before opening the dialog
        allowed: one or more prepared per-sample .lungfishfastq bundles, FASTQ files, or a folder of them
        effect: Chooses which sequenced samples are genotyped. Every selected bundle runs as one batch and lands in a single merged report.
        when_to_change: Select the whole plate when you want one comparison table, and run bundles one at a time when you want separate reports.
        cli_flag: null
      - label: Include subfolders
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: When a selected folder holds bundles inside further folders, this adds those deeper bundles to the batch as well.
        when_to_change: Turn it on when a sequencing run wrote each sample into its own subfolder.
        cli_flag: null
      - label: Report Name
        control: text
        default: amplicon-genotyping, a fixed name that does not vary with the selected read files
        allowed: any file name
        effect: Names the result bundle and the Excel workbook the run writes. It is also the label the analysis carries inside that workbook.
        when_to_change: Change it when the suggested name will not tell you later which plate or cohort the run covered.
        cli_flag: --output-name
      - label: Threads
        control: number
        default: the machine's active processor count
        allowed: integers above 0
        effect: How many worker threads the mapping step uses. More threads finish sooner on a machine with spare cores.
        when_to_change: Lower it when you need to keep cores free for other work while a long run proceeds.
        cli_flag: --threads
      - label: Minimum supporting reads
        control: number
        default: "1"
        allowed: integers above 0
        effect: Sets the fewest retained reads an allele needs before the haplotype caller counts it as evidence. It removes no rows from the report files or workbook.
        when_to_change: Raise it on deeply sequenced libraries to cut the long tail of one-read and two-read hits that are usually sequencing error.
        cli_flag: --min-support
      - label: Analysis Mode
        control: radio
        default: Genotyping only
        allowed: "Genotyping only, Deterministic haplotyping"
        effect: Decides how far the run goes. Genotyping only maps reads and reports which alleles each sample carries, and Deterministic haplotyping adds named haplotype calls against the chosen Haplotype Definition.
        when_to_change: Choose Deterministic haplotyping when a haplotype definition set exists for your panel.
        cli_flag: --genotype-only, or --haplotype-definition for Deterministic haplotyping
      - label: Haplotype Definition
        control: popup
        default: no definition
        allowed: the Assay, Species, and Definition menus, filled from the project's haplotype definition sets, plus a Manage... button that opens the definitions window
        effect: Chooses the named haplotype definition set the run calls haplotypes against. With an MHC reference bundle that carries its own definitions, the group shows that bundle's summary instead of the menus.
        when_to_change: Choose a definition when you want named haplotype calls rather than allele genotypes alone.
        cli_flag: --haplotype-definition, with --haplotype-assay and --haplotype-species
      - label: minimap2 arguments
        control: text
        default: empty
        allowed: any command-line arguments minimap2 accepts
        effect: Passes extra arguments to minimap2, the program that lines each read up against the allele library, after the fixed mapping preset.
        when_to_change: Rarely, and only when you have a specific mapping argument from the minimap2 documentation to try.
        cli_flag: --extra-args
      - label: Keep Intermediates
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Keeps the large working files the run produces on its way to the report instead of deleting them at the end.
        when_to_change: Turn it on only when a run gave an unexpected result and you want to inspect the alignment files behind it.
        cli_flag: --keep-intermediates
      - label: Directory
        control: file
        default: the project's genotyping results folder
        allowed: any folder you have permission to write
        effect: Chooses where the .lungfishgenotype result bundle is written.
        when_to_change: Change it only when the result belongs outside the project folder.
        cli_flag: --output-dir
    cli_only:
      - flag: --mode
        default: auto for fastq genotype, illumina-paired for fastq genotype-cohort
        effect: Forces the input layout instead of letting the run work it out, accepting auto, ont-sample-bundles, illumina-paired, or the deprecated ont-barcode-demux.
      - flag: --read-type
        default: auto for fastq genotype, illumina for fastq genotype-cohort
        effect: Forces the sequencing platform to ont or illumina instead of reading it from the input bundles.
      - flag: --preset
        default: none
        effect: Locks the run to a bundled panel, and the only supported value is mcm-mhc-miseq, which carries its own reference and cannot be combined with --reference.
      - flag: --analysis-name
        default: the value of --output-name
        effect: Labels this analysis inside the workbook separately from the output file name.
      - flag: --sort-threads
        default: "4"
        effect: Sets how many threads samtools uses to sort the alignments before filtering.
      - flag: --barcodes
        default: none
        effect: Supplies sample identifiers and barcode sequences for the deprecated ONT barcode-demux mode.
      - flag: --demux-manifest
        default: none
        effect: Supplies recorded input and per-sample read counts for the deprecated ONT barcode-demux mode.
      - flag: --project
        default: none
        effect: Names a project directory into which an outside reference FASTA is imported before mapping.
    notes: >-
      One operation covers three input shapes. It handles prepared Illumina
      paired bundles, prepared ONT per-sample bundles, and a deprecated ONT
      barcode-demux mode. The dialog has no mode control, because the run works
      the shape out from the selected reads and shows the result as a read-only
      caption above Analysis Mode. Overlapping Illumina mates are merged with
      bbmerge before mapping, without which the 244 bp DRB amplicons would
      silently receive zero reads. Report Name fills both the output name and
      the analysis name in the dialog, while the command line splits them into
      --output-name and --analysis-name. Selecting more than one bundle locks
      the run picker to one merged batch, with the caption "Selections run as
      one genotyping batch producing a merged report. Run bundles individually
      for separate per-sample reports." The workflow also declares the
      lungfish-tools base pack, which is the lock file's own top-level packID
      rather than a packTools entry, so gating lists only read-mapping.
      There is no AI preset analysis mode. The Haplotype Definition group
      appears under Deterministic haplotyping. The CLI flags
      --haplotype-definition-scope, --haplotype-min-sample-percent,
      --haplotype-min-locus-percent, and --haplotype-min-locus-percent-override
      are listed in the CLI reference.

  genotype.full-length-ont:
    title: Full-length ONT MHC genotyping
    entry_points:
      - "Tools > Genotyping > Full-length ONT MHC genotyping..."
      - "CLI: lungfish-cli fastq full-length-ont-mhc-genotype <inputs> --reference <ref> --output-dir <dir>"
    gating: [read-mapping, full-length-mhc-genotyping]
    sources:
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationsDialog.swift
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationDialogState.swift
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - Sources/LungfishWorkflow/ONTGenotyping/FullLengthONTMHCGenotypingPipeline.swift
      - Sources/LungfishWorkflow/ONTGenotyping/FullLengthONTPBAAArtifactPlanner.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/fastq.txt
      - docs/user-manual/reviews/fidelity-2026-09/ground-truth/09-genotyping.md
    settings:
      - label: Reference
        control: file
        default: the first MHC reference found in the project, or nothing when the project holds none
        allowed: an allele FASTA file, a .lungfishref bundle, or a .lungfishmhcref bundle
        effect: Names the library of full-length allele sequences the clustered consensus sequences are compared against.
        when_to_change: Choose a full-length allele library, since a short-amplicon panel will not match reads that span the whole gene.
        cli_flag: --reference
      - label: FASTQ Bundles
        control: file
        default: whatever you selected in the sidebar before opening the dialog
        allowed: one or more per-sample ONT FASTQ files or .lungfishfastq bundles
        effect: Chooses which sequenced samples are clustered and genotyped. Samples are processed largest first and several run at once.
        when_to_change: Select every sample in the run when you want one comparison table for the cohort.
        cli_flag: null
      - label: Include subfolders
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: When a selected folder holds bundles inside further folders, this adds those deeper bundles to the batch as well.
        when_to_change: Turn it on when a sequencing run wrote each sample into its own subfolder.
        cli_flag: null
      - label: Report Name
        control: text
        default: a name built from the selected read files
        allowed: any file name
        effect: Names the .lungfishgenotype result bundle and the report inside it.
        when_to_change: Change it when the suggested name will not identify the run later.
        cli_flag: --output-name
      - label: Threads
        control: number
        default: the machine's active processor count
        allowed: integers above 0
        effect: How many worker threads the run may use in total across its clustering and mapping steps.
        when_to_change: Lower it when you need to keep cores free for other work.
        cli_flag: --threads
      - label: Min Length
        control: number
        default: "2000"
        allowed: integers above 0, and no greater than Max Length
        effect: The shortest read, in bases, kept for clustering after primers are trimmed. Shorter reads are usually fragments rather than whole amplicons.
        when_to_change: Set it just below your amplicon's true length so truncated reads do not form clusters of their own.
        cli_flag: --min-length
      - label: Max Length
        control: number
        default: "4000"
        allowed: integers no smaller than Min Length
        effect: The longest read, in bases, kept for clustering after primers are trimmed. Longer reads are usually two amplicons joined end to end.
        when_to_change: Raise it when your amplicon is longer than 4000 bases, and lower it when joined reads are producing spurious clusters.
        cli_flag: --max-length
      - label: Keep Intermediates
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Keeps the per-sample working files the run produces on its way to the report instead of deleting them at the end.
        when_to_change: Turn it on only when a sample gave an unexpected result and you want to inspect its clusters.
        cli_flag: --keep-intermediates
      - label: Orient Reference
        control: file
        default: an orientation FASTA discovered in the project, or nothing
        allowed: any FASTA file, or nothing
        effect: Supplies a sequence used to turn every read the same way round before clustering, since Nanopore reads arrive on either strand.
        when_to_change: Supply one when your reads were not oriented before import and clusters are splitting by strand.
        cli_flag: --orient-reference
      - label: Forward Primers
        control: file
        default: a forward-primer FASTA discovered in the project, or nothing
        allowed: any FASTA file of primer sequences, or nothing
        effect: Names the primer sequences trimmed from the start of each read, so primer bases do not count as sequence differences.
        when_to_change: Supply it when your reads still carry the PCR primers used to make the amplicon.
        cli_flag: --forward-primer
      - label: Reverse Primers
        control: file
        default: a reverse-primer FASTA discovered in the project, or nothing
        allowed: any FASTA file of primer sequences, or nothing
        effect: Names the primer sequences trimmed from the end of each read.
        when_to_change: Supply it when your reads still carry the PCR primers used to make the amplicon.
        cli_flag: --reverse-primer
      - label: Locus %
        control: number
        default: "1.0"
        allowed: 0 to 100
        effect: Drops a genotype row below this percent of the sample's retained reads at that locus before haplotype calls and the Excel output are made. It applies only when a haplotype definition is chosen, and Inspector filters change only what is shown. The command-line default is 0, which turns the filter off.
        when_to_change: Raise it when low-level noise at one locus is producing spurious haplotype calls.
        cli_flag: --haplotype-min-locus-percent
      - label: Haplotype Definition
        control: popup
        default: no definition
        allowed: the Assay, Species, and Definition menus, filled from the project's haplotype definition sets, plus a Manage... button that opens the definitions window
        effect: Chooses the named haplotype definition set the run calls haplotypes against. With an MHC reference bundle that carries its own definitions, the group shows that bundle's summary instead of the menus.
        when_to_change: Choose a definition when you want named haplotype calls rather than allele genotypes alone.
        cli_flag: --haplotype-definition, with --haplotype-assay and --haplotype-species
      - label: Directory
        control: file
        default: the project's "Full-length ONT MHC genotyping results" folder
        allowed: any folder you have permission to write
        effect: Chooses where the .lungfishgenotype result bundle is written.
        when_to_change: Change it only when the result belongs outside the project folder.
        cli_flag: --output-dir
    cli_only:
      - flag: --sample-jobs
        default: an automatic sample-level parallel strategy
        effect: Caps how many samples are worked on at the same time.
      - flag: --savont-threads-per-sample
        default: an automatic batch-aware value
        effect: Sets how many threads Savont gets for each sample being processed concurrently.
      - flag: --savont-quality-value-cutoff
        default: "90"
        effect: The lowest estimated read accuracy, as a percent, kept for clustering.
      - flag: --savont-min-cluster-size
        default: "3"
        effect: The fewest reads a cluster must hold before its consensus sequence is kept.
      - flag: --min-unmatched-reads
        default: "5"
        effect: The fewest reads a cluster must hold before it is written to the unmatched FASTA for later inspection.
      - flag: --cdna-threshold
        default: "2000"
        effect: Alleles in the reference shorter than this length are treated as cDNA sequences rather than whole genomic ones.
      - flag: --reuse-compatible-checkpoints
        default: "false"
        effect: Picks up compatible per-sample checkpoints from an earlier run instead of redoing that work.
      - flag: --project
        default: none
        effect: Names a project root recorded in the run's provenance.
    notes: >-
      The dialog exposes only Min Length and Max Length from the clustering
      step. The Savont quality cutoff and minimum cluster size are command-line
      settings with no dialog control. Clustering is always Savont, which the
      full-length-mhc-genotyping pack supplies at version 0.6.3 alongside BLAST
      2.16.0. pbAA is a separate operation whose saved artifact this workflow
      can reuse, not a clustering choice inside this dialog. Orient Reference,
      Forward Primers, Reverse Primers, and Keep Intermediates sit inside an
      "Advanced Options" disclosure group. The workflow also declares the
      lungfish-tools base pack, which is the lock file's own top-level packID
      rather than a packTools entry, so gating lists only the other two.
      haplotyping controls not registered
      (placeholder scope): the Call Thresholds group with its "Locus %" field,
      which the dialog starts at 1.0 and which only takes effect when a
      haplotype definition is selected, and the Haplotype Definition group with
      its Assay, Species, and Definition pickers and its Manage... button. The
      matching CLI flags --haplotype-min-sample-percent,
      --haplotype-min-locus-percent, --haplotype-min-locus-percent-override,
      --haplotype-assay, --haplotype-species, --haplotype-definition-scope, and
      --haplotype-definition are left out for the same reason.

  genotype.display:
    title: Filter and colour the genotype matrix
    entry_points:
      - "Inspector > View tab > Genotype Display"
    gating: []
    sources:
      - Sources/LungfishGenotypeUI/GenotypeResultDisplaySection.swift
      - Sources/LungfishGenotypeUI/GenotypeResultDisplayState.swift
      - Sources/LungfishGenotypeUI/GenotypeNumericFilterDraft.swift
    settings:
      - label: Min reads
        control: number
        default: "0"
        allowed: 0 through 100,000, where 0 turns the filter off
        effect: Hides allele values in the matrix supported by fewer reads than this. The Genotype Matrix - Filtered worksheet of an Excel export then leaves those cells blank.
        when_to_change: Raise it to drop the low-count background before handing a table to a collaborator.
        cli_flag: --min-reads
      - label: Min percent
        control: number
        default: "0"
        allowed: 0 through 100, in steps of 0.5, where 0 turns the filter off
        effect: Hides allele values that make up less than this share of a sample's reads, for known alleles and candidate alleles alike. Percent Basis decides what that share is measured against.
        when_to_change: Use it instead of Min reads when samples were sequenced to very different depths, so one threshold suits them all.
        cli_flag: --min-percent
      - label: Seen in ≥ N% of animals
        control: number
        default: "0"
        allowed: 0 through 100, where 0 turns the filter off
        effect: Hides an allele row unless it is visible, with reads, in at least this share of the samples in the result. It counts animals, not reads, and is separate from Min percent.
        when_to_change: Raise it to focus on alleles common in the cohort. Leave it at 0 to keep private alleles found in a single animal.
        cli_flag: --min-prevalence-percent
      - label: Percent Basis
        control: radio
        default: Source Locus
        allowed: "Source Locus, Sample Retained"
        effect: Chooses the denominator for Min percent. Source Locus compares an allele against that sample's reads at the allele's own source locus, while Sample Retained compares it against all reads kept for the sample.
        when_to_change: Use Source Locus when loci were amplified to different depths, which is the usual case.
        cli_flag: --percent-basis
      - label: Alleles
        control: text
        default: empty
        allowed: any text
        effect: Keeps only the matrix rows whose allele name contains what you type.
        when_to_change: Use it to narrow a wide result to one locus family before exporting.
        cli_flag: null
      - label: Samples
        control: text
        default: empty
        allowed: any text
        effect: Keeps only the matrix columns whose sample name contains what you type.
        when_to_change: Use it to narrow the export to one plate or one animal group.
        cli_flag: --sample
      - label: Show All Rows
        control: popup
        default: not applicable, because it is a menu command rather than a stored value
        allowed: chosen from the "Rows..." menu, and disabled when no rows are hidden
        effect: Brings back every allele row you had hidden by selecting rows and choosing Hide Selected Rows. There is no automatic row limit that this undoes.
        when_to_change: Use it when hiding has gone too far and you want the full allele list back.
        cli_flag: null
      - label: Show All Columns
        control: popup
        default: not applicable, because it is a menu command rather than a stored value
        allowed: chosen from the "Columns..." menu, and disabled when no columns are hidden
        effect: Brings back every sample column you had hidden by selecting columns and choosing Hide Selected Columns.
        when_to_change: Use it when hiding has gone too far and you want the full sample list back.
        cli_flag: null
      - label: Cell Color
        control: radio
        default: Support
        allowed: "Support, Highlights, None"
        effect: Chooses what the matrix cell colours mean. Support shades each cell by its read count, Highlights shows only the colours you applied by hand, and None leaves cells plain.
        when_to_change: Switch to Highlights when you want an exported view to show only your own marks.
        cli_flag: null
    cli_only: []
    notes: >-
      Everything in the Genotype Display section is display state that never
      changes the stored calls, which the section itself states as "Visual
      filters do not change genotype calls." Min reads and Min percent carry
      lowercase second words in the app. Show All Rows and Show All Columns
      reverse hiding you applied yourself, and there is no automatic column
      window. The matching command-line flags belong to lungfish-cli genotype
      export and genotype export-pivot-xlsx.

  genotype.export:
    title: Export a genotype result
    entry_points:
      - "Inspector > Bundle tab > Excel > Export to Excel…"
      - "CLI: lungfish-cli genotype export --bundle <bundle> --output <file>"
      - "CLI: lungfish-cli genotype export-xlsx --bundle <bundle> --output <file>"
      - "CLI: lungfish-cli genotype export-pivot-xlsx --bundle <bundle> --output <file>"
      - "CLI: lungfish-cli genotype export-labkey --bundle <bundle> --output-dir <dir>"
    gating: []
    sources:
      - Sources/LungfishGenotypeUI/GenotypeResultViewController.swift
      - Sources/LungfishGenotypeUI/GenotypeResultDisplaySection.swift
      - Sources/LungfishGenotypeUI/GenotypeResultDisplayState.swift
      - Sources/LungfishGenotypeUI/GenotypeNumericFilterDraft.swift
      - Sources/LungfishGenotypeUI/GenotypeViewportExportService.swift
      - Sources/LungfishGenotypeUI/GenotypeResultDocumentSection.swift
      - Sources/LungfishIO/Bundles/ONTGenotypeResultBundle.swift
      - Sources/LungfishCLI/Commands/GenotypeExportXlsxSubcommand.swift
      - Sources/LungfishCLI/Commands/GenotypeExportLabKeySubcommand.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/genotype.txt
      - docs/user-manual/reviews/fidelity-2026-09/ground-truth/09-genotyping.md
    settings:
      - label: "Export to Excel…"
        control: popup
        default: not applicable, because it is a button
        allowed: pressed, and disabled while an export is running
        effect: Captures the result and the current display filters, then writes a one-way Excel report with Genotype Matrix - All, Genotype Matrix - Filtered (with an Evidence (display / raw support) column), Export Metadata, and Haplotype Calls when haplotype content exists, plus a .xlsx.provenance.json receipt and a .xlsx.export-<id> replay folder beside it.
        when_to_change: Use it whenever someone outside LGE needs the reviewed result.
        cli_flag: null
    cli_only:
      - flag: --export-format
        default: xlsx
        effect: Chooses the container the genotype export subcommand writes, accepting xlsx, csv, or tsv. The in-app Export to Excel… button always writes XLSX.
      - flag: --view-projection
        default: none
        effect: Points at a JSON file describing a rendered viewport, which is how an export reproduces exactly what was on screen.
      - flag: --lens
        default: none
        effect: Records which viewport view the export came from in the export's provenance.
      - flag: --annotations
        default: the bundle's own annotations.json when one is present
        effect: Names an annotation sidecar whose notes and comments are folded into the export.
      - flag: --active-haplotype-definition
        default: none
        effect: Names the haplotype definition set the calls are resolved against for the export.
      - flag: --min-prevalence-percent
        default: "0"
        effect: Hides Filtered rows visible in fewer than this percent of samples, the window's "Seen in ≥ N% of animals" control.
      - flag: --force
        default: "false"
        effect: Overwrites an existing output file instead of stopping.
    notes: >-
      The only in-app export is the Export to Excel… button in the Inspector's
      Bundle tab. There is no Actions-menu export and no current.xlsx updater.
      The display filters it captures are registered under genotype.display.
      genotype export --percent-basis defaults to viewed-locus, the window's
      Source Locus, while genotype export-pivot-xlsx defaults to
      sample-retained. The older flags --source-workbook and --keep-empty-rows
      are rejected. genotype export-xlsx replays a durable capture with
      --snapshot, --provenance-request, and --python. The genotype
      export-labkey subcommand writes five CSV files, haplotype_calls.csv,
      allele_read_counts.csv, overrides.csv, audit_log.csv, and
      smart_cohorts.csv. AI haplotyping is not exposed and is not registered.

  workflow.viral-recon:
    title: Viral Recon
    entry_points:
      - "Tools > Mapping > Viral Recon..."
      - "CLI: lungfish-cli workflow run nf-core/viralrecon --input <samplesheet> --expected-output <path>"
    gating: [docker]
    sources:
      - Sources/LungfishApp/Views/Mapping/ViralReconWizardSheet.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Resources/PrimerSchemes
      - Sources/LungfishWorkflow/nf-core/NFCoreRunRequest.swift
      - Sources/LungfishWorkflow/nf-core/NFCoreSupportedWorkflowCatalog.swift
      - Sources/LungfishWorkflow/Engines/ContainerRuntimeProtocol.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/workflow.txt
    settings:
      - label: Platform
        control: radio
        default: Illumina
        allowed: "Illumina, Nanopore"
        effect: Tells the pipeline which sequencing machine produced the reads, because short paired Illumina reads and long Nanopore reads are processed by different steps. This control appears only when the selected bundles do not name their own platform.
        when_to_change: Set it by hand when the readiness line says the platform could not be detected, which happens with reads whose bundle metadata was lost in an earlier copy.
        cli_flag: --param platform=<illumina|nanopore>
      - label: Scheme
        control: popup
        default: the first scheme in alphabetical order, which is ARTIC SARS-CoV-2 V3 (Built-in)
        allowed: "the eight bundled SARS-CoV-2 schemes ARTIC SARS-CoV-2 V3, ARTIC SARS-CoV-2 V4, ARTIC SARS-CoV-2 V4.1, ARTIC SARS-CoV-2 V5.3.2, Midnight 1200 bp V1, NEB VarSkip Long v1, NEB VarSkip Short v1, QIAseq Direct SARS-CoV-2 with Booster A, plus any .lungfishprimers bundle in the project's Primer Schemes folder"
        effect: Names the set of PCR primers used to amplify the virus, so the pipeline knows where each amplicon starts and ends and can cut the primer sequence off the reads. Primer bases are copies of the primer rather than of the sample, so leaving them in fakes variant calls at the amplicon edges.
        when_to_change: Always match the scheme to the kit the wet-lab protocol used, because a mismatched scheme trims the wrong positions and leaves real primer sequence behind.
        cli_flag: --param primer_bed=<path>, with --param primer_left_suffix and --param primer_right_suffix
      - label: "Minimum mapped reads:"
        control: number
        default: 1000
        allowed: integers from 1 to 1000000, stepping by 100
        effect: Sets how many reads must align to the SARS-CoV-2 genome before a sample is kept. A sample with fewer mapped reads than this is dropped from the run rather than given a consensus sequence built on too little evidence.
        when_to_change: Lower it when you deliberately sequenced low-titre samples and want a partial consensus anyway, and raise it when you would rather see nothing than a mostly ambiguous genome.
        cli_flag: --param min_mapped_reads
      - label: Annotation
        control: file
        default: none, meaning the downloaded reference carries its own GFF3 annotations
        allowed: a GFF3 file
        effect: Points the run at a gene annotation file so variant effects are reported against named genes rather than genome positions alone. The bundled SARS-CoV-2 reference already carries annotations, so this is left empty for a standard run.
        when_to_change: Choose a file when you have a curated annotation that differs from the reference's own, for example one with an added or renamed open reading frame.
        cli_flag: --param gff
      - label: Extra parameters
        control: text
        default: empty
        allowed: pairs of the form --name value, where each name is a Viral Recon pipeline parameter
        effect: Passes further pipeline parameters straight to Viral Recon. Each name is checked against the pipeline's own parameter list before the run starts, so a typo is caught here rather than several minutes in.
        when_to_change: Use it for a pipeline option the wizard does not expose, such as choosing a different variant caller or skipping a report step.
        cli_flag: --param
    cli_only:
      - flag: --executor
        default: docker
        effect: Chooses the execution profile for an nf-core run. Docker is the default and the only profile that reaches a working run, because Apple Containerization is mapped onto the same Docker profile, so the wizard fixes it rather than offering it.
      - flag: --version
        default: "3.0.0"
        effect: Selects the nf-core/viralrecon release or tag. The wizard pins 3.0.0, the revision recorded in the tool lock manifest.
      - flag: --cpus
        default: the smaller of the machine's core count and 8
        effect: Becomes the pipeline's max_cpus parameter, which caps how many cores any one pipeline step may use.
      - flag: --memory
        default: 8.GB
        effect: Becomes the pipeline's max_memory parameter, which caps how much memory any one pipeline step may use.
      - flag: --results-dir
        default: ./results
        effect: Chooses where the pipeline writes its output tree. The wizard instead writes to a viralrecon-results folder under the project's Analyses folder.
      - flag: --expected-output
        default: none, and at least one is required unless --prepare-only is given
        effect: Names a final output that must receive a provenance sidecar. Repeat it once per scientific output.
      - flag: --timeout
        default: none
        effect: Rejected for an nf-core run with the message that timeouts are not supported for viralrecon yet.
    notes: >-
      Viral Recon is SARS-CoV-2 only. The reference is hard-coded to the
      canonical accession and never offered as a control, and the executor is
      fixed to Docker at ViralReconWizardSheet.swift:614, so the sheet's
      VisibleControl enum carries reference and executor cases only so tests can
      assert they never appear. The wizard also fixes the variant caller to
      iVar, the consensus caller to bcftools, and the protocol to amplicon.
      The Advanced disclosure group holds Annotation and Extra parameters and
      starts collapsed. Requires Docker Desktop, which the header line states.

  workflow.freyja-demix:
    title: Freyja demix
    entry_points:
      - "CLI: lungfish-cli freyja demix --variants <variants> --depths <depths> --output-dir <dir>"
    gating: [wastewater-surveillance, experimental]
    sources:
      - Sources/LungfishWorkflow/Metagenomics/FreyjaDemixPlan.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/freyja.txt
    settings: []
    cli_only:
      - flag: --variants
        default: none, and the flag is required
        effect: Names the variants table that freyja variants wrote, which lists each genome position where the sample differs from the reference and how often.
      - flag: --depths
        default: none, and the flag is required
        effect: Names the depths table that freyja variants wrote, which lists how many reads covered each genome position. Demixing needs both tables because a mutation frequency means nothing without the coverage behind it.
      - flag: --output-dir
        default: none, and the flag is required
        effect: Chooses the directory that receives the command plan, the provenance record, and the freyja-demix.tsv result.
      - flag: --sample
        default: empty
        effect: Records a sample identifier in the plan and in provenance so the run is attributable. It is not passed to Freyja itself, because the pinned Freyja 2.0.3 has no --sample option and aborts when given one.
      - flag: --extra-args
        default: empty
        effect: Appends further arguments to the freyja demix command line, for example --eps to raise the reporting threshold or --barcodes to point at a newer lineage barcode file.
      - flag: --execute
        default: "false"
        effect: Runs Freyja through the wastewater-surveillance tool pack instead of only writing the plan.
      - flag: --dry-run
        default: "false"
        effect: Writes and prints the command plan without running Freyja. When given together with --execute it wins, so the plan and provenance are written and the tool does not run.
    notes: >-
      Freyja demix estimates which SARS-CoV-2 lineages are mixed together in one
      wastewater sample and in what proportions, so a single sewage sample
      reports a community rather than one genome. There is no dialog and no
      settings to register, because the operation is command-line only. The
      Tools handler showFreyjaDemix at AppDelegate+ToolsMenu.swift:146 only
      opens the Plugin Manager at the wastewater-surveillance pack, and no menu
      item wires even that handler. The wastewater-surveillance pack is
      experimental.

  workflow.library-run:
    title: Workflow Operations
    entry_points:
      - "Tools > Workflow Library... to link and enable a package, then Tools > <category> > <workflow name> to run it"
      - "Right-click a finished workflow row in the Operations panel > Run Again..."
      - "CLI: lungfish-cli workflow run <pipeline.nf|Snakefile> --results-dir <dir> --expected-output <path>"
      - "CLI: lungfish-cli run-headless <workflow> [workflow run options]"
    gating: []
    sources:
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - Sources/LungfishApp/Views/WorkflowLibrary/WorkflowLibraryPanelView.swift
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationsDialog.swift
      - Sources/LungfishApp/Views/WorkflowOperations/WorkflowOperationsWindowController.swift
      - Sources/LungfishApp/Views/Operations/OperationsPanelController.swift
      - Sources/LungfishWorkflow/WorkflowPackages/WorkflowPackageManifest.swift
      - Sources/LungfishWorkflow/LocalWorkflowRunBundle.swift
      - Examples/WorkflowPackages/hello-world-nextflow.lungfishflowpkg/manifest.json
      - Examples/WorkflowPackages/hello-world-snakemake.lungfishflowpkg/manifest.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/workflow.txt
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/run-headless.txt
    settings:
      - label: Enabled
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Turns a linked package into a runnable entry in its Tools category submenu. A package whose card reads Catalog only cannot be enabled, because a beta build runs only Nextflow and Snakemake packages whose manifest declares a required reference bundle input, a required FASTQ bundle input, and at least one output.
        when_to_change: Turn it on once for each package you intend to run, and off again to hide a workflow you no longer use without unlinking it.
        cli_flag: null
      - label: Reference
        control: file
        default: none
        allowed: any .lungfishref bundle, chosen from the Project Reference popup or with the Choose button
        effect: Supplies the reference bundle the package manifest declares as a required input. The popup lists the reference bundles already in the open project, and the Choose button reaches any other location.
        when_to_change: Change it whenever the run should be measured against a different genome, for example a newer assembly of the same organism.
        cli_flag: --input
      - label: FASTQ Bundles
        control: file
        default: the bundles selected in the sidebar when the window opened
        allowed: exactly one .lungfishfastq bundle for a linked package
        effect: Supplies the sequencing reads the package manifest declares as a required input. A linked workflow package accepts one bundle, and selecting more than one makes the Readiness line read that imported workflow packages currently accept one FASTQ bundle.
        when_to_change: Change it when a different library belongs in this run, and run the bundles one at a time when you have several.
        cli_flag: --input
      - label: Include subfolders
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Adds every eligible bundle found in folders beneath the one you selected. The checkbox appears only when the selected folder has subfolders that hold bundles.
        when_to_change: Turn it on when a run folder groups its libraries into per-sample subfolders and you want all of them.
        cli_flag: null
      - label: Output Name
        control: text
        default: derived from the package name and the selected inputs
        allowed: any text that is not blank
        effect: Names the result the run writes. The field is disabled during a Run Again, because a repeat run must not silently overwrite or rename the original result.
        when_to_change: Change it when a second run of the same package on the same inputs would otherwise collide with the first.
        cli_flag: null
      - label: Cores
        control: number
        default: the app's default thread count
        allowed: integers of 1 or more
        effect: How many processor cores the workflow engine may use. A local Snakemake run receives this as its --cores value, and a Nextflow run records it without enforcing a per-process limit. The field is disabled during a Run Again, because a repeat run must reuse the recorded core count.
        when_to_change: Lower it to keep the machine responsive while a long pipeline runs, and raise it on a machine with cores to spare.
        cli_flag: --cpus
      - label: Directory
        control: file
        default: a fresh directory under the project
        allowed: any writable directory
        effect: Chooses where the run writes its results. A Run Again always uses a fresh output directory so the original run stays untouched.
        when_to_change: Change it when the results belong on a different volume, for example one with more free space.
        cli_flag: --results-dir
    cli_only:
      - flag: --executor
        default: docker
        effect: Chooses the execution profile for an nf-core run. Docker is the only working Nextflow executor, since every container runtime, Apple Containerization included, is mapped onto the same Docker profile.
      - flag: --expected-output
        default: none, and at least one is required unless --prepare-only is given
        effect: Names a scientific output that must receive a provenance sidecar once the run succeeds. Declaring an output does not make the workflow create it.
      - flag: --param
        default: none
        effect: Supplies one workflow parameter as key=value. Repeat the flag once per parameter.
      - flag: --params-file
        default: none
        effect: Loads workflow parameters from a JSON or YAML file instead of one flag per parameter.
      - flag: --memory
        default: none
        effect: Records a memory ceiling. The local Nextflow and Snakemake adapters do not enforce it, and an nf-core run turns it into the max_memory parameter.
      - flag: --workdir
        default: none
        effect: Passed to Nextflow as -work-dir. A local Snakemake run keeps it in the run history without a matching launch option.
      - flag: --resume
        default: "false"
        effect: Adds Nextflow's -resume so a repeated run continues from the last checkpoint. A local Snakemake run keeps it in the run history without a matching launch option.
      - flag: --repeat-from
        default: none
        effect: Validates an original .lungfishrun bundle before starting a fresh attempt. It is the command-line counterpart of Run Again.
      - flag: --bundle-root
        default: the current directory
        effect: Chooses the parent directory that receives the new .lungfishrun bundle.
      - flag: --bundle-path
        default: none
        effect: Sets the exact .lungfishrun bundle path to create or update, instead of letting the name follow the workflow.
      - flag: --dry-run
        default: "false"
        effect: Validates the workflow without executing it.
      - flag: --prepare-only
        default: "false"
        effect: Creates the run bundle and the command preview without launching the engine, and waives the expected-output requirement.
      - flag: --timeout
        default: none
        effect: Accepted but not enforced by the local runner, and rejected for an nf-core run.
      - flag: --format
        default: text
        effect: Chooses the output format of workflow run, list, and validate. The values are text, json, and tsv.
      - flag: --nf-core
        default: "false"
        effect: On workflow list, prints the one supported nf-core pipeline. Without it the command prints a usage hint rather than a project inventory.
    notes: >-
      A package enters the library through the Link Workflow... button, which
      opens an open panel titled Link Workflow Package. The package stays where
      it is, and linking the same workflow identity replaces its source and
      version while preserving enablement. Each card carries a Runnable or
      Catalog only badge. The Workflow Operations window has six sections,
      Overview, Inputs, Primary settings, Advanced settings, Output, and
      Readiness, and its Advanced settings section for a linked package is
      read-only text listing the manifest's declared inputs, outputs, and
      runtime. The parameter form is generated from the manifest, so a package
      declaring different inputs shows different pickers. Two example packages
      ship at Examples/WorkflowPackages/. Command-runner packages can be linked
      and reviewed but not executed in a beta build. The Run Again flow adds an
      Open Previous Run... button, a Locate Original Reads... button, an Open
      Workflow Library... button, an Open Tool Setup... button that opens the
      Plugin Manager, and a Check Configuration button. Run Again accepts only
      the original package and input bytes. The command lungfish-cli workflow
      validate accepts a .nf file or a filename containing snakefile and rejects
      anything else. The engine is inferred from the path, and workflow run
      matches the .nf extension in lower case only.

  workflow.builder:
    title: Workflow Builder
    entry_points:
      - "Tools > Workflow Builder (Experimental)..."
      - "CLI: lungfish-cli workflow builder-run --workflow <bundle> --project <project>"
    gating: [experimental]
    sources:
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishApp/Views/Settings/AdvancedSettingsTab.swift
      - Sources/LungfishApp/Views/WorkflowBuilder/WorkflowBuilderViewController.swift
      - Sources/LungfishApp/Views/WorkflowBuilder/WorkflowNodePalette.swift
      - Sources/LungfishApp/Views/WorkflowBuilder/WorkflowCanvasView.swift
      - Sources/LungfishApp/Views/WorkflowBuilder/WorkflowNodeInspectorView.swift
      - Sources/LungfishWorkflow/Builder/WorkflowNode.swift
      - Sources/LungfishWorkflow/Builder/WorkflowBuilderPlanCompiler.swift
      - Sources/LungfishWorkflow/Builder/WorkflowBuilderNativeRunner.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/workflow.txt
    settings:
      - label: FASTQ bundle
        control: popup
        default: unset
        allowed: a project-relative path matching @/<name>.lungfishfastq, chosen from a popup of the bundles in the open project
        effect: Names the reads the graph runs on. The node stores a path relative to the project, such as @/Imports/Sample.lungfishfastq, so the workflow stays portable when the project moves.
        when_to_change: Set it once per graph, and change it to point the same chain of steps at a different library.
        cli_flag: null
      - label: Detect adapters
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Lets fastp work out the adapter sequence from the reads themselves rather than being told it. Adapters are short synthetic sequences added during library preparation, and leaving them in makes reads look like they carry bases the sample never had.
        when_to_change: Turn it off only when you already know the adapter and pass it another way, because detection costs almost nothing.
        cli_flag: null
      - label: Quality threshold
        control: number
        default: 15
        allowed: integers from 0 to 93
        effect: Sets the lowest base-call quality that survives trimming. A Phred score of 15 means the machine estimates about a 3 percent chance the base is wrong, and 20 means about 1 percent.
        when_to_change: Raise it toward 20 when downstream variant calls must be conservative, and lower it when a low-yield run needs every base it can keep.
        cli_flag: null
      - label: Window size
        control: number
        default: 5
        allowed: integers of 1 or more
        effect: How many neighbouring bases fastp averages when it decides where quality has dropped. A larger window smooths over single bad bases, and a smaller one reacts to them.
        when_to_change: rarely
        cli_flag: null
      - label: Cut mode
        control: popup
        default: right
        allowed: "right, front, tail, both"
        effect: Chooses which end of each read the sliding-quality trim works from. Right and tail trim from the 3-prime end where quality usually falls off, front trims from the 5-prime end, and both trims from each end.
        when_to_change: Choose front or both when the run's quality plots show the first bases are also poor, which happens on some chemistries.
        cli_flag: null
      - label: Database
        control: popup
        default: deacon-panhuman
        allowed: deacon-panhuman
        effect: Names the human reference index used to spot and drop human reads. Only one database ships, so the control records the choice rather than offering alternatives.
        when_to_change: rarely, since there is one allowed value
        cli_flag: null
      - label: Minimum overlap
        control: number
        default: 15
        allowed: integers of 1 or more
        effect: How many bases the two reads of a pair must share before fastp joins them into one longer read. Too small a value merges pairs that only look like they overlap.
        when_to_change: Raise it when the insert size is long enough that genuine overlaps are large, so chance matches do not get merged.
        cli_flag: null
      - label: Minimum length
        control: number
        default: 50
        allowed: integers of 0 or more
        effect: Drops any read shorter than this after trimming. Very short reads map to many places at once and add noise rather than evidence.
        when_to_change: Raise it for a reference with lots of repeats, and lower it when the amplicon itself is short.
        cli_flag: null
      - label: Maximum length
        control: number
        default: unset, meaning no upper limit
        allowed: integers of 1 or more
        effect: Drops any read longer than this. Leaving it unset keeps every read that passes the minimum.
        when_to_change: Set it when a fixed-length amplicon run has produced over-long reads that indicate concatemers or chimeras.
        cli_flag: null
      - label: Filter nodes
        control: text
        default: empty
        allowed: any text
        effect: Narrows the palette to node types whose name contains what you type. The full list returns when the field is cleared.
        when_to_change: Use it to reach a node without scrolling, which matters little at six nodes.
        cli_flag: null
      - label: Grid
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Shows or hides the faint alignment grid behind the canvas.
        when_to_change: Turn it off for a cleaner screenshot of a finished graph.
        cli_flag: null
      - label: Snap
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Makes a dragged node settle onto the nearest grid position instead of stopping wherever the mouse released.
        when_to_change: Turn it off when you want a node placed exactly where you put it.
        cli_flag: null
    cli_only:
      - flag: --workflow
        default: none, and the flag is required
        effect: Names the .lungfishflow bundle or graph JSON to run.
      - flag: --project
        default: none, and the flag is required
        effect: Names the active .lungfish project directory the graph's @/ paths resolve against.
      - flag: --run-directory
        default: a directory the command derives when the flag is omitted
        effect: Chooses where run state and intermediate files are written.
      - flag: --threads
        default: 4
        effect: How many processor cores the native FASTQ tools may use.
      - flag: --dry-run
        default: "false"
        effect: Compiles the executable plan and prints it as JSON without running any tool.
    notes: >-
      The menu item appears only when Show Experimental Features is turned on in
      Settings > Advanced. The palette shows four category headers, Input,
      Trimming and Filtering, Decontamination, and Read Processing, built from
      the six node types for which isBuilderNativeFASTQNode is true, namely
      FASTQ Bundle Input, Remove PCR duplicates, Adapter + quality trim, Remove
      human reads, Merge overlapping pairs, and Remove short reads. Remove PCR
      duplicates has no parameters. The node-type model defines eleven more
      types in three further categories, which appear in saved graphs and in the
      exporters but never in the palette. The settings above are grouped by
      node. FASTQ bundle belongs to FASTQ Bundle Input, Detect adapters through
      Cut mode to Adapter + quality trim, Database to Remove human reads,
      Minimum overlap to Merge overlapping pairs, and Minimum length and Maximum
      length to Remove short reads. Filter nodes, Grid, and Snap are window
      controls rather than node parameters. The window also carries Run, Zoom
      In, Zoom Out, Reset Zoom, and an Export menu with Export to Nextflow... and
      Export to Snakemake..., which is a separate code path from provenance
      export. The native runner requires a linear chain, so a branching graph is
      valid for export but refused on run. There is no File > Save Workflow item
      and no Cmd-S binding. Workflows are created and renamed from the left
      sidebar library, and clicking Run saves the graph first.

  provenance.export:
    title: Export Provenance
    entry_points:
      - "File > Export > Provenance > Shell Script..."
      - "File > Export > Provenance > Nextflow Pipeline..."
      - "CLI: lungfish-cli provenance export <input> --format <format> --output <dir>"
    gating: []
    sources:
      - Sources/LungfishWorkflow/Provenance/ProvenanceExporter.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishApp/App/AppDelegate+ImportExport.swift
      - Sources/LungfishApp/App/AppFilePanelFactory.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/provenance.txt
    settings:
      - label: Provenance
        control: popup
        default: none, because you pick a target from the submenu rather than accept a default
        allowed: "Shell Script..., Python Script..., Nextflow Pipeline..., Snakemake Workflow..., Methods Section..., Full Provenance (JSON)..."
        effect: Chooses what the export renders from the recorded history of the selected artifact. Shell Script writes run.sh, Python Script writes reproduce.py, Nextflow Pipeline writes main.nf with nextflow.config and containers/manifest.json, Snakemake Workflow writes a Snakefile with config.yaml, Methods Section writes methods.md, and Full Provenance writes provenance.json.
        when_to_change: Pick the target that matches what the reader needs, a runnable pipeline for a collaborator, a methods draft for a manuscript, or the raw JSON for an auditor.
        cli_flag: --format
      - label: Save As
        control: text
        default: "<artifact>-provenance-<format>, for example sample-provenance-nextflow"
        allowed: any folder name the file system accepts
        effect: Names the folder that receives the export. Because the default name carries the format, successive exports of the same artifact do not collide.
        when_to_change: Change it when several exports of the same artifact and format need to be told apart, for example before and after a reanalysis.
        cli_flag: --output
      - label: Where
        control: file
        default: the save panel's last location
        allowed: any writable directory
        effect: Chooses where the export folder is created. Putting it outside the project keeps the export separate from the data it describes.
        when_to_change: Choose a location you can share, such as a repository checkout, when the export is going to a collaborator.
        cli_flag: --output
    cli_only: []
    notes: >-
      The export is scoped to one artifact. LGE walks the visible viewport
      candidates and then the sidebar selection, and falls back to the most
      recent completed run when nothing is selected, so select the artifact
      whose history you want before choosing a target. An artifact with no
      recorded history raises a no-provenance alert. The save panel is titled
      Export Provenance with the message "Choose a folder name for the exported
      reproducibility package.", and its button is the standard Save rather than
      one named Export. On success a Provenance Export Complete alert appears
      with OK and Show in Finder, and nothing is revealed unless you click the
      second button. Every target also writes a provenance subdirectory of the
      copied records. Two further command-line subcommands have no menu
      equivalent. provenance verify checks a signature, and provenance
      bibliography generates a citation list from a bundle's provenance.

  provenance.verify:
    title: Verify a signed provenance record
    entry_points:
      - "CLI: lungfish-cli provenance verify <sidecar or folder> [--signature <file>] [--public-key <file>]"
    gating: []
    sources:
      - Sources/LungfishCLI/Commands/ProvenanceCommand.swift
    settings: []
    cli_only:
      - flag: --signature
        default: "<sidecar>.signature.json"
        effect: Names the signature artifact to check instead of the default beside the sidecar.
      - flag: --public-key
        default: "<sidecar>.pub"
        effect: Names the public key artifact to check against instead of the default beside the sidecar.
    notes: >-
      Command line only. On an unsigned record it prints "Signature artifact is
      missing" and exits non-zero. Signing is off by default.

  sequence.find-orfs:
    title: Find ORFs
    entry_points:
      - "Sequence > Find ORFs..."
      - "CLI: lungfish-cli sequence annotate-orfs <bundle> [options]"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Sequence/SequenceORFOperationDialog.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishApp/App/AppDelegate+SequenceMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/sequence.txt
    settings:
      - label: "+1, +2, +3, -1, -2, -3"
        control: checkbox
        default: all six checked
        allowed: any combination of the six reading frames, at least one
        effect: Chooses which reading frames the search scans. The three plus frames read the sequence forward starting 0, 1, or 2 bases in, and the three minus frames do the same on the reverse complement.
        when_to_change: Uncheck the frames you already know are empty, or the frames on the strand you are not interested in, to shorten the results list.
        cli_flag: --frames
      - label: Codon table
        control: popup
        default: "1 - Standard"
        allowed: any NCBI genetic code table registered in the app, for example Standard, Vertebrate Mitochondrial, Yeast Mitochondrial, Bacterial
        effect: Sets which codon-to-amino-acid table decides where a reading frame starts and how it translates. A different table changes both the start codons the search accepts and the protein sequence written into the annotation.
        when_to_change: Switch it when the sequence comes from an organelle or organism with a non-standard genetic code, such as vertebrate mitochondrial DNA.
        cli_flag: --table
      - label: Minimum ORF length
        control: number
        default: 100
        allowed: positive integers, in nucleotides
        effect: Sets the shortest open reading frame the search keeps, measured in nucleotides. Shorter candidates are discarded before the track is written.
        when_to_change: Raise it to cut down on short, likely spurious ORFs, or lower it when searching a short sequence such as a single gene.
        cli_flag: --min-length
      - label: Track name
        control: text
        default: "<sequence name> ORFs in the dialog, ORFs on the command line"
        allowed: any text
        effect: Names the new annotation track that the found ORFs are written into.
        when_to_change: Change it when the default name would collide with a track you already have, or to describe the search more specifically.
        cli_flag: --track-name
      - label: Track ID
        control: text
        default: orfs_ followed by the sequence name in lower case in the dialog, orfs on the command line
        allowed: letters, numbers, underscores, and hyphens, or blank to accept the generated ID
        effect: Sets the internal identifier for the new track, separate from its display name.
        when_to_change: Rarely, only when scripting against a specific track ID elsewhere.
        cli_flag: --track-id
      - label: Include partial ORFs
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Keeps ORFs that run off either end of the searched range instead of requiring a complete stop codon inside it.
        when_to_change: Turn it on when the searched range is a cropped view of a longer sequence and a real ORF may be cut off at an edge.
        cli_flag: --include-partial
      - label: Allow alternative starts
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Lets the search accept the codon table's alternative start codons, not only ATG, as the beginning of an ORF.
        when_to_change: Turn it on for organisms or organelles known to use alternative starts, or when a real ORF is being missed because it begins with one.
        cli_flag: --allow-alternative-starts
    cli_only:
      - flag: --sequence
        default: the first sequence in the bundle
        effect: Names the sequence or chromosome to search, when the bundle holds more than one.
      - flag: --start
        default: "0"
        effect: Sets the 0-based inclusive start coordinate of the searched range.
      - flag: --end
        default: the sequence length
        effect: Sets the 0-based exclusive end coordinate of the searched range.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
    notes: >-
      The dialog always searches the sequence and range that were visible in
      the viewport when Find ORFs... was chosen, shown as a read-only dataset
      label, so --sequence, --start, and --end have no dialog counterparts.
      The six frame checkboxes sit under one Reading Frames heading, codon
      table and minimum length under Translation, track name and ID under
      Output, and the two remaining checkboxes under Options. Running the
      operation requires an active .lungfishref reference bundle and fails
      with a "No Reference Bundle" alert otherwise.

  sequence.extract-region:
    title: Extract Sequence
    entry_points:
      - "Sequence > Extract Visible Region..."
      - "Right-click an annotation in the sequence viewport > Extract Sequence..."
      - "CLI: lungfish-cli extract sequence <input> <region> [options]"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+Extraction.swift
      - Sources/LungfishApp/Views/Extraction/ExtractionConfigurationView.swift
      - Sources/LungfishApp/Views/Viewer/FASTASequenceExtractionDialog.swift
      - Sources/LungfishApp/Views/Metagenomics/ClassifierExtractionDialog.swift
      - Sources/LungfishApp/Views/Viewer/SequenceViewerView+Interaction.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/extract.txt
    settings:
      - label: 5' Flank
        control: number
        default: 0
        allowed: non-negative integers, in base pairs, with 100/500/1000/5000 preset buttons
        effect: Adds this many extra bases of sequence upstream of the extracted region, on the 5' side.
        when_to_change: Raise it when the extracted piece needs surrounding context, for example primer-binding sequence just outside an amplicon.
        cli_flag: --flank-5
      - label: 3' Flank
        control: number
        default: 0
        allowed: non-negative integers, in base pairs, with 100/500/1000/5000 preset buttons
        effect: Adds this many extra bases of sequence downstream of the extracted region, on the 3' side.
        when_to_change: Raise it symmetrically with 5' Flank when you want equal padding on both sides.
        cli_flag: --flank-3
      - label: Reverse Complement
        control: checkbox
        default: "false"
        allowed: "true, false"
        effect: Writes the extracted sequence as its reverse complement instead of the strand it was read from.
        when_to_change: Turn it on when the region you selected is on the minus strand and you want the sequence read in its coding orientation.
        cli_flag: --reverse-complement
      - label: Concatenate Exons (remove introns)
        control: checkbox
        default: "true"
        allowed: "true, false"
        effect: Joins a multi-exon annotation's pieces into one continuous sequence with the introns removed. This setting only appears when the extracted annotation is discontiguous.
        when_to_change: Turn it off when you need the full genomic span, introns included, rather than the spliced sequence.
        cli_flag: null
      - label: Destination
        control: radio
        default: Save as Bundle
        allowed: "Save as Bundle, Save to File..., Copy to Clipboard, Share..."
        effect: Chooses where the extracted sequence goes. Save as Bundle creates a new .lungfishref bundle, Save to File writes a FASTA file, Copy to Clipboard puts FASTA text on the pasteboard, and Share opens the macOS share sheet.
        when_to_change: Pick Save to File or Share when the sequence is headed outside the app, and Copy to Clipboard for a quick paste into another program.
        cli_flag: null
      - label: Name
        control: text
        default: derived from the source region or annotation name
        allowed: any text
        effect: Names the new bundle or file the extraction creates. The field is hidden for the Copy to Clipboard and Share destinations, which need no name.
        when_to_change: Change it when the derived name is not descriptive enough to find later.
        cli_flag: null
      - label: "Create Bundle / Save / Copy / Share"
        control: text
        default: n/a
        allowed: n/a
        effect: Runs the extraction. Its label changes with the chosen destination, Create Bundle for a new bundle, Save for a file, Copy for the clipboard, and Share for the share sheet.
        when_to_change: n/a
        cli_flag: null
    cli_only:
      - flag: --flank
        default: "0"
        effect: Adds the same number of flanking bases on both sides in one flag, instead of setting the 5' and 3' amounts separately.
      - flag: --line-width
        default: "70"
        effect: Sets how many bases the output FASTA wraps to per line.
      - flag: -o, --output
        default: stdout
        effect: Writes the extracted FASTA to a file path instead of standard output.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
    notes: >-
      Two different sheets share this operation id. Extract Visible Region...
      opens a sheet with Flanking Sequence, Reverse Complement, and a
      three-way Copy as FASTA / Copy Protein / New Bundle picker, and its New
      Bundle mode files the result under the project's Extractions folder.
      The annotation context menu's Extract Sequence... opens a plainer
      sheet with the four-way Destination choice above and no flank fields,
      and its Save as Bundle destination instead creates a derived reference
      bundle alongside the source bundle rather than in Extractions. Neither
      sheet exposes --line-width, and CLI --flank has no dialog counterpart
      in either sheet, which set 5' and 3' padding separately.
