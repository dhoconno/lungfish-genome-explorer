        effect: Keeps the leftover pieces of a read that spans a break, the signature of a structural rearrangement.
        when_to_change: Turn it off only when a downstream tool chokes on split records.
        cli_flag: --no-supplementary
      - label: "Min mapping quality:"
        control: number
        default: "0"
        allowed: 0 to 60
        effect: Throws away any read the mapper was not confident it placed correctly.
        when_to_change: Raise it to about 20 when repeated sequence is inflating false variants.
        cli_flag: --min-mapq
      - label: Extra arguments
        control: text
        default: empty
        allowed: any BBMap options, written the way you would type them at a command line
        effect: Passes options straight through to BBMap untouched, with no checking.
        when_to_change: Use it only when a published protocol names a flag the dialog does not expose.
        cli_flag: --extra-args
    cli_only:
      - flag: --mapper
        default: minimap2
        effect: Must be set to bbmap to select this mapper from the command line.
      - flag: -o, --output-dir
        default: a folder named mapping-<id> beside the input
        effect: Writes the sorted BAM and its index into a directory you name.
      - flag: --paired
        default: "false"
        effect: Binds exactly two input files as the first and second reads of the same fragments.
      - flag: --sample-name
        default: taken from the input file name
        effect: Names the sample for both the read groups and the output file names.
    notes: >-
      BBMap is not part of the read-mapping plugin pack. It comes from the required
      BBTools environment and is available as soon as the managed toolchain is
      provisioned, which is why its gating list is empty. The two BBMap modes are the
      only presets whose command-line preset values are bbmap-standard and
      bbmap-pacbio rather than a minimap2 preset name. The Extra arguments field's
      placeholder text is "minid=0.97 local=t".

  bam.mark-duplicates:
    title: Mark Duplicates in Bundle Tracks
    entry_points:
      - "Inspector > Analysis > Filtering > Mark Duplicates in Bundle Tracks"
      - "Inspector > Analysis > Export > Create Deduplicated Bundle"
      - "CLI: lungfish-cli markdup <path>"
      - "CLI: lungfish-cli bam markdup <path>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Inspector/Sections/ReadStyleSection.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+TrimDuplicateWorkflows.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/markdup.txt
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/bam.txt
    settings: []
    cli_only:
      - flag: --force
        default: "false"
        effect: Runs duplicate marking again even when the alignment already carries duplicate flags, which the command otherwise treats as work already done.
      - flag: --sort-threads
        default: "4"
        effect: Sets how many threads the sorting stages inside the duplicate-marking pipeline use, separately from the global thread count.
      - flag: --deduplicated-bundle
        default: none
        effect: Writes a second reference bundle beside the first with the flagged duplicate reads actually removed, leaving the input alignment untouched. The top-level markdup command has this flag and the bam markdup subcommand does not.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text or JSON.
    notes: >-
      Neither button opens a dialog, so this operation has no settings of its own.
      Mark Duplicates in Bundle Tracks marks every alignment track in the bundle
      rather than only the selected one, and it marks in place: it flags duplicates
      without deleting them, so a depth figure computed over all reads does not fall
      until something excludes the flagged reads. Create Deduplicated Bundle, on the
      Export tab, is the button that writes a separate copy with duplicates gone. Both
      buttons are disabled while another duplicate-marking run is in flight, and the
      bundle-level operation lock refuses a run while another operation holds the
      bundle.

  bam.primer-trim:
    title: Primer-trim BAM
    entry_points:
      - "Inspector > Analysis > Primer Trim > Primer-trim BAM..."
      - "CLI: lungfish-cli bam primer-trim --bundle <bundle> --alignment-track <track> --scheme <scheme> --name <name>"
    gating: [variant-calling]
    sources:
      - Sources/LungfishApp/Views/BAM/BAMPrimerTrimDialog.swift
      - Sources/LungfishApp/Views/BAM/BAMPrimerTrimToolPanes.swift
      - Sources/LungfishApp/Views/BAM/BAMPrimerTrimDialogState.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+TrimDuplicateWorkflows.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/bam.txt
    settings:
      - label: Primer Scheme
        control: popup
        default: no scheme chosen
        allowed: any of the eight built-in schemes, any scheme in the project's Primer Schemes folder, or one you pick with Browse...
        effect: Names the primer set the sequencing library was built with, so the app knows where on the genome each primer sits. Trimming with the wrong scheme removes the wrong bases.
        when_to_change: Always set it to the scheme your wet-lab protocol used, since there is no correct default.
        cli_flag: --scheme
      - label: Alignment Track
        control: popup
        default: the first eligible alignment track in the bundle
        allowed: any alignment track in the bundle that can be primer-trimmed
        effect: Chooses which alignment the primers are trimmed out of. The chosen track is left untouched and a new one is written.
        when_to_change: Check and change it whenever the bundle holds more than one alignment, since the default is just the first in the list.
        cli_flag: --alignment-track
      - label: Output Track Name
        control: text
        default: the source track name followed by a bullet, the words Primer-trimmed, and the scheme name in parentheses
        allowed: any text that does not match an existing track name
        effect: Names the new alignment that trimming produces. A name already in use is refused rather than overwritten.
        when_to_change: Change it when you want a shorter label in the sidebar.
        cli_flag: --name
      - label: Minimum read length after trim
        control: text
        default: "30"
        allowed: a whole number of bases
        effect: Discards any read left shorter than this once its primer bases have been clipped away. Very short reads map almost anywhere and add noise.
        when_to_change: Lower it when your amplicons are short enough that trimming leaves little behind.
        cli_flag: --ivar-min-length
      - label: Minimum quality
        control: text
        default: "20"
        allowed: a Phred quality score, typically 0 to 40
        effect: Sets the quality floor for the sliding-window trim that runs alongside primer removal. A Phred score of 20 means the machine expects one wrong base in a hundred.
        when_to_change: Raise it when the run's quality was high and you want only confident bases in the pileup.
        cli_flag: --ivar-min-quality
      - label: Sliding window width
        control: text
        default: "4"
        allowed: a whole number of bases
        effect: Sets how many bases the quality trimmer averages over as it walks in from each end. A wider window smooths over single bad bases.
        when_to_change: rarely
        cli_flag: --ivar-sliding-window
      - label: Primer offset
        control: text
        default: "0"
        allowed: a whole number of bases
        effect: Shifts the primer coordinates by this many bases before trimming, which compensates for a scheme whose coordinates are off by a fixed amount.
        when_to_change: Use it only when you know the scheme's coordinates do not line up with the reference you mapped against.
        cli_flag: --ivar-primer-offset
    cli_only:
      - flag: --target-reference
        default: the primer scheme's own canonical accession
        effect: Overrides which contig name in the alignment the primer scheme is matched against, for a BAM whose contig is named differently from the scheme's reference.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text or JSON.
    notes: >-
      The dialog stacks four panes: Primer Scheme, Target, Advanced Options, and
      Readiness. Advanced Options is a disclosure group that starts collapsed, so the
      four iVar numbers above are the ones a reader gets without touching anything.
      Eight primer schemes ship built in, all for SARS-CoV-2: ARTIC V3, V4, V4.1, and
      V5.3.2, Midnight 1200 bp V1, NEB VarSkip Short v1, NEB VarSkip Long v1, and
      QIAseq Direct SARS-CoV-2 with Booster A. Trimming soft-clips the primer bases
      rather than deleting them, and reads with no matching primer are kept, which the
      Target pane states in the dialog. The result lands in the bundle's
      alignments/primer-trimmed directory. The Readiness pane names whatever is missing
      when Run is disabled, and failure surfaces as an alert titled "Primer Trim
      Failed".

  bam.extract-consensus:
    title: Extract Consensus
    entry_points:
      - "Inspector > Analysis > Consensus > Extract Consensus..."
    gating: []
    sources:
      - Sources/LungfishApp/Views/Inspector/Sections/ReadStyleSection.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+Mapping.swift
      - Sources/LungfishIO/Bundles/AlignmentDataProvider.swift
    settings:
      - label: Show consensus track in viewer
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Draws the consensus sequence as its own row above the reads in the viewport. Turning it off hides the row but does not change what extraction produces.
        when_to_change: Turn it off when the viewport is crowded and you only want the reads.
        cli_flag: null
      - label: Consensus Mode
        control: radio
        default: Bayesian
        allowed: Bayesian, Simple
        effect: Chooses how the consensus base at each position is decided. Bayesian weighs each read's base quality, while Simple takes whichever base appears most often.
        when_to_change: Switch to Simple when you want a plain majority call that is easy to explain and reproduce by hand.
        cli_flag: null
      - label: Consensus scope
        control: radio
        default: Whole contig
        allowed: Whole contig, Selected region
        effect: Decides whether the extracted sequence covers the entire reference or only the stretch you highlighted in the viewport.
        when_to_change: Switch to Selected region when you want the consensus of one gene or one amplicon rather than the whole genome.
        cli_flag: null
      - label: Use IUPAC ambiguity codes
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Writes a single letter standing for two or more possible bases where the reads disagree, instead of picking one winner. R means A or G, Y means C or T, and so on.
        when_to_change: Turn it on when you are reporting a mixed population and want the mixture visible in the sequence itself.
        cli_flag: null
      - label: Hide high-gap sites
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Masks columns where most of the reads that span the position carry a gap rather than a base. Those columns are usually alignment artifacts.
        when_to_change: Turn it on when a noisy long-read alignment is filling the consensus with spurious insertions.
        cli_flag: null
      - label: Consensus minimum depth
        control: slider
        default: "8"
        allowed: 1 to 50
        effect: Sets how many reads must cover a position before the app is willing to call a base there. Positions with fewer reads become N.
        when_to_change: Raise it when you need a publication-grade sequence and would rather have an N than a guess.
        cli_flag: null
      - label: Gap threshold
        control: slider
        default: 90 percent
        allowed: 50 to 99 percent
        effect: Sets what share of the spanning reads must carry a gap before the column is masked. It only appears when Hide high-gap sites is on.
        when_to_change: Lower it when obvious artifact columns are surviving at the default.
        cli_flag: null
      - label: Masking minimum depth
        control: slider
        default: "8"
        allowed: 1 to 50
        effect: Sets how many reads must span a position before gap masking is allowed to act on it, so a thin pile is not masked on the evidence of two reads. It only appears when Hide high-gap sites is on.
        when_to_change: rarely
        cli_flag: null
      - label: Consensus minimum MAPQ
        control: slider
        default: "0"
        allowed: 0 to 60
        effect: Ignores reads the mapper was not confident it placed, when deciding the consensus base. A value of 0 uses every read.
        when_to_change: Raise it when repeated sequence is dragging misplaced reads into the consensus.
        cli_flag: null
      - label: Consensus minimum base quality
        control: slider
        default: "0"
        allowed: 0 to 60
        effect: Ignores individual bases the sequencer called with low confidence. A value of 0 uses every base.
        when_to_change: Raise it to about 20 when the run's tail-end quality is poor.
        cli_flag: null
    cli_only: []
    notes: >-
      The Consensus tab's own note reads "Adjust consensus evidence settings here.
      Consensus controls are intentionally separate from View so display settings stay
      lighter." The settings above serve double duty, steering both the consensus row
      drawn in the viewport and the sequence that Extract Consensus... writes out. The
      Extract Consensus... button appears only when the current alignment supports
      extraction, and it uses whatever scope is selected above. When every position
      would come out as N the app asks for confirmation before writing the file. There
      is no CLI equivalent for this operation, and the recorded command in the
      operation history is written as "Lungfish.app alignment consensus".

  bam.filter:
    title: Create Filtered Alignment
    entry_points:
      - "Inspector > Analysis > Filtering > Create Filtered Alignment"
      - "CLI: lungfish-cli bam filter --alignment-track <track> --output-track-name <name>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Inspector/Sections/ReadStyleSection.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/bam.txt
    settings:
      - label: Starting Alignment
        control: popup
        default: the first alignment track in the bundle
        allowed: any alignment track in the bundle
        effect: Chooses which alignment the filtered copy is built from. The chosen track is left exactly as it was.
        when_to_change: Change it whenever the bundle holds more than one alignment and the default is not the one you meant.
        cli_flag: --alignment-track
      - label: Keep mapped reads only
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Drops reads the mapper could not place anywhere on the reference. Those reads carry no coordinate and contribute nothing to a pileup.
        when_to_change: Turn it off when you want to keep unmapped reads for a later attempt at a different reference.
        cli_flag: --mapped-only
      - label: Keep one primary alignment per read
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Keeps only the mapper's best placement for each read and discards the alternates and the split-read fragments.
        when_to_change: Turn it off when you are studying repeats or rearrangements and need the alternate placements.
        cli_flag: --primary-only
      - label: Minimum alignment confidence
        control: number
        default: "0"
        allowed: 0 to 255
        effect: Drops reads whose mapping quality falls below this. The panel spells the rule out, "Uses SAM MAPQ. Set to 0 to keep every alignment confidence level."
        when_to_change: Raise it to about 20 when you want only reads the mapper placed with confidence.
        cli_flag: --min-mapq
      - label: Duplicate handling
        control: popup
        default: Keep all reads
        allowed: Keep all reads, Hide duplicate-marked reads, Remove duplicate reads
        effect: Decides what happens to PCR duplicates, the extra copies of one original fragment that amplification produced. Hide drops reads already carrying a duplicate flag, and Remove marks duplicates first and then drops them.
        when_to_change: Choose Remove when the alignment has never been duplicate-marked and you want the effective depth.
        cli_flag: --exclude-marked-duplicates
      - label: Keep reads with zero mismatches to reference
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Keeps only reads that match the reference perfectly, base for base. Every read carrying even one difference is discarded.
        when_to_change: Turn it on for a strict identity check, and never when you are looking for variants.
        cli_flag: --exact-match
      - label: Minimum identity to reference (%)
        control: text
        default: empty, which keeps every read
        allowed: a percentage, or blank
        effect: Keeps only reads matching the reference at least this closely. It is the looser cousin of the zero-mismatch setting and is disabled while that setting is on.
        when_to_change: Set it around 95 when you want to shed clearly foreign reads without demanding perfection.
        cli_flag: --min-percent-identity
      - label: Name for New Alignment
        control: text
        default: Mapped primary alignments (filled in from the selected source track and the shipped filter defaults, and refilled when the source track changes)
        allowed: any text
        effect: Names the filtered alignment that the run produces. The run refuses to start when the field is emptied.
        when_to_change: Change it when the derived name would collide with a track already in the bundle, or when you want a shorter label in the sidebar.
        cli_flag: --output-track-name
    cli_only:
      - flag: --bundle
        default: none
        effect: Names the reference bundle directory the source alignment lives in.
      - flag: --mapping-result
        default: none
        effect: Points at a mapping analysis directory instead of a bundle, so a fresh mapping run can be filtered before it is adopted.
      - flag: --output-track-id
        default: a generated portable identifier
        effect: Fixes the new track's identifier so a script can refer to it later by name.
      - flag: --remove-duplicates
        default: "false"
        effect: Marks duplicates first and then excludes them, the command-line spelling of the Remove duplicate reads choice.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text or JSON.
    notes: >-
      The panel's own headnote reads "Creates new outputs in this bundle. The original
      alignment stays unchanged", and a second line points at where the result lands,
      "After creating a filtered alignment, find it under Bundle > Alignment Tracks and
      compare it separately under View > Alignment." The Duplicate handling picker maps
      to two separate command-line flags rather than one, because Keep all reads passes
      neither. The identity field is greyed out while zero-mismatch filtering is on and
      its placeholder changes to say so.

  bam.extract-reads-in-region:
    title: Extract Reads in Selected Region
    entry_points:
      - "Right-click a selection in the alignment track > Extract Reads in Selected Region..."
      - "Right-click a selected read > Extract Reads... (original reads)"
      - "CLI: lungfish-cli extract reads --by-region --bam <bam> --region <region> --output <output>"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Viewer/SequenceViewerView+Interaction.swift
      - Sources/LungfishKit/ReadSelectionActionMenuBuilder.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+Mapping.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/extract.txt
    settings:
      - label: (the selected region)
        control: text
        default: no selection, and the menu item stays hidden until you make one
        allowed: any stretch you drag out in the alignment track
        effect: Sets which piece of the genome the reads are pulled from. Every read overlapping the highlighted stretch is written out.
        when_to_change: Always, since the menu item does not appear until a region is selected.
        cli_flag: --region
      - label: (the save destination)
        control: file
        default: a bundle under alignment-read-extractions/ inside the mapping run's folder under Analyses/, or under the project root when the track has no run folder, named for the selection plus a UUID
        allowed: not offered in the window for a track inside a project, and a save panel appears only when no project root can be found
        effect: Chooses where the extracted reads are written. Inside a project the destination is fixed (AlignmentScientificActionCoordinator.defaultDestination), and it is not the Extractions/ folder the other extraction operations use.
        when_to_change: Only on the command line, where --output names the file or bundle directly.
        cli_flag: --output
    cli_only:
      - flag: --by-region
        default: "false"
        effect: Selects the region strategy, one of four the extract reads command offers alongside read ID, database, and classifier selection.
      - flag: --bam
        default: none
        effect: Names the sorted, indexed alignment file the reads are pulled from.
      - flag: --exclude-unmapped
        default: "false"
        effect: Applies a stricter filter that also drops unmapped reads, rather than only duplicates.
      - flag: --bundle
        default: "false"
        effect: Wraps the extracted reads in a .lungfishfastq bundle instead of leaving a loose file.
      - flag: --bundle-name
        default: none
        effect: Gives that bundle a display name, and implies the bundle flag.
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
    notes: >-
      The extraction has no dialog of its own. Selecting a region and choosing the menu
      item runs it straight away with no dialog and no save panel while the track sits
      inside a project. Right-clicking a read
      instead of a region gives two items, "Copy as FASTA (aligned orientation)", which
      copies the read exactly as it was aligned with its soft clips, and "Extract
      Reads... (original reads)", which pulls the read as originally sequenced out of
      the source FASTQ. The bundle lands under alignment-read-extractions/ inside the
      mapping run's folder under Analyses/, or under the project root when the track
      has no run folder, rather than in the Extractions/ folder the other extraction
      operations use (settled 2026-09-07). Failure surfaces as an alert titled
      "Extract Selected Region Failed".

  bam.read-display:
    title: Alignment display settings
    entry_points:
      - "Inspector > View (with an alignment track selected)"
    gating: []
    sources:
      - Sources/LungfishApp/Views/Inspector/Sections/ReadStyleSection.swift
      - Sources/LungfishKit/CoverageScaleMode.swift
      - Sources/LungfishApp/Views/Viewer/ReadViewportPolicy.swift
      - Sources/LungfishApp/Views/Viewer/ReadBudgetState.swift
    settings:
      - label: Visible Alignment
        control: popup
        default: All Alignments
        allowed: All Alignments, or any single alignment track in the bundle
        effect: Chooses whether the viewport stacks every alignment track at once or shows one at a time. Comparing a trimmed alignment against its source is easier one at a time.
        when_to_change: Switch to a single track when several alignments are overlapping and you cannot tell them apart.
        cli_flag: null
      - label: Show reads
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Draws the stacked reads underneath the coverage curve. Turning it off leaves the coverage curve and the reference visible.
        when_to_change: Turn it off when you only care about depth across a long stretch.
        cli_flag: null
      - label: Minimum alignment confidence
        control: slider
        default: "0"
        allowed: 0 to 60
        effect: Hides reads whose mapping quality falls below this, in the viewport only. It does not change the file on disk.
        when_to_change: Raise it to see how much of a suspicious pile survives once ambiguous placements are hidden.
        cli_flag: null
      - label: Coverage scale
        control: radio
        default: Linear
        allowed: Linear, Log10, Square root
        effect: Changes how depth is turned into bar height. On a linear scale one very deep peak flattens everything else, and compressing the axis lifts shallow regions back into view.
        when_to_change: Switch to Log10 when you are hunting for a dropout next to a deep amplicon peak.
        cli_flag: null
      - label: Include duplicate-marked reads
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Shows reads already flagged as PCR duplicates, and counts them in the depth the viewport draws.
        when_to_change: Turn it on when you want to see how much of a deep pile is duplicate copies of one fragment.
        cli_flag: null
      - label: Include secondary alignments
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Shows the alternate places a read could also have come from, on top of its best placement.
        when_to_change: Turn it on when a region is repeated and you want to see where else its reads fit.
        cli_flag: null
      - label: Include supplementary alignments
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Shows the leftover pieces of reads that span a break, where one part lands here and the rest lands elsewhere.
        when_to_change: Turn it on when you suspect a structural rearrangement at the position you are looking at.
        cli_flag: null
      - label: Limit visible rows
        control: checkbox
        default: "false"
        allowed: on or off
        effect: Caps how many rows of stacked reads are drawn. The help text notes that leaving it off "keeps all mapped reads in the active view and enables stable vertical scrolling".
        when_to_change: Turn it on when a very deep pile makes scrolling sluggish.
        cli_flag: null
      - label: Maximum rows
        control: slider with number field
        default: "75"
        allowed: 10 to 2,000 in steps of 10
        effect: Sets how many rows of stacked reads are drawn when Limit visible rows is on.
        when_to_change: Raise it to see more of a deep pile at once, or lower it when redrawing feels slow.
        cli_flag: null
      - label: Maximum displayed depth
        control: slider with number field
        default: "500"
        allowed: 50 to 5,000 in steps of 50 (shown as a depth, such as 500x)
        effect: Regions of the window deeper than this are sampled down to about this depth, and every other region shows every read. A banner says so whenever sampling happens. Depth, coverage, and the consensus always use every read.
        when_to_change: Lower it on an older machine when very deep windows feel slow to redraw. Raise it to see more of a deep amplicon's reads at once.
        cli_flag: null
      - label: Use compact row height
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Draws each read row shorter so more of the pile fits on screen at once.
        when_to_change: Turn it off when the rows are too thin to click accurately.
        cli_flag: null
      - label: Show matching bases as dots
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Draws a base that agrees with the reference as a dot and a disagreeing base as a coloured letter, so differences stand out. Turn it off and every base is drawn as a letter.
        when_to_change: Turn it off when you want to read the actual sequence of a read rather than only its differences.
        cli_flag: null
      - label: Show soft-clipped sequence
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Draws the parts of a read the mapper set aside as not matching, lightened at the read's ends. Primer trimming turns primer bases into exactly this kind of clipped sequence.
        when_to_change: Turn it off when clipped ends are cluttering a crowded pileup.
        cli_flag: null
      - label: Show insertion and deletion markers
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Marks the places where a read carries extra bases the reference does not have, or is missing bases the reference does have.
        when_to_change: rarely
        cli_flag: null
      - label: Color reads by strand
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Tints reads by which of the two DNA strands they came from, forward in blue and reverse in pink. Turning it off makes every read neutral grey.
        when_to_change: Turn it off when the tints distract from the base colours you are actually reading.
        cli_flag: null
      - label: Forward strand color
        control: popup
        default: a pale blue
        allowed: any colour
        effect: Sets the tint used for reads on the forward strand.
        when_to_change: Change it when the default pair is hard for you to tell apart.
        cli_flag: null
      - label: Reverse strand color
        control: popup
        default: a pale pink
        allowed: any colour
        effect: Sets the tint used for reads on the reverse strand.
        when_to_change: Change it when the default pair is hard for you to tell apart.
        cli_flag: null
      - label: Sort reads by
        control: popup
        default: Position
        allowed: Position, Read Name, Strand, Mapping Quality, Insert Size, Base at Position
        effect: Chooses the order in which reads are stacked into rows.
        when_to_change: Sort by Base at Position to group the reads that carry each base at a site you are checking.
        cli_flag: null
      - label: Color reads by
        control: popup
        default: Strand
        allowed: Strand, Insert Size, Mapping Quality, Read Group, First/Second in Pair, Base Quality
        effect: Chooses what the read tint shows. It can be changed only while Color reads by strand is on.
        when_to_change: Choose Mapping Quality or Read Group when that property matters more than strand for the question you are asking.
        cli_flag: null
    cli_only: []
    notes: >-
      These are viewer settings and change nothing on disk. When part of a window is
      deeper than the maximum displayed depth, a banner reads "Showing 72,087 of
      ~2,050,000 reads, regions above 500x are sampled to about 500x, all other regions
      show every read, depth, coverage and consensus use all reads" with a Load all
      button beside it, and Load all shows every read up to a two-million-read ceiling.
      Sampling uses a fixed seed, so the same reads appear on every redraw. Above roughly 2 bp per pixel the viewport stops drawing individual reads
      and shows only the coverage curve. A read-group panel appears below these
      controls when the alignment carries more than one read group.

  variants.call-lofreq:
    title: Call Variants (LoFreq)
    entry_points:
      - "Tools > Call Variants..."
      - "Inspector > Analysis > Variant Calling > Call Variants..."
      - "CLI: lungfish-cli variants call --bundle <bundle> --alignment-track <track> --caller lofreq"
    gating: [variant-calling]
    sources:
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingCatalog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingToolPanes.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishApp/Views/Inspector/Sections/ReadStyleSection.swift
      - Sources/LungfishWorkflow/Variants/ViralVariantCallingPipeline.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings:
      - label: Alignment Track
        control: popup
        default: the first analysis-ready BAM alignment track in the bundle
        allowed: any analysis-ready BAM alignment track in the bundle
        effect: Chooses which alignment the caller reads its evidence from. The alignment itself is never changed, only read.
        when_to_change: Change it whenever the bundle holds more than one alignment and the first one is not the one you meant.
        cli_flag: --alignment-track
      - label: Output Variant Track Name
        control: text
        default: the alignment name, then a bullet, then LoFreq
        allowed: any text, and the app appends a number when the name is already taken
        effect: Names the variant track the run creates. That name becomes the value in the table drawer's Source column, which is how you tell two callers apart.
        when_to_change: Change it when you want a shorter or more descriptive label than the generated one.
        cli_flag: --name
      - label: Minimum Allele Frequency
        control: text
        default: "0.05"
        allowed: a decimal between 0 and 1, or blank
        effect: Removes calls whose allele frequency is below this value after LoFreq finishes, using a bcftools view filter. The filter is skipped, and the skip recorded in provenance, when the VCF carries no allele-frequency tag.
        when_to_change: Raise it to drop low-frequency calls from the track. The window sends 0.05 by default.
        cli_flag: --min-af
      - label: Minimum Depth
        control: text
        default: "10"
        allowed: a whole number, or blank
        effect: Removes calls with fewer reads than this after LoFreq finishes, using a bcftools view filter. The filter is skipped, and the skip recorded in provenance, when the VCF carries no depth tag.
        when_to_change: Raise it to drop calls at thinly covered positions. The window sends 10 by default.
        cli_flag: --min-depth
      - label: Extra arguments
        control: text
        default: empty
        allowed: any LoFreq flags, written exactly as LoFreq expects them
        effect: Inserts your own text into the lofreq call command line, right after the word call and ahead of the reference, output, and BAM arguments. This is the only route to any LoFreq setting.
        when_to_change: Use it when you need a LoFreq knob such as --min-cov 50, or --call-indels to switch on indel calling.
        cli_flag: --extra-args
    cli_only:
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
      - flag: -t, --threads
        default: auto
        effect: Sets how many threads the run may use, where the GUI always takes the machine's processor count.
    notes: >-
      The dialog is two columns, a tool sidebar on the left and one scrolling detail
      pane on the right, over a footer bar carrying the readiness text, Cancel, and
      Run. The pane stacks Overview, Thresholds, LoFreq Settings, Extra arguments, and
      Readiness. LoFreq Settings holds no controls, only the line "LoFreq is ready to
      run directly on the selected bundle alignment track." The command built is
      "lofreq call -f <reference> -o <output> <bam>". When Extra arguments contains
      --call-indels the pipeline first runs "lofreq indelqual --dindel" and "lofreq
      index" on a copy of the BAM. The result is sorted, bgzipped, and tabix-indexed,
      and a SQLite variant database is written beside it.

  variants.call-ivar:
    title: Call Variants (iVar)
    entry_points:
      - "Tools > Call Variants..."
      - "Inspector > Analysis > Variant Calling > Call Variants..."
      - "CLI: lungfish-cli variants call --bundle <bundle> --alignment-track <track> --caller ivar --ivar-primer-trimmed"
    gating: [variant-calling]
    sources:
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingCatalog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingToolPanes.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishWorkflow/Variants/ViralVariantCallingPipeline.swift
      - Sources/LungfishWorkflow/Variants/IVarCodonMerger.swift
      - Sources/LungfishWorkflow/Variants/IVarTSVToVCFConverter.swift
      - Sources/LungfishApp/Services/CLIVariantCallingRunner.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings:
      - label: Alignment Track
        control: popup
        default: the first analysis-ready BAM alignment track in the bundle
        allowed: any analysis-ready BAM alignment track in the bundle
        effect: Chooses which alignment iVar reads. Picking a different track also re-reads the primer-trim record filed beside that track's BAM.
        when_to_change: Change it whenever the bundle holds more than one alignment, and always point it at the primer-trimmed one.
        cli_flag: --alignment-track
      - label: Output Variant Track Name
        control: text
        default: the alignment name, then a bullet, then iVar
        allowed: any text, and the app appends a number when the name is already taken
        effect: Names the variant track the run creates. That name fills the table drawer's Source column.
        when_to_change: Change it when you want a shorter or more descriptive label than the generated one.
        cli_flag: --name
      - label: Minimum Allele Frequency
        control: text
        default: "0.05"
        allowed: a decimal between 0 and 1, or blank
        effect: Sets the smallest fraction of reads that must carry an alternate base before iVar reports it. It becomes iVar's -t value, so 0.05 means a base seen in five reads of every hundred is reported.
        when_to_change: Lower it to about 0.01 when you are hunting minority variants in a deeply sequenced amplicon, and raise it when you only want near-fixed changes.
        cli_flag: --min-af
      - label: Minimum Depth
        control: text
        default: "10"
        allowed: a whole number, or blank
        effect: Sets how many reads must cover a position before iVar will call there. It becomes iVar's -m value.
        when_to_change: Raise it when your coverage is deep and you want only well-supported calls.
        cli_flag: --min-depth
      - label: This BAM has already been primer-trimmed for iVar.
        control: checkbox
        default: off, or on and locked when a primer-trim record is found beside the BAM
        allowed: on or off
        effect: States that the primer bases have already been clipped out of this alignment. iVar assumes trimmed input, and the run stays blocked until this is set.
        when_to_change: Set it once you have run Primer-trim BAM, or when you trimmed the BAM outside the app. Never set it for an untrimmed amplicon BAM.
        cli_flag: --ivar-primer-trimmed
      - label: Consensus allele frequency
        control: number
        default: "0.75"
        allowed: a decimal between 0 and 1
        effect: Sets the frequency above which a variant counts as the consensus base. Two adjacent changes in the same codon are folded into one row when both clear this bar.
        when_to_change: Lower it when a real double change sits at an intermediate frequency and you want it merged anyway.
        cli_flag: --ivar-consensus-af
      - label: Merge AF distance
        control: number
        default: "0.25"
        allowed: a decimal between 0 and 1
        effect: Sets how close two adjacent frequencies must be before the changes are folded into one codon row. It is the second route to merging, for pairs that do not clear the consensus bar.
        when_to_change: Tighten it when unrelated neighbouring changes are being merged, and loosen it when a genuine pair is staying split.
        cli_flag: --ivar-merge-af-threshold
      - label: Minimum ALT quality
        control: number
        default: "20"
        allowed: a whole number of Phred quality units, zero or greater
        effect: Marks a call with the bq filter when the average quality of the alternate bases falls below this. A Phred score of 20 means the machine expects one wrong base in a hundred.
        when_to_change: Raise it when the run's base qualities were high and you want low-quality calls flagged.
        cli_flag: --ivar-bad-quality-threshold
      - label: Ignore strand bias (recommended for amplicons)
        control: checkbox
        default: "true"
        allowed: on or off
        effect: Skips the check that a variant appears on both DNA strands in similar numbers. Amplicon libraries are lopsided by design, so that check flags real variants as artifacts.
        when_to_change: Turn it off only for shotgun or metagenomic libraries, where strand imbalance really is a warning sign.
        cli_flag: --ivar-no-ignore-strand-bias
      - label: Extra arguments
        control: text
        default: empty
        allowed: any iVar flags, written exactly as iVar expects them
        effect: Inserts your own text into the ivar variants command line, right after the word variants and ahead of the flags the app builds.
        when_to_change: Use it for an iVar option the dialog does not expose.
        cli_flag: --extra-args
    cli_only:
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
      - flag: -t, --threads
        default: auto
        effect: Sets how many threads the run may use, where the GUI always takes the machine's processor count.
    notes: >-
      The detail pane stacks Overview, Thresholds, iVar Settings, iVar Options, Extra
      arguments, and Readiness. Only iVar shows the iVar Options section and the
      primer-trim toggle. When the app finds its own primer-trim record beside the BAM,
      the toggle is checked and greyed out and a caption below it reads "Primer-trimmed
      by Lungfish on <date> using <scheme>". Behind the dialog the pipeline exports the
      bundle's annotations to ivar-annotations.gff3 and runs "samtools mpileup -aa -A
      -d 600000 -B -Q 20 -q 0 -f <ref> <bam>" piped into "ivar variants". The GFF3 is
      what lets adjacent within-codon changes merge into one row. The converter writes
      TYPE as the only INFO key, leaves QUAL as a literal dot, and can emit the FILTER
      codes PASS, ft, bq, and sb. Depth and frequency live in the per-sample fields DP
      and ALT_FREQ, with MERGED_AF and MERGED_DP added on a merged row. A second
      all-haplotypes VCF is written beside the primary one. The strand-bias checkbox is
      inverted on the command line, since the flag turns the filter on rather than off.

  variants.call-medaka:
    title: Call Variants (Medaka)
    entry_points:
      - "Tools > Call Variants..."
      - "Inspector > Analysis > Variant Calling > Call Variants..."
      - "CLI: lungfish-cli variants call --bundle <bundle> --alignment-track <track> --caller medaka --medaka-model <model>"
    gating: [variant-calling]
    sources:
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingCatalog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingToolPanes.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishWorkflow/Variants/ViralVariantCallingPipeline.swift
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings:
      - label: Alignment Track
        control: popup
        default: the first analysis-ready BAM alignment track in the bundle
        allowed: any analysis-ready BAM alignment track in the bundle
        effect: Chooses which alignment the run reads. Medaka works from reads rather than a pileup, so the app rebuilds a FASTQ from this alignment first.
        when_to_change: Change it whenever the bundle holds more than one alignment.
        cli_flag: --alignment-track
      - label: Output Variant Track Name
        control: text
        default: the alignment name, then a bullet, then Medaka
        allowed: any text, and the app appends a number when the name is already taken
        effect: Names the variant track the run creates. That name fills the table drawer's Source column.
        when_to_change: Change it when you want a shorter or more descriptive label than the generated one.
        cli_flag: --name
      - label: Minimum Allele Frequency
        control: text
        default: "0.05"
        allowed: a decimal between 0 and 1, or blank
        effect: Removes calls whose allele frequency is below this value after Medaka finishes, using a bcftools view filter. The filter is skipped, and the skip recorded in provenance, when the VCF carries no allele-frequency tag.
        when_to_change: Raise it to drop low-frequency calls from the track. The window sends 0.05 by default.
        cli_flag: --min-af
      - label: Minimum Depth
        control: text
        default: "10"
        allowed: a whole number, or blank
        effect: Removes calls with fewer reads than this after Medaka finishes, using a bcftools view filter. The filter is skipped, and the skip recorded in provenance, when the VCF carries no depth tag.
        when_to_change: Raise it to drop calls at thinly covered positions. The window sends 10 by default.
        cli_flag: --min-depth
      - label: Medaka Model
        control: text
        default: empty, with the placeholder r1041_e82_400bps_sup_v5.0.0
        allowed: any Medaka model identifier
        effect: Names the trained model Medaka scores the reads against. The model has to match the pore chemistry and the basecaller version the run used, because the error pattern it corrects for is specific to both.
        when_to_change: Always, since the field starts empty and Run stays disabled until you fill it. Read the value off your sequencing run's basecaller report.
        cli_flag: --medaka-model
      - label: Extra arguments
        control: text
        default: empty
        allowed: any Medaka flags, written exactly as Medaka expects them
        effect: Inserts your own text into the medaka variant command line, right after the word variant. This is the only route to any Medaka setting beyond the model.
        when_to_change: Use it when you need a Medaka option the dialog does not expose.
        cli_flag: --extra-args
    cli_only:
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
      - flag: -t, --threads
        default: auto
        effect: Sets how many threads the run may use, where the GUI always takes the machine's processor count.
    notes: >-
      The Medaka Settings section holds only the model field. Medaka and Clair3 write to
      the same stored setting, so a model typed for one is still there when you switch
      to the other, even though the labels differ. Before Medaka runs, the pipeline
      rebuilds a FASTQ from the alignment with "samtools fastq -F 2304", which drops the
      secondary and supplementary placements. The command built is "medaka variant -i
      <fastq> -r <reference> -o <output> -m <model> -t <threads>". Medaka is given no
      annotations, so it never merges adjacent within-codon changes the way iVar does.
      The primer-trim record is read only for iVar, so a Medaka run receives no signal
      that the alignment was trimmed.

  variants.call-bcftools:
    title: Call Variants (bcftools)
    entry_points:
      - "Tools > Call Variants..."
      - "Inspector > Analysis > Variant Calling > Call Variants..."
      - "CLI: lungfish-cli variants call --bundle <bundle> --alignment-track <track> --caller bcftools"
    gating: []
    sources:
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingCatalog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingToolPanes.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishWorkflow/Variants/ViralVariantCallingPipeline.swift
      - Sources/LungfishWorkflow/Resources/ManagedTools/third-party-tools-lock.json
      - docs/user-manual/reviews/fidelity-2026-09/cli-help/variants.txt
    settings:
      - label: Alignment Track
        control: popup
        default: the first analysis-ready BAM alignment track in the bundle
        allowed: any analysis-ready BAM alignment track in the bundle
        effect: Chooses which alignment bcftools reads its pileup from.
        when_to_change: Change it whenever the bundle holds more than one alignment.
        cli_flag: --alignment-track
      - label: Output Variant Track Name
        control: text
        default: the alignment name, then a bullet, then bcftools
        allowed: any text, and the app appends a number when the name is already taken
        effect: Names the variant track the run creates. That name fills the table drawer's Source column.
        when_to_change: Change it when you want a shorter or more descriptive label than the generated one.
        cli_flag: --name
      - label: Minimum Allele Frequency
        control: text
        default: "0.05"
        allowed: a decimal between 0 and 1, or blank
        effect: Removes calls whose allele frequency is below this value after bcftools finishes, using a bcftools view filter. The filter is skipped, and the skip recorded in provenance, when the VCF carries no allele-frequency tag.
        when_to_change: Raise it to drop low-frequency calls from the track. The window sends 0.05 by default.
        cli_flag: --min-af
      - label: Minimum Depth
        control: text
        default: "10"
        allowed: a whole number, or blank
        effect: Removes calls with fewer reads than this after bcftools finishes, using a bcftools view filter. The filter is skipped, and the skip recorded in provenance, when the VCF carries no depth tag.
        when_to_change: Raise it to drop calls at thinly covered positions. The window sends 10 by default.
        cli_flag: --min-depth
      - label: Ploidy
        control: segmented (Haploid, Diploid)
        default: derived from the bundle's organism metadata, and Haploid when nothing identifies the organism
        allowed: Haploid or Diploid
        effect: Passes --ploidy 1 or --ploidy 2 to bcftools call, which decides whether heterozygous genotypes such as 0/1 can be written. The caption under the control names the evidence the default came from, and the value used is recorded in provenance.
        when_to_change: Choose Diploid for a human, macaque, or other eukaryotic reference whose bundle the app could not identify, such as a FASTA slice with no organism recorded. Choose Haploid for a virus or bacterium the app took for something else.
        cli_flag: --ploidy
      - label: Extra arguments
        control: text
        default: empty
        allowed: any bcftools call flags except --ploidy, written exactly as bcftools expects them
        effect: Inserts your own text into the bcftools call command line, right after the word call and ahead of the flags the app builds. A --ploidy typed here is refused with a message pointing at the Ploidy control.
        when_to_change: Use it for a bcftools call setting the dialog does not expose, such as a prior with -P.
        cli_flag: --extra-args
    cli_only:
      - flag: --format
        default: text
        effect: Prints the run summary as plain text, JSON, or a tab-separated table.
      - flag: -t, --threads
        default: auto
        effect: Sets how many threads the run may use, where the GUI always takes the machine's processor count.
    notes: >-
      bcftools is the one caller in this dialog gated on the lungfish-tools pack, the
      Required Setup pack, rather than on the Variant Calling pack, so it is usually
      installed already and the gating list above is left empty to say so. Its
      section reads "bcftools will run mpileup and call as an orthogonal
      cross-check on the selected BAM." followed by the Ploidy control. The pipeline
      runs "bcftools mpileup -Ou -A -d 0 -a FORMAT/AD,FORMAT/DP,INFO/AD -f <reference>
      <bam>" piped into "bcftools call --ploidy <1 or 2> -mv -Ov -o <output>". That
      pileup has no depth cap and no base-quality floor, where the iVar pileup sets
      both, which is one reason the two callers disagree on the same alignment. On the
      HG002 chr20 fixture the derived default is Diploid, and a window run writes 1,040
      rows (measured 2026-09-24).

