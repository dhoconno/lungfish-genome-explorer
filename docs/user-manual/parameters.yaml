  variants.call-gatk-haplotypecaller:
    title: Call Variants (GATK HaplotypeCaller)
    entry_points:
      - "Tools > Call Variants..."
      - "Inspector > Analysis > Variant Calling > Call Variants..."
      - "CLI: lungfish-cli gatk haplotype-caller --reference <fasta> --bam <bam> --output <vcf>"
