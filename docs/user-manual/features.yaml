      - Sources/LungfishApp/Views/Inspector/Sections/MSAPairwiseDistanceSection.swift
      - Sources/LungfishIO/Bundles/MSADistanceMatrix.swift
      - Sources/LungfishIO/Bundles/MSADistanceModels.swift
      - Sources/LungfishIO/Bundles/MSADistanceClustering.swift
      - Sources/LungfishCLI/Commands/MSADistanceSubcommand.swift
    module: [LungfishAlignmentUI, LungfishApp, LungfishIO, LungfishCLI]
    cli:
      - lungfish-cli msa distance
    operation_type: multipleSequenceAlignmentAction
    tests:
      - Tests/LungfishAlignmentUITests/MSADistanceMatrixPaneTests.swift
      - Tests/LungfishAlignmentUITests/MSADistanceMatrixGridViewTests.swift
      - Tests/LungfishAlignmentUITests/MSADistanceMatrixSelectionTests.swift
      - Tests/LungfishAlignmentUITests/MSADistanceColorScaleTests.swift
      - Tests/LungfishAppTests/MSABottomPaneTests.swift
      - Tests/LungfishAppTests/MSADistanceMatrixGUICLIParityTests.swift
      - Tests/LungfishAppTests/MSADistanceMatrixMenuRoutingTests.swift
      - Tests/LungfishIOTests/MultipleSequenceAlignmentDistanceMatrixTests.swift
      - Tests/LungfishCLITests/MSACommandTests.swift
    notes: >-
      A tabbed pane under the MSA viewport, [Annotations | Distances]. View >
      Show Distance Matrix (Control-Command-M) and the MSA toolbar's Distance
      matrix button open the Distances tab, and View > Show Drawer
      (Control-Command-B) opens the pane on its last tab. The Distances tab
      draws a full square matrix (diagonal computed, neutral fill) with Model
      (Identity, p-distance, Jukes-Cantor (JC69), Kimura 2-parameter (K2P) for
      nucleotides, Identity, p-distance, Poisson for protein, from the
      manifest alphabet), Gaps (Pairwise deletion, Complete deletion), Order
      (Alignment order, Average linkage (UPGMA)), Fixed 0-1, Show Values,
      Copy Matrix and Export.... Gaps and ambiguity codes are missing data.
      Cells show n/a for no comparable sites and an infinity sign for
      saturated pairs (nan and inf in TSV). Selecting cells selects the
      union of their rows in the alignment, Return or double-click reveals
      the pair, Space toggles a cell, Command-C copies the selected block
      with names, and VoiceOver reads row, column, value and sites compared.
      Alignments over 200 rows show a message and export the full matrix.
      Options persist globally. The Inspector Bundle tab keeps a Pairwise
      Distance section with Show Distance Matrix and the focused pair's
      counts. Copy Matrix and Export match msa distance byte for byte.
      Chapter: 02-sequences/04.
  msa.inspection.discriminating-sites:
    title: Find discriminating sites in an alignment
    entry_points:
      - "Inspector > Discriminating Sites > Find Discriminating Sites"
      - "CLI: lungfish msa discriminating-sites"
    inputs: [lungfishmsa, lungfishref, fasta]
    outputs: [tsv, json]
    viewport_class: sequence
    sources:
      - Sources/LungfishApp/Views/Inspector/Sections/MultipleSequenceAlignmentDocumentSection.swift
      - Sources/LungfishApp/Views/Inspector/Sections/MSADiscriminatingSitesSection.swift
      - Sources/LungfishApp/Views/Inspector/Sections/MSADiscriminatingSitesInspectorModel.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+MSADiscriminatingSites.swift
      - Sources/LungfishOperations/MSADiscriminatingSitesRequest.swift
      - Sources/LungfishWorkflow/MSA/DiscriminatingSitesAnalysis.swift
      - Sources/LungfishWorkflow/MSA/DiscriminatingSitesExclusionAligner.swift
      - Sources/LungfishWorkflow/MSA/DiscriminatingSitesReportFormatter.swift
      - Sources/LungfishCLI/Commands/MSADiscriminatingSitesSubcommand.swift
    module: [LungfishApp, LungfishOperations, LungfishWorkflow, LungfishCLI]
    cli:
      - lungfish-cli msa discriminating-sites
    operation_type: multipleSequenceAlignmentAction
    tests:
      - Tests/LungfishAppTests/MSADiscriminatingSitesInspectorTests.swift
      - Tests/LungfishCLITests/MSADiscriminatingSitesCommandTests.swift
      - Tests/LungfishWorkflowTests/MSA/DiscriminatingSitesAnalysisTests.swift
    notes: >-
      Finds alignment columns where every target row differs from every
      exclusion sequence, with gaps and IUPAC codes counted as no-call.
      Exclusions come from rows in the alignment or from sequences in a file
      or bundle ("Choose..." / "Choose File..."), and each row gets a role of
      Target, Exclusion, or Skip. Controls include Template ("First target"),
      Target mismatch tolerance (0), Window length (bp) (25), and Exclusions
      that must differ (blank = All). Results are a site table and a
      Candidate windows table with Copy TSV, Export TSV..., and Export
      JSON..., and "Highlight in viewport" marks the columns and labels the
      gutter "Target · name" / "Exclusion · name". With file-based
      exclusions the viewport draws only the alignment's rows and names the
      exclusions in the toolbar legend. Chapter: 10-primer-design/04.
  tree.infer:
    title: Infer phylogenetic trees
    entry_points:
      - "Tools > Alignment & Phylogenetics > Build Tree with IQ-TREE…"
      - "Right-click in the alignment viewport > Build Tree with IQ-TREE…"
      - "MSA alignment matrix or row gutter > accessibility action Build Tree with IQ-TREE…"
      - "CLI: lungfish tree infer iqtree"
      - "CLI: lungfish msa tree"
    inputs: [lungfishmsa, newick]
    outputs: [lungfishtree]
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/MainMenu+TreeNode.swift
      - Sources/LungfishApp/App/AppDelegate+TreeInference.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+TreeInference.swift
