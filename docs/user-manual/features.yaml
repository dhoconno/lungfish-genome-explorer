    operation_type: ingestion
    tests:
      - Tests/LungfishAppTests/RNASeqPlanSheetTests.swift
      - Tests/LungfishAppTests/CLIRunnerArgvRoundTripTests.swift
      - Tests/LungfishAppTests/CLIImportRunnerTests.swift
      - Tests/LungfishAppTests/FASTQLinuxRunOperationTests.swift
      - Tests/LungfishAppTests/FastqIngestCancelReplayTests.swift
    notes: >-
      One card on the Sequencing Reads tab of the Import Center. It asks for
      a returned plan folder or a returned batch folder, in which the files
      inside result/ of every sample were copied into that sample's folder
      on the Mac, next to plan.json, and then opens a sheet for the name of
      the result, the storage root and the check. The sheet runs
      lungfish-cli import rnaseq <folder> --adopt with --format json, and its
      Check button adds --dry-run, which runs every check and reads and
      writes nothing. The folder is checked in full before anything is
      written, so a refused adopt writes nothing, and the refusal shows in
      the command's own words, on the Operations row and in the sheet. A
      folder that the introns preset returned is refused. The adopted result
      is selected in the sidebar. The card needs an open project that can be
      written.
