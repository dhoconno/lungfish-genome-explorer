    notes: >-
      File > Export > Image (PNG)… and Image (PDF)… run lungfish-cli bundle
      export-graphic when the viewer shows a genome bundle, and the row of the
      export in the Operations Panel records that command, so Copy CLI Command
      copies it. The image shows the region the viewer shows and draws the
      bundle's sequence, annotation, variant and read tracks from the bundle's
      files, but it is not a copy of the screen. A PDF image of a bundle holds
      no creation or modification date, so running its command again on the
      same Mac and macOS build writes the same file. If a PDF keeps those
      dates, its record says so. The Export Successful alert no longer
      appears, and the finished row names the file. When the viewer shows
      anything else, such as a classifier result, an alignment, a tree or a
      PDF, the export still captures the whole pane as before, with the one
      scope Full Viewer Pane, and records no command. A document that is not a
      bundle also keeps Tracks and Selected Region as captures.
