    viewport_class: none
    sources:
      - Sources/LungfishWorkflow/Demultiplex/DemultiplexingPipeline.swift
      - Sources/LungfishWorkflow/Demultiplex/DemultiplexFragmentCall.swift
      - Sources/LungfishWorkflow/Demultiplex/DemultiplexingPipeline+MateAssignment.swift
      - Sources/LungfishWorkflow/Demultiplex/DemultiplexingPipeline+Staging.swift
      - Sources/LungfishWorkflow/Demultiplex/DemultiplexingPipeline+Preflight.swift
