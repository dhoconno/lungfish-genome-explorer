  # --- Classification and metagenomics (taxonomy viewport) ---
  classify.kraken2:
    title: Kraken2 and Bracken classification
    entry_points:
      - "Tools > Classification…"
      - "CLI: lungfish-cli kraken2 classify"
    inputs: [fastq, fasta, kraken2-database]
    outputs: [kraken2-kreport, taxonomy-dataset]
    viewport_class: taxonomy
    sources:
      - Sources/LungfishApp/Views/Metagenomics/ClassificationWizardSheet.swift
      - Sources/LungfishApp/Views/Metagenomics/TaxonomyViewController.swift
      - Sources/LungfishApp/App/AppDelegate+ClassificationCLIRoute.swift
      - Sources/LungfishApp/App/AppDelegate+ClassifierLaunchRouting.swift
      - Sources/LungfishApp/Services/CLIClassifierRunner.swift
      - Sources/LungfishCLI/Commands/ClassifyCommand.swift
      - Sources/LungfishWorkflow/Metagenomics/KrakenReadSetPlanner.swift
      - Sources/LungfishWorkflow/Metagenomics/ClassificationPipeline+InputCopies.swift
      - Sources/LungfishApp/Views/Sidebar/SidebarViewController+OutlineDelegate.swift
      - Sources/LungfishCore/Process/DurableGzip.swift
      - Sources/LungfishIO/Formats/Kraken/KrakenOutputCompactor.swift
      - Sources/LungfishWorkflow/Metagenomics/ClassificationPipeline+KrakenOutputCompaction.swift
    module: [LungfishApp, LungfishCLI, LungfishWorkflow, LungfishCore, LungfishIO]
    cli:
      - lungfish-cli kraken2 classify
      - lungfish-cli conda classify
    operation_type: classification
    provenance: one root record written by AnalysisRunExecutor, named lungfish.classify, over the step records of ClassificationPipeline
    tests:
      - Tests/LungfishWorkflowTests/Metagenomics/ClassificationPipelineTests.swift
      - Tests/LungfishCLITests/ClassificationCLIInvocationRoundTripTests.swift
      - Tests/LungfishWorkflowTests/Metagenomics/KrakenWrapperEdgeTests.swift
      - Tests/LungfishAppTests/ClassifierCLIRouteRowTests.swift
      - Tests/LungfishAppTests/ClassifierLaunchRouteTests.swift
      - Tests/LungfishAppTests/ClassifierNoProjectRefusalTests.swift
      - Tests/LungfishAppTests/ClassifierCLIGUIParityReplayTests.swift
      - Tests/LungfishCLITests/Kraken2DemuxGroupRefusalTests.swift
      - Tests/LungfishAppTests/ClassifierCLIRouteSidebarTests.swift
      - Tests/LungfishAppTests/PrimerTrimInspectorAfterRevealTests.swift
      - Tests/LungfishAppTests/RevealTestSupport.swift
    notes: >-
      Runs Kraken2 taxonomic classification with Bracken abundance estimation on
      FASTQ or FASTA inputs and opens the results in the taxonomy browser. A
      sample with separate R1 and R2 reads runs them with --paired and its
      merged or single reads beside them in one kraken2 run, and such a result
      counts fragments (the Fragments and Read Pairing cards). Inputs may mix
      gzip and plain files, and a file in the other compression than the first
      is read from a staged copy recorded as Lungfish Classification Input
      Compression Staging. Since 2.7 (E11) the wizard's rows and the run
      records name `kraken2 classify`, and a command recorded as
      `conda classify` still parses and replays. Since 2.7 (E10) the Tools menu
      launch runs `lungfish-cli kraken2 classify` with --project and --format
      json, and --batch for several samples, and shows the command's events in
      a row with the title, labels and end of run the in-process route had.
      That route and its hidden keys went in 2.9 (E14), so every launch takes
      this one. A launch with no project open shows the No Project Open sheet
      and runs nothing (L1).
      kraken2 classify and conda classify refuse a demultiplexed group
      bundle with exit 3 before they look at the database. A run of one
      sample into a project reads Completed with Warnings when its viewer
      index fails, as a batch does.
      A finished single run selects the result's row and points the
      Inspector at it. The Summary's Operation Details describe the result
      the viewport shows, which is the first sample after a batch run. A
      batch run leaves the sidebar selection where it was. Kraken2 per-read
      output is kept as a gzip copy written through a part file and named
      only when whole.
  classify.esviritu:
    title: EsViritu viral detection
    entry_points:
      - "Tools > Classification…"
      - "CLI: lungfish esviritu"
    inputs: [fastq, esviritu-database]
    outputs: [esviritu-report, taxonomy-dataset]
