      arguments that the merge process started with.
  export.sequences:
    title: Export sequences from a bundle
    entry_points:
      - "Export Sequences… on a bundle in the sidebar"
      - "CLI: lungfish convert"
    inputs: [bundle]
    outputs: [fasta, genbank]
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/AppDelegate+ImportCenterSequenceExport.swift
      - Sources/LungfishApp/Services/SequenceExportRoute.swift
      - Sources/LungfishApp/Services/SequenceExportStaging.swift
      - Sources/LungfishWorkflow/Native/SequenceExportCompressor.swift
      - Sources/LungfishCLI/Commands/ConvertCommand.swift
      - Sources/LungfishIO/Formats/GenBank/GenBankFeatureLine.swift
    module: [LungfishApp, LungfishCLI, LungfishWorkflow, LungfishIO]
    cli:
      - lungfish-cli convert
    tests:
      - Tests/LungfishAppTests/AppDelegateImportCenterOperationTests.swift
      - Tests/LungfishAppTests/SequenceExportRouteTests.swift
      - Tests/LungfishAppTests/SequenceExportStagingDurabilityTests.swift
      - Tests/LungfishCLITests/ConvertCompressTests.swift
      - Tests/LungfishCLITests/ConvertEmptyInputTests.swift
      - Tests/LungfishIOTests/GenBankFeatureLineTests.swift
      - Tests/LungfishWorkflowTests/SequenceExportCompressorTests.swift
    notes: >-
      lungfish-cli convert takes several input files and writes them to one
      output, and --compress gzip or --compress zstd writes the output
      compressed. Every selection exports by running it, so the Operations
      row shows the command to copy, including the compressor. An open
      document or a project sequence is saved first as a copy in the
      project's .tmp folder, or in the system temporary folder when no
      project is in reach, and a file Lungfish cannot read by name (.seq or
      .txt) is copied there as FASTA. convert runs on the copy, and the
      export's record names it. A GenBank file that Lungfish writes holds
      no /_lf_raw_feature_type or /_lf_raw_genbank_location qualifier. A
      GenBank file that Lungfish writes keeps each feature's key and location
      as the source GenBank file had them, for example CDS, the partial
      markers < and > and order(), while the feature's type, ranges and strand
      are unchanged. A feature that was edited, one that did not come from a
      GenBank file and one of a .lungfishref bundle prints its key in lower
      case and a location rebuilt from its ranges. convert refuses an input of
      no bytes or only white space with No sequences found in <file> and
      writes nothing. A zstd export runs the zstd that Lungfish manages and
      installs with its Required Setup, and it does not look in Homebrew or on
      the PATH. When that zstd is not installed, the export stops with a
      message that points at the Required Setup. gzip works on every Mac.
