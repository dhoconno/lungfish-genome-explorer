      - Sources/LungfishCLI/Commands/TreeInferIQTreeStaging.swift
      - Sources/LungfishCLI/Commands/TreeInferIQTreeInference.swift
      - Sources/LungfishIO/Bundles/IQTreeOptionRules.swift
      - Sources/LungfishIO/Bundles/IQTreeReportParser.swift
      - Sources/LungfishIO/Bundles/PhylogeneticTreeInferenceSummary.swift
      - Sources/LungfishCLI/Commands/MSACommand.swift
      - Sources/LungfishCLI/Commands/ImportMSATreeSubcommands.swift
    module: [LungfishApp, LungfishCLI, LungfishIO]
    cli:
      - lungfish-cli tree infer iqtree
    operation_type: phylogeneticTreeInference
    tests:
      - Tests/LungfishAppTests/IQTreeInferenceDialogStateTests.swift
      - Tests/LungfishAppTests/IQTreeInferenceOptionsDialogTests.swift
      - Tests/LungfishAppTests/IQTreeInferenceReplayTests.swift
      - Tests/LungfishAppTests/TreeInferenceResolverTests.swift
      - Tests/LungfishAppViewTests/TreeInferenceMenuTests.swift
      - Tests/LungfishCLITests/TreeInferIQTreeImportTests.swift
      - Tests/LungfishCLITests/TreeInferIQTreeOptionRulesTests.swift
      - Tests/LungfishCLITests/TreeInferIQTreeTipMapTests.swift
      - Tests/LungfishCLITests/TreeInferIQTreeValidationTests.swift
    notes: >-
      Infers a maximum-likelihood tree from a .lungfishmsa bundle with IQ-TREE
      3 or imports an existing Newick tree as a .lungfishtree bundle. The
      Tools item acts on the alignment shown in the viewport, else on exactly
      one alignment selected in the sidebar, and is disabled with the tooltip
      "Open or select an alignment to build a tree." otherwise. The Build Tree
      with IQ-TREE dialog has Inputs (Build from Whole alignment or Selected
      rows and columns), Model (Find best model (ModelFinder), fixed models
      for the alphabet, Custom…, Sequence type, Genetic code for Codon),
      Branch Support (UFBoot and SH-aLRT both on at 1000), Rooting (outgroup
      checkboxes), Output (Name), Run (Seed blank = drawn and recorded,
      Threads 1) and a collapsed Advanced group. Tip labels are the MSA
      display names (staged as t0001... and mapped back through
      artifacts/iqtree/tip-map.tsv). An outgroup run saves a rooted tree. The
      manifest records supportLabels, branchLengthUnit and an inference
      summary the Inspector shows as its Inference section. Chapter:
      02-sequences/05.
      A cancel (SIGTERM) records the run as cancelled and exits 125.
  viewport.phylogenetic-tree:
    title: Phylogenetic tree viewport
    entry_points:
      - "Open a tree bundle from the sidebar"
      - "Selection > Tree Node > Show in Inspector"
      - "Selection > Tree Node > Root on Selected Branch"
      - "Selection > Tree Node > Extract Subtree as New Bundle…"
      - "Selection > Tree Node > Export Subtree…"
      - "Inspector > Inference"
    inputs: [lungfishtree]
    outputs: [newick]
    viewport_class: none
    sources:
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeViewController.swift
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeViewController+SupportColumns.swift
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeCanvasView.swift
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeSupportPresentation.swift
      - Sources/LungfishPhylogeneticsUI/PhylogeneticTreeSelectionState.swift
      - Sources/LungfishApp/App/MainMenu+TreeNode.swift
      - Sources/LungfishApp/Views/Inspector/Sections/PhylogeneticTreeInferenceSection.swift
    module: [LungfishPhylogeneticsUI, LungfishApp]
    tests:
      - Tests/LungfishPhylogeneticsUITests/PhylogeneticTreeSupportPresentationTests.swift
      - Tests/LungfishPhylogeneticsUITests/PhylogeneticTreeNodeMenuBarTests.swift
      - Tests/LungfishAppTests/PhylogeneticTreeInferenceSectionTests.swift
    notes: >-
      Renders a native .lungfishtree bundle with a canvas, node table, layout and
      color modes, search, and a node detail pane. With recorded support labels
      the node table has one column per test (SH-aLRT, UFBoot, aBayes), the
      canvas shows the pair as IQ-TREE wrote it (99/100), Support colouring
      uses UFBoot with a legend, and the summary reads Rooted or Unrooted
      (drawn root is arbitrary). Selection > Tree Node holds the ten node
      commands of the context menu, enabled while the node table or canvas has
      focus and a node is selected. Canvas nodes are AX buttons with the same
      commands as custom actions. This viewport is not one of the five genomic
      viewport classes. Chapter: 02-sequences/05.
  tree.transform:
    title: Transform phylogenetic trees
    entry_points:
      - "CLI: lungfish tree extract-subtree"
      - "CLI: lungfish tree reroot"
    inputs: [lungfishtree]
    outputs: [lungfishtree, newick]
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/TreeCommand.swift
      - Sources/LungfishCLI/Commands/TreeCommandTransform.swift
    module: [LungfishCLI]
    notes: >-
      Roots a tree on the branch above a chosen node (outgroup rooting, as
      the viewport's Root on Selected Branch does), extracts a selected clade
      as a subtree named from its tip labels, and relabels tips from bundle
      metadata, writing new bundles with provenance. Chapter: 02-sequences/05.
      A cancel (SIGTERM) of reroot, extract-subtree or relabel records the
      run as cancelled and exits 125.

