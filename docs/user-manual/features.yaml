      - Sources/LungfishCLI/Commands/ProvenanceCommand.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceRecorder.swift
    notes: >-
      Exports a methods section, full provenance JSON, or citation bibliography
      from a bundle and verifies signed provenance sidecars.
  project.manage:
    title: Manage projects and shared locks
    entry_points:
      - "File > Open Project Folder"
      - "CLI: lungfish project"
    inputs: [lungfish-project]
    outputs: [project-lock, bundle-migration]
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/ProjectOpenCoordinator.swift
      - Sources/LungfishApp/App/ProjectLockWarningPresentation.swift
      - Sources/LungfishCLI/Commands/ProjectCommand.swift
    notes: >-
      Opens project folders, creates and removes project-local lock records, and
      migrates bundles for shared multi-user projects.
  tools.provision:
    title: Provision managed tools
    entry_points:
      - "CLI: lungfish provision-tools"
      - "CLI: lungfish conda install"
    inputs: [tool-catalog]
    outputs: [conda-environment, managed-tool]
    viewport_class: none
    sources:
