  view.layout:
    title: Window panes, drawer, zoom and text size
    entry_points:
      - "View > Show Sidebar"
      - "View > Show Inspector"
      - "View > Focus Viewer"
      - "View > Restore Side Panes"
      - "View > Document Inspector"
      - "View > Show Drawer"
      - "View > Make Drawer Taller"
      - "View > Content Text Size > Larger"
      - "View > Zoom In"
      - "View > Zoom to Fit"
      - "View > Expand All"
      - "View > Show as RNA (U instead of T)"
      - "View > Show Annotations for Selected Track"
      - "View > Reset View"
    inputs: []
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishApp/App/AppDelegate+MenuActions.swift
    module: [LungfishApp]
    notes: >-
      Shows or hides the sidebar, Inspector and bottom drawer, changes the
      drawer height and the text size of viewer content, and zooms the
      viewer (Zoom Reset shows 10 kb). Show as RNA draws U for T. View >
      Reset View returns the view on show to its start, and it is dimmed when
      nothing differs from the start. The Reset to Defaults button under
      Sequence Style (Inspector, View tab, Annotations) no longer resets the
      annotation height, spacing, visibility and filters; Reset View does that
      for the view on show. An item opens on its own Inspector tab, not on the
      last tab used, and the Inspector keeps each item's tab, its Samples &
      Metadata disclosure and its Alignment, Annotations or Reads choice on the
      View tab (VS-INSP, Preview 2026.11.18).
  window.set-size:
    title: Set the window size
    entry_points:
      - "Move & Resize (in the Window menu) > Set Size…"
    inputs: []
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/WindowSizeDialogController.swift
      - Sources/LungfishApp/App/WindowSizeRequest.swift
      - Sources/LungfishApp/App/AppDelegate.swift
    module: [LungfishApp]
    notes: >-
      Opens a sheet that sets the main window to an exact width and height
      in points, which keeps screenshots the same size. LGE adds the item at
      run time to the Move & Resize submenu that macOS puts in the Window
      menu, so the menu bar a test builds has no such path.
  project.storage:
    title: Review project storage and move removable items to the Trash
    entry_points:
      - "File > Manage Project Storage…"
      - "Sidebar context menu > Manage Project Storage…"
    inputs: [lungfish-project]
    outputs: [cleanup-receipt]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/ProjectStorage/ProjectStorageSheetViewController.swift
      - Sources/LungfishApp/Views/ProjectStorage/ProjectStorageSheetViewModel.swift
      - Sources/LungfishApp/App/AppDelegate.swift
      - Sources/LungfishApp/Views/Sidebar/SidebarItemAction.swift
    module: [LungfishApp]
    notes: >-
      Scans the project and lists its storage by category with logical size,
      estimated size on disk and date, and moves only entries proven
      removable to the Trash. It writes a cleanup receipt and offers Retry
      Failed, Retry Scan, Reveal Receipt and Reveal in Trash.
  storage.managed-roots:
    title: Managed storage location and duplicate space
    entry_points:
      - "Lungfish Genome Explorer > Settings… > Storage"
      - "CLI: lungfish storage info"
      - "CLI: lungfish storage dedupe"
    inputs: []
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/Settings/StorageSettingsTab.swift
      - Sources/LungfishCLI/Commands/StorageCommand.swift
    module: [LungfishApp, LungfishCLI]
    notes: >-
      The Storage tab shows where third-party tools and databases live and
      offers Change Location, Use Default Location, Remove old local copies
      and Reclaim Duplicate Space. storage dedupe replaces duplicate files
      across the storage roots of the release channels with APFS clones.
  sequence.navigate:
    title: Go to a location or a gene
    entry_points:
      - "Sequence > Go to Location…"
      - "Sequence > Go to Gene…"
    inputs: [lungfishref]
    outputs: []
    viewport_class: sequence
    sources:
      - Sources/LungfishApp/App/AppDelegate+SequenceMenu.swift
      - Sources/LungfishCore/Models/LocusQueryParser.swift
    module: [LungfishApp, LungfishCore]
    notes: >-
      Go to Location accepts a contig name, a position, contig:position or a
      range such as chr1:1,000-2,000 and centres a single position in the
      default window. Go to Gene searches the loaded annotations and needs a
      bundle with an annotation track.
  sequence.reverse-complement:
    title: Reverse-complement selected sequences
    entry_points:
      - "Sequence > Reverse Complement…"
      - "CLI: lungfish fastq reverse-complement"
    inputs: [sequence-selection, fasta]
    outputs: [fasta]
    viewport_class: sequence
    sources:
      - Sources/LungfishApp/App/AppDelegate+SequenceMenu.swift
      - Sources/LungfishApp/Views/Viewer/SequenceViewerView+Interaction.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController.swift
      - Sources/LungfishCLI/Commands/FastqReverseComplementSubcommand.swift
    module: [LungfishApp, LungfishCLI]
    notes: >-
      Opens the sequence operation dialog on the selected sequences with
      Reverse Complement All Sequences chosen.
  annotation.export-gff3:
    title: Export annotations as GFF3
    entry_points:
      - "File > Export > Annotations (GFF3)…"
      - "CLI: lungfish bundle export-gff3"
    inputs: [lungfishref, annotation-track]
    outputs: [gff3]
    viewport_class: sequence
    sources:
      - Sources/LungfishApp/App/AppDelegate+AnnotationGFF3ExportBegin.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenterSequenceExport.swift
      - Sources/LungfishCLI/Commands/BundleExportGFF3Subcommand.swift
    module: [LungfishApp, LungfishCLI]
    notes: >-
      Writes one annotation source of the open reference bundle as a GFF3
      file with a provenance record. The app runs lungfish-cli bundle
      export-gff3 behind an Operations row.
  export.fastq:
    title: Export FASTQ bundles as FASTQ files
    entry_points:
      - "File > Export > FASTQ…"
      - "Sidebar context menu > Export as FASTQ…"
      - "CLI: lungfish fastq export reads"
      - "CLI: lungfish fastq export sample-barcodes"
    inputs: [fastq-bundle]
    outputs: [fastq, sample-barcode-sheet]
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/AppDelegate+ImportExport.swift
      - Sources/LungfishApp/App/AppDelegate+FASTQExportOperationBegin.swift
      - Sources/LungfishApp/Views/Sidebar/SidebarViewController+MenuDelegate.swift
      - Sources/LungfishCLI/Commands/FastqExportSubcommand.swift
      - Sources/LungfishCLI/Commands/FastqExportReadsSubcommand.swift
      - Sources/LungfishCLI/Commands/FastqExportSampleBarcodesSubcommand.swift
    module: [LungfishApp, LungfishCLI]
    notes: >-
      Writes the reads of each selected FASTQ bundle as one FASTQ file with
      provenance, one Operations row per bundle, and a cancel stops the
      batch. fastq export sample-barcodes writes the sample barcode sheet of
      the FASTQ metadata drawer.
  import.fastq-linux-plan:
    title: Plan FASTQ import on a Linux machine and adopt its result
    entry_points:
      - "Import Center > Sequencing Reads > Plan for a Linux Machine"
      - "Import Center > Sequencing Reads > Linux Run Result"
      - "CLI: lungfish import fastq --write-plan"
      - "CLI: lungfish import fastq --adopt"
    inputs: [fastq, fastq.gz, plan-folder]
    outputs: [plan-folder, fastq-bundle]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel+ActionText.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQPlanSheet.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQPlanSheetModel.swift
      - Sources/LungfishApp/App/AppDelegate+LinuxRun.swift
      - Sources/LungfishApp/Services/FASTQIngestionService+LinuxRun.swift
    module: [LungfishApp]
    notes: >-
      Plan for a Linux Machine writes a plan folder that reorders, compresses
      and counts the reads on a Linux machine with HTCondor or a plain
      launcher, and imports nothing. Linux Run Result adopts the returned
      folder into the open project as one FASTQ bundle a sample with the
      run's record.
  fastq.ont-fluidigm-split:
    title: ONT Fluidigm sample split
    entry_points:
      - "Tools > Demultiplexing > ONT Fluidigm Sample Split…"
      - "CLI: lungfish fastq ont-fluidigm-samples"
    inputs: [fastq-bundle]
    outputs: [fastq-bundle]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationToolPanes.swift
      - Sources/LungfishCLI/Commands/FastqONTFluidigmSamplesSubcommand.swift
      - Sources/LungfishWorkflow/ONTGenotyping/ONTFluidigmSampleMaterializer.swift
      - Sources/LungfishWorkflow/ONTGenotyping/ONTFluidigmAmpliconMaterializer.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI]
    notes: >-
      Splits a bulk ONT Fluidigm amplicon bundle into one counted CS1-CS2
      insert FASTQ bundle per sample.
  cluster.reads:
    title: Cluster amplicon reads with Savont or pbAA
    entry_points:
      - "Tools > Clustering > Savont Clustering…"
      - "Tools > Clustering > pbAA Amplicon Clustering…"
      - "CLI: lungfish fastq savont-cluster"
      - "CLI: lungfish fastq pbaa-cluster"
    inputs: [fastq-bundle]
    outputs: [consensus-fasta, lungfishref]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationDialogState.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationsCatalog.swift
      - Sources/LungfishApp/Views/Inspector/Sections/FASTQPBAAArtifactsSection.swift
      - Sources/LungfishCLI/Commands/FastqSavontClusterSubcommand.swift
      - Sources/LungfishCLI/Commands/FastqPBAAClusterSubcommand.swift
    module: [LungfishApp, LungfishCLI]
    notes: >-
      Savont clusters FASTQ reads into counted consensus sequences, and pbAA
      clusters PacBio HiFi amplicon reads in pinned containers and writes the
      passed consensus sequences as a reference bundle. Savont needs the
      full-length MHC genotyping plugin pack.
  import.application-export:
    title: Import a Geneious or other application export
    entry_points:
      - "Import Center > Application Exports > Geneious Export"
      - "CLI: lungfish import geneious"
      - "CLI: lungfish import application-export"
    inputs: [geneious-archive, application-export-folder]
    outputs: [lungfishref, project-collection]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Services/CLIApplicationExportImportRunner.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenter.swift
      - Sources/LungfishCLI/Commands/ApplicationExportImportSubcommands.swift
      - Sources/LungfishWorkflow/ApplicationExports/ApplicationExportImportModels.swift
    module: [LungfishApp, LungfishCLI, LungfishWorkflow]
    notes: >-
      Turns a Geneious archive or export folder into one project collection
      of native reference and annotation bundles. import application-export
      takes the other kinds, such as CLC Workbench, DNASTAR Lasergene,
      Benchling, QIIME 2 and IGV session exports.
  import.primer-scheme:
    title: Import a primer scheme bundle
    entry_points:
      - "Import Center > Reference Sequences > Primer Scheme"
      - "CLI: lungfish primers import"
    inputs: [lungfishprimers, bed, fasta]
    outputs: [lungfishprimers]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/ImportCenter/PrimerSchemeImportView.swift
      - Sources/LungfishApp/Views/ImportCenter/PrimerSchemeImportViewModel.swift
      - Sources/LungfishApp/Views/Sidebar/PrimerSchemeInspectorView.swift
      - Sources/LungfishCLI/Commands/PrimerCommand.swift
    module: [LungfishApp, LungfishCLI]
    notes: >-
      Imports a .lungfishprimers bundle authored from a BED file and an
      optional FASTA, for use with iVar primer trimming of an alignment.
  workflow.library:
    title: Workflow Library
    entry_points:
      - "Tools > Workflows > Workflow Library…"
    inputs: [lungfishflowpkg]
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/WorkflowLibrary/WorkflowLibraryPanelView.swift
      - Sources/LungfishApp/Views/WorkflowLibrary/WorkflowLibraryViewModel.swift
      - Sources/LungfishApp/Views/WorkflowLibrary/WorkflowLibraryWindowController.swift
      - Sources/LungfishApp/Services/WorkflowLibrary.swift
      - Sources/LungfishApp/App/MainMenu+Tools.swift
      - Sources/LungfishApp/App/ToolsMenuModel.swift
    module: [LungfishApp]
    notes: >-
      Lists every tool and workflow in Core Tools, Specialized Workflows and
      User Workflows and turns each one on or off, and Link Workflow adds a
      workflow package that then gets its own item in Tools > Workflows. A
      tool that is not enabled reads Enable name… in its Tools submenu and
      offers to open the Workflow Library.
  sidebar.item-actions:
    title: Sidebar item commands
    entry_points:
      - "Sidebar context menu > Open"
      - "Sidebar context menu > New Folder…"
      - "Sidebar context menu > Rename…"
      - "Sidebar context menu > Duplicate"
      - "Sidebar context menu > Move to Trash"
      - "Sidebar context menu > Show in Finder"
      - "Sidebar context menu > Select Siblings"
      - "Sidebar context menu > Copy Classification Command"
      - "Selection > Sidebar Item"
    inputs: [sidebar-item]
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/Sidebar/SidebarItemAction.swift
      - Sources/LungfishApp/Views/Sidebar/SidebarViewController+ItemActions.swift
      - Sources/LungfishApp/Views/Sidebar/SidebarViewController+MenuDelegate.swift
      - Sources/LungfishApp/App/MainMenu.swift
    module: [LungfishApp]
    notes: >-
      The same commands appear in the sidebar's context menu and in the
      Selection > Sidebar Item submenu, and a multiple selection names the
      count, as in Move 3 Items to Trash. The bundle-specific items are listed
      in the rows of their features.
  results.table-row-commands:
    title: Result table row commands
    entry_points:
      - "Selection > Table Row > Open Row"
      - "Selection > Table Row > Copy Accession"
      - "Selection > Table Row > Copy Row as TSV"
      - "Selection > Table Row > Open on NCBI"
      - "Selection > Table Row > Search PubMed"
    inputs: [result-table-row]
    outputs: []
    viewport_class: taxonomy
    sources:
      - Sources/LungfishKit/Accessibility/ResultRowMenuActions.swift
      - Sources/LungfishApp/App/MainMenu.swift
    module: [LungfishKit, LungfishApp]
    notes: >-
      The row commands of the result tables, also in each table's context
      menu, include Extract Reads, Verify with BLAST, Extract to New Bundle,
      copies of the name, accession, taxon ID, sequence or FASTA, and NCBI
      and PubMed links.
  bundle.inspect:
    title: Inspect, validate and package bundles
    entry_points:
      - "Sidebar context menu > Get Bundle Info"
      - "Sidebar context menu > Show Package Contents"
      - "CLI: lungfish bundle info"
      - "CLI: lungfish bundle list"
      - "CLI: lungfish bundle validate"
      - "CLI: lungfish bundle export"
    inputs: [lungfishref]
    outputs: [oci-layout-tarball]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/Sidebar/SidebarItemAction.swift
      - Sources/LungfishCLI/Commands/BundleInfoSubcommand.swift
      - Sources/LungfishCLI/Commands/BundleListSubcommand.swift
      - Sources/LungfishCLI/Commands/BundleValidateSubcommand.swift
      - Sources/LungfishCLI/Commands/BundleExportSubcommand.swift
    module: [LungfishCLI, LungfishApp]
    notes: >-
      Shows a bundle's contents and checks its layout. bundle export writes a
      reference bundle as a deterministic OCI layout tarball.
  genotype.mhc-reference-bundle:
    title: MHC reference bundles
    entry_points:
      - "Open a .lungfishmhcref bundle from the sidebar"
      - "CLI: lungfish fastq mhc-reference-bundle"
    inputs: [fasta, mhc-allele-library]
    outputs: [mhc-reference-bundle]
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/FastqMHCReferenceBundleSubcommand.swift
      - Sources/LungfishApp/Views/Inspector/Sections/MHCReferenceBundleDocumentSection.swift
      - Sources/LungfishIO/Bundles/BundleKindRegistry.swift
    module: [LungfishApp, LungfishCLI, LungfishIO]
    notes: >-
      A .lungfishmhcref bundle holds the MHC allele library that the two MHC
      genotyping workflows take as their reference. The Inspector names a
      selected one an MHC Reference Bundle.
  rnaseq.reference-set:
    title: Build an RNA-seq reference set and its index
    entry_points:
      - "Plugin Manager > Databases > RNA-seq Reference Sets > Download"
      - "CLI: lungfish-cli rnaseq install-reference"
      - "CLI: lungfish-cli rnaseq reference-set"
      - "CLI: lungfish-cli rnaseq index"
      - "CLI: lungfish-cli rnaseq index-plan"
      - "CLI: lungfish-cli rnaseq index-adopt"
    inputs: [fasta, gtf, gff3]
    outputs: [rnaseq-reference-set, salmon-index, star-index]
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/RNASeqReferenceSetSubcommand.swift
      - Sources/LungfishCLI/Commands/RNASeqInstallReferenceSubcommand.swift
      - Sources/LungfishWorkflow/RNASeq/ReferenceSetCatalog.swift
      - Sources/LungfishWorkflow/RNASeq/ReferenceSetInstall.swift
      - Sources/LungfishApp/Views/PluginManager/RNASeqReferenceCatalogModel.swift
      - Sources/LungfishApp/Views/PluginManager/RNASeqReferenceSetsSection.swift
      - Sources/LungfishCLI/Commands/RNASeqIndexSubcommand.swift
      - Sources/LungfishCLI/Commands/RNASeqIndexPlanSubcommand.swift
      - Sources/LungfishCLI/Commands/RNASeqIndexAdoptSubcommand.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQOperationRNASeqQuantPane.swift
    module: [LungfishCLI, LungfishApp]
    notes: >-
      Builds a reference set from a genome, an annotation and extra sequences
      under the storage root, then builds or reuses its salmon index, or
      writes and adopts a plan that builds its STAR index on a Linux machine.
      Plugin Manager > Databases lists two sets under RNA-seq Reference
      Sets, human GRCh38 with GENCODE 50 and mouse GRCm39 with GENCODE M39.
      Download runs lungfish-cli rnaseq install-reference --default <id>
      on an Operations row of type download, which checks memory and free
      disk first, downloads and checks the genome and GTF, builds the set and
      builds its salmon index at k 31 with genome decoys. A row reads Ready to
      count once the set and that index are there. On a Mac with less memory
      than the index needs, Download is off and the words say why. Other
      species are built with rnaseq reference-set and rnaseq index.
  rnaseq.cell-map-select:
    title: Save or pseudobulk a cell map selection
    entry_points:
      - "Cell map view > Save Selection as Labels Table…"
      - "Cell map view > Pseudobulk Selected Cells…"
      - "CLI: lungfish-cli rnaseq cell-map select"
    inputs: [rnaseq-result]
    outputs: [labels-table, rnaseq-result]
    viewport_class: none
    sources:
      - Sources/LungfishRNASeqUI/CellMap/RNASeqCellMapViewController.swift
      - Sources/LungfishRNASeqUI/CellMap/RNASeqEmbeddingSelection.swift
      - Sources/LungfishApp/Services/RNASeqCellMapSelectRun.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+RNASeq.swift
      - Sources/LungfishCLI/Commands/RNASeqCellMapSubcommand.swift
    module: [LungfishApp, LungfishRNASeqUI, LungfishCLI]
    notes: >-
      Writes a labels table of the cells that a polygon or labels select in
      one embedding, outside every RNA-seq result and with its record beside
      it. Pseudobulk Selected Cells opens the pseudobulk pane filled in, and
      its run writes the table with cell-map select first.
  rnaseq.cell-map-compute:
    title: Compute a UMAP and Leiden clusters for a single-cell result
    entry_points:
      - "CLI: lungfish-cli rnaseq cell-map compute"
    inputs: [rnaseq-result]
    outputs: [rnaseq-result]
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/RNASeqCellMapComputeSubcommand.swift
      - Sources/LungfishWorkflow/Conda/PluginPack+SingleCell.swift
    module: [LungfishCLI, LungfishWorkflow]
    notes: >-
      Runs LGE's pinned Scanpy route in the Single-Cell Analysis pack's
      environment and writes the UMAP and Leiden clusters as a new cell map
      result. Only seed 0 is offered.
  debug.cli:
    title: Version and troubleshooting commands
    entry_points:
      - "CLI: lungfish version"
      - "CLI: lungfish debug env"
      - "CLI: lungfish debug resource-smoke"
      - "CLI: lungfish debug fastq-ingest"
      - "CLI: lungfish debug workflow-log"
    inputs: []
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/VersionCommand.swift
      - Sources/LungfishCLI/Commands/DebugCommand.swift
    module: [LungfishCLI]
    notes: >-
      version prints the LGE version and the bundled tool reference. The
      debug commands check the environment and dependencies, verify packaged
      resources without the app, run a FASTQ ingest and parse workflow logs.
