  classify.twelve-s:
    title: 12S amplicon metabarcoding
    entry_points:
      - "Tools > Classification > 12S Amplicon Matching…"
      - "Workflow Library > 12S Amplicon Matching"
      - "CLI: lungfish fastq 12s-match"
    inputs: [fastq, twelve-s-reference-fasta]
    outputs: [twelve-s-result, csv, tsv, xlsx]
    viewport_class: taxonomy
    sources:
      - Sources/LungfishWorkflow/TwelveS/TwelveSAmpliconMatchingWorkflow.swift
      - Sources/LungfishWorkflow/TwelveS/TwelveSAmpliconMatchingWorkflow+Fragments.swift
      - Sources/LungfishWorkflow/TwelveS/TwelveSAmpliconMatchingWorkflow+Inputs.swift
      - Sources/LungfishWorkflow/TwelveS/TwelveSAmpliconMatchingWorkflow+EarlierResult.swift
      - Sources/LungfishWorkflow/TwelveS/TwelveSFragmentCall.swift
      - Sources/LungfishTwelveSUI/TwelveSAmpliconResultViewController.swift
      - Sources/LungfishTwelveSUI/TwelveSReadFateSummary.swift
      - Sources/LungfishTwelveSUI/TwelveSCountUnit.swift
      - Sources/LungfishCLI/Commands/FastqTwelveSMatchSubcommand.swift
      - Sources/LungfishCLI/Commands/FastqTwelveSExportSubcommands.swift
      - Sources/LungfishApp/Services/WorkflowOperationExecutionService+TwelveSArguments.swift
    module: [LungfishCLI, LungfishWorkflow, LungfishTwelveSUI, LungfishApp]
    tests:
      - Tests/LungfishWorkflowTests/TwelveSFragmentCountingTests.swift
      - Tests/LungfishWorkflowTests/TwelveSMergedOnlyBaselineTests.swift
      - Tests/LungfishWorkflowTests/TwelveSAmpliconMatchingWorkflowForceTests.swift
      - Tests/LungfishAppTests/WorkflowOperationTwelveSCommandParityTests.swift
    notes: >-
      Matches 12S amplicon reads exactly to a deduplicated reference FASTA,
      resolves cross-species ambiguity, and reviews unresolved sequence
      clusters. Species and unresolved rows export to CSV, TSV, Excel, or FASTA.
      Inputs are merged or single reads, unmerged pairs or both, and it counts
      fragments. A merged or single read counts once, and so does an unmerged
      pair whose mates give the identical call, R2 read as its reverse
      complement. A pair whose mates disagree is left out of every count but
      input_reads and tallied as discordant_pairs in samples.tsv,
      read-fate.json, provenance, the run's output and the viewport's status
      line, and a result that read pairs says fragments in the viewport and
      Inspector. A file named inside a bundle is read alone, and two inputs of
      one sample name are refused. A rerun with --force keeps the earlier
      result until the new one is complete and puts it back if the run fails,
      and the row's command and the provenance argv are one command.
