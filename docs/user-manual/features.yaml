  bam.markdup:
    title: Mark and remove duplicate reads
    entry_points:
      - "Inspector > Mark Duplicates in Bundle Tracks"
      - "CLI: lungfish bundle mark-duplicates"
      - "CLI: lungfish markdup"
      - "CLI: lungfish bam deduplicate-alignments"
    inputs: [reference-bundle, bundle-alignment-track]
    outputs: [bam, bai, alignment-track]
    viewport_class: alignment
    sources:
      - Sources/LungfishWorkflow/Alignment/AlignmentDuplicateService.swift
      - Sources/LungfishCLI/Commands/MarkdupCommand.swift
      - Sources/LungfishCLI/Commands/CLIDeduplicatedBundleSupport.swift
      - Sources/LungfishCLI/Commands/BAMCommand.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+DuplicateWorkflowRoute.swift
      - Sources/LungfishApp/Services/CLIAlignmentActionRunner.swift
    module: [LungfishCLI, LungfishWorkflow, LungfishApp]
    cli:
      - lungfish-cli bundle mark-duplicates
      - lungfish-cli bundle deduplicate-alignments
    tests:
      - Tests/LungfishAppTests/AlignmentWorkflowCLIGUIParityReplayTests.swift
    notes: >-
      Marks PCR duplicates with samtools markdup. In a bundle the marking is
      non-destructive: originals stay as "<name> [unmarked]" and marked
      copies are added as "<name> [dup-marked]" under alignments/marked/, and
      a second run is refused. The Inspector run posts an Operations Panel
      row, honours the bundle lock, and can be cancelled. The standalone
      markdup and bam markdup commands are non-destructive too, writing
      <name>.markdup.bam and its .bai beside the input unless --output names
      another path, and only --in-place overwrites the input, with a
      warning. deduplicate-alignments writes a new bundle with the duplicates
      removed. Chapter: 04-alignments/04.
      In the Inspector, Mark Duplicates in Bundle Tracks and Create
      Deduplicated Bundle run the bundle mark-duplicates and bundle
      deduplicate-alignments leaves.
