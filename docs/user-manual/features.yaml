      - Sources/LungfishWorkflow/Provenance/ProvenanceExporter.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceRecorder+SidecarLookup.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceRecorder.swift
      - Sources/LungfishOperations/ProvenancePathRehydrator.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI, LungfishOperations]
    cli:
      - lungfish-cli provenance export
      - lungfish-cli provenance verify
      - lungfish-cli provenance bibliography
    tests:
      - Tests/LungfishAppTests/AppProvenanceExportSourceResolverTests.swift
      - Tests/LungfishAppTests/AppProvenanceExportSelectionTests.swift
      - Tests/LungfishCLITests/ProvenanceExportCommandTests.swift
      - Tests/LungfishWorkflowTests/ProvenanceExportFidelityTests.swift
      - Tests/LungfishOperationsTests/ProvenancePathRehydratorTests.swift
      - Tests/LungfishAppTests/SidebarMoveOfABuiltResultFolderReplayTests.swift
      - Tests/LungfishAppTests/ProvenanceExportCancelReplayTests.swift
    notes: >-
      File > Export > Provenance holds the six ProvenanceExportMenuModel
      items. Each exports the record of the current viewer or sidebar
      selection, which AppProvenanceExportSourceResolver picks and
      ProvenanceRecorder.findProvenanceEnvelope finds without writing. With
      no selection it falls back to the newest completed run that the
      in-memory ProvenanceRecorder holds. ProvenanceExporter.exportBundle
      writes run.sh, reproduce.py, methods.md or provenance.json into the
      folder the save panel names, beside a provenance folder with copies of
      the source records and a record of the export. The Export menu of the
      Inspector's Provenance tab offers the same six items. The CLI
      provenance export runs the same exporter, provenance verify checks a
      signed record and provenance bibliography prints a citation list.
      A sidebar rename, move or copy of a result folder keeps its records
      true. When the app has a signing key in its environment, each signed
      record that the change rewrites is signed again and passes
      lungfish-cli provenance verify. When it has none, such a record loses
      its signature file and public key and reads unsigned, and lungfish-cli
      provenance verify on it prints Signature artifact is missing and ends
      with exit status 64, as it does for any unsigned record. A record
      whose signature had already failed stays as it was, so a result
      renamed by an earlier release still fails verify, since a rename
      cannot tell an old rename from an edit.
      The six items and the Inspector's export menu run lungfish-cli
      provenance export behind an Operations row, and Copy CLI Command
      replays it. The command builds the report in a hidden staging folder
      and publishes it when the report is complete, so Cancel leaves the
      output folder as it was, and an existing folder keeps the files the
      export does not write. If the command does not stop within the 6
      seconds that LGE gives it after Cancel, or a second SIGTERM reaches
      it, a hidden .<name>.<id>.export.tmp folder can remain beside the
      output, or inside it for an existing folder.
  provenance.inspector:
    title: Read a result's provenance in the Inspector
    entry_points:
      - "View > Provenance Inspector"
      - "Inspector > Provenance"
    inputs: [provenance-sidecar, bundle]
    outputs: [provenance-text, provenance-export]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/Inspector/Sections/ProvenanceSection.swift
      - Sources/LungfishApp/Views/Inspector/Sections/ProvenancePathCaption.swift
      - Sources/LungfishApp/Views/Inspector/ProvenanceInspectorViewModel.swift
      - Sources/LungfishApp/Views/Inspector/ProvenanceInspectorViewModel+RunStatus.swift
      - Sources/LungfishApp/Views/Inspector/ProvenanceInspectorViewModel+RecordShape.swift
      - Sources/LungfishApp/Views/Inspector/InspectorSupportingTypes.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewModel.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+Notifications.swift
      - Sources/LungfishApp/App/AppDelegate+MenuActions.swift
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceRecorder+SidecarLookup.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceLineageResolver.swift
      - Sources/LungfishApp/Views/Inspector/ProvenanceInspectorViewModel+StepTermination.swift
      - Sources/LungfishApp/Views/Inspector/Sections/ProvenanceSection+StepTermination.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceCommandPresentation.swift
      - Sources/LungfishApp/Views/Inspector/ProvenanceInspectorViewModel+StepCopy.swift
    module: [LungfishApp, LungfishWorkflow]
    tests:
      - Tests/LungfishAppTests/ProvenanceInspectorViewModelTests.swift
      - Tests/LungfishAppTests/ProvenanceInspectorViewModelOffMainTests.swift
      - Tests/LungfishAppTests/ProvenanceSectionAccessibilityTests.swift
      - Tests/LungfishAppTests/ProvenanceSectionSourceTests.swift
      - Tests/LungfishAppTests/ProvenanceLegacyDisplayTests.swift
      - Tests/LungfishAppTests/ProvenanceRunStatusDisplayTests.swift
      - Tests/LungfishAppTests/ProvenanceStepTerminationDisplayTests.swift
      - Tests/LungfishWorkflowTests/ProvenanceCommandPresentationTests.swift
      - Tests/LungfishCoreTests/PortablePathRerootSpanTests.swift
      - Tests/LungfishAppTests/ProvenanceStepCopyTests.swift
    notes: >-
      View > Provenance Inspector (Option-Command-V) shows the Inspector on
      its Provenance tab. InspectorViewModel.availableTabs offers the tab in
      every content mode except the empty viewer, and in a classifier's read
      evidence view only while it has an item to load. The tab finds the
      selection's record with ProvenanceRecorder.findProvenanceEnvelope and
      its upstream records with ProvenanceLineageResolver, and reading writes
      nothing. It shows Run Summary, Lineage, Files & Outputs, Invocation &
      Options, Runtime and Raw JSON, a Warnings group when there are any, a
      Source picker when the selection has several records, a Copy button
      and an Export menu of the six File > Export > Provenance formats. A
      result with no record reads Missing provenance. The status line under the
      section title audits the record and not the run. It reads Complete record,
      Incomplete record, Older record format, Missing provenance or No provenance
      required, and Invalid record when a record a native loader verified cannot be
      read. Run Summary includes a Run Status row between Created and Exit
      Status. It reads the record's own status as Completed, Failed, Cancelled or
      Not finished, and reads Not recorded when the record states none and the
      reader derived one. A record whose format never holds a process ID shows no
      Process ID row. That covers an envelope at version 2 or later, a typed record
      such as mapping-provenance.json, and a version 1 envelope that states its
      own status, embeds no legacy run and holds no process ID. A record that holds
      a process ID keeps the row, and a bare run or primitive record in the Older
      record format that lacks one reads Not recorded.
      A step recorded by this release shows an Environment row under
      Command, and a Termination or Output row only when the step ended in
      an unusual way. An older record shows none of them.
      A step's Command row shows the recorded command with each path inside
      the project shortened to its project-relative form (a scratch file the
      project did not keep by its name, any other path as recorded), and a
      shell's -c or -lc script keeps its program with each path inside it
      shortened the same way. Copy Command copies the full recorded command.
      Each Lineage step offers Copy Step, Copy Command and Copy All Steps from
      its copy icon, its context menu and its VoiceOver actions, and Command-C
      copies a focused step. Copy Step copies the step's own block of what Copy
      All Steps copies.
      A step that ran inside the app, such as a merge of FASTQ bundles, keeps
      its recorded words in the Command row with the note This step ran inside
      the app and has no command to run in Terminal. Its Copy Command is off,
      and Copy Step still copies the step.
