      row. The export pane takes one or more RNA-seq results, which a person
      picks with an open panel, since the sidebar selection is not carried
      into the pane yet. A sample sheet, the design columns, the contrasts,
      the adjusted p-value cutoff, the fold-change bar and the batch
      settings are optional. The cutoff reads 0.05 and goes to DESeq2 as
      alpha. One run is lungfish-cli rnaseq export with --format json, and
      the Operations row records the command that runs, which Copy CLI
      Command gives. Run stays off until the pane holds a result, a folder
      name, a cutoff above 0 and at most 1, a fold-change bar of 0 or more
      or none, and contrasts written as FACTOR:NUMERATOR:DENOMINATOR with
      all three parts given. The command checks the rest, which are the
      design, the animals of each group and the batch, and a refusal shows
      in the command's own words on the Operations row. A cancel ends the
      command and leaves no folder and no stage.
  rnaseq.pseudobulk:
    title: Pseudobulk RNA-seq cells
    entry_points:
      - "Tools > RNA-seq > Pseudobulk RNA-seq Cells…"
      - "CLI: lungfish-cli rnaseq pseudobulk"
    inputs: [rnaseq-result, labels-table]
    outputs: [rnaseq-result]
    viewport_class: none
    sources:
