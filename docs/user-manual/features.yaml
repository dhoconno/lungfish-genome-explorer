      or qPCR mode. The qPCR result selects the lowest-penalty assay.
      Chapters: 10-primer-design/03 and 04.
      A design run records a lungfish-cli primers design varvamp command,
      which is proven to resolve to the dialog's options.
  primer-analysis.review:
    title: Review a primer analysis
    entry_points:
      - "Open a .lungfishprimeranalysis bundle from the sidebar"
      - "CLI: lungfish primers analysis inspect"
    inputs: [lungfishprimeranalysis]
    outputs: []
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/PrimerAnalysis/PrimerAnalysisViewerView.swift
      - Sources/LungfishApp/Views/PrimerAnalysis/PrimerBindingInspectionView.swift
      - Sources/LungfishApp/Views/Inspector/Sections/PrimerAnalysisDisplaySection.swift
      - Sources/LungfishWorkflow/PrimerDesign/PrimerAnalysisNativeInspectionService.swift
      - Sources/LungfishCLI/Commands/PrimerAnalysisCommand.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI]
    notes: >-
      Overview, Results, and binding inspection against the input alignment,
      with the Inspector's display and export controls. inspect verifies the
      stored file checksums. Chapter: 10-primer-design/05.
  primer-analysis.order-export:
    title: Export a primer order
    entry_points:
      - "Inspector > Export candidate pairs…"
      - "Inspector > Export all reported assays…"
      - "CLI: lungfish primers analysis export-order"
    inputs: [lungfishprimeranalysis]
    outputs: [xlsx, csv, json]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/PrimerAnalysis/PrimerOrderExportView.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+PrimerAnalysis.swift
      - Sources/LungfishWorkflow/PrimerAnalysis/PrimerOrderExportService.swift
      - Sources/LungfishWorkflow/PrimerDesign/PrimerSchemeOrderSheet.swift
      - Sources/LungfishCLI/Commands/PrimerAnalysisCommand.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+PrimerAnalysisExportBegin.swift
      - Sources/LungfishWorkflow/Bundles/PrimerExportInvocations.swift
      - Sources/LungfishOperations/PrimerAnalysisExportDestination.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI, LungfishOperations]
    tests:
      - Tests/LungfishCLITests/PrimerAnalysisExportOrderCommandTests.swift
      - Tests/LungfishCLITests/PrimerAnalysisExportSIGTERMTests.swift
      - Tests/LungfishAppTests/PrimerAnalysisExportRowTests.swift
      - Tests/LungfishAppTests/PrimerExportCLIGUIParityReplayTests.swift
      - Tests/LungfishOperationsTests/PrimerAnalysisExportDestinationTests.swift
    notes: >-
      Writes order workbooks, a CSV, and order.json for the selected or all
      reported assays. Chapter: 10-primer-design/05.
      primers analysis export-order takes --hide-primer, --hide-pool,
      --hide-forward, --hide-reverse, --hide-amplicons,
      --hide-identity-dots, --hide-unassessed, --filter-compatibility and
      --min-compatibility, so a PrimalScheme order exported from a filtered
      view records a command that carries them. A parse test alone covers
      the compatibility options.
      The export runs lungfish-cli primers analysis export-order behind an
      Operations row, so Copy CLI Command replays it, a cancel leaves no
      folder behind, and the command takes --format json. Copy CLI Command
      spells each filled field with an equals sign, so a value that starts
      with a hyphen exports and replays.
  primer-analysis.export-selection:
    title: Save a primer FASTA bundle or extract a reference amplicon
    entry_points:
      - "Primer review context menu > Save Primer FASTA Bundle in Project"
      - "Primer review context menu > Extract Reference Amplicon Bundle in Project"
      - "CLI: lungfish primers analysis export-selection"
    inputs: [lungfishprimeranalysis]
    outputs: [primer-fasta-bundle, reference-amplicon-bundle]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/PrimerAnalysis/PrimerReviewContextMenu.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+PrimerAnalysis.swift
      - Sources/LungfishCLI/Commands/PrimerAnalysisExportSelectionCommand.swift
      - Sources/LungfishCLI/Commands/PrimerAnalysisCommand.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+PrimerAnalysisExportBegin.swift
      - Sources/LungfishWorkflow/Bundles/PrimerExportInvocations.swift
      - Sources/LungfishOperations/PrimerAnalysisExportDestination.swift
    module: [LungfishApp, LungfishCLI, LungfishWorkflow, LungfishOperations]
    cli:
      - lungfish-cli primers analysis export-selection
    tests:
      - Tests/LungfishCLITests/PrimerAnalysisExportSelectionCommandTests.swift
      - Tests/LungfishCLITests/PrimerAnalysisExportSIGTERMTests.swift
      - Tests/LungfishAppTests/PrimerSelectionExportParityTests.swift
      - Tests/LungfishAppTests/PrimerAnalysisExportRowTests.swift
      - Tests/LungfishAppTests/PrimerExportCLIGUIParityReplayTests.swift
    notes: >-
      primers analysis export-selection reproduces Save Primer FASTA Bundle
      and Extract Reference Amplicon for a primer, an amplicon, a numbered
      pool or a native pool, with --kind primer-fasta or --kind
      reference-amplicon. The Operations row records the command, and the
      export's provenance argv is that command. The command takes the IDs
      the saved analysis stores, which Copy CLI Command gives on an export
      made in the app. A cancel leaves no folder behind, and the command takes
      --format json.
  primer-analysis.scheme-from-analysis:
    title: Save a designed scheme as a primer scheme bundle
    entry_points:
      - "Inspector > Save as Primer Scheme…"
      - "CLI: lungfish primers scheme-from-analysis"
    inputs: [lungfishprimeranalysis]
    outputs: [lungfishprimers]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/PrimerAnalysis/PrimerSchemeExportView.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+PrimerAnalysis.swift
      - Sources/LungfishWorkflow/Primers/PrimerSchemeFromAnalysisService.swift
      - Sources/LungfishCLI/Commands/PrimerCommand.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI]
    notes: >-
      Saves a PrimalScheme, Olivar, or tiled varVAMP design to Primer
      Schemes/<name>.lungfishprimers with its design reference under
      attachments/, ready for BAM primer trimming. Chapters:
      10-primer-design/05 and appendices/primer-schemes.
