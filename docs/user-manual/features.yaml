  plugins.manage:
    title: Plugin Manager
    entry_points:
      - "Tools > Plugin Manager"
      - "CLI: lungfish conda"
    inputs: [plugin-pack]
    outputs: [installed-plugin]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/PluginManager/PluginManagerWindowController.swift
      - Sources/LungfishApp/Views/PluginManager/PluginManagerViewModel.swift
      - Sources/LungfishCLI/Commands/CondaCommand.swift
    notes: >-
      Discovers, installs, and manages the lifecycle of Python, Rust, Swift, and
