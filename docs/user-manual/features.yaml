      - Tests/LungfishAppTests/RNASeqPseudobulkDialogStateTests.swift
      - Tests/LungfishAppViewTests/ToolsMenuStructureTests.swift
      - Tests/LungfishAppWorkflowTests/WorkflowOperationDialogStateTests.swift
    notes: >-
      The second new tool of the RNA-seq category. It takes one single-cell
      result and a labels table, which a person picks with an open panel,
      and sums the cells of each sample by label into a bulk result with a
      name the person gives. The folder name gets the .lungfishrnaseq
      extension once. One run is lungfish-cli rnaseq pseudobulk with
      --format json, and the Operations row records the command that runs.
      A group of fewer than 10 cells is left out, and so are cells with no
      label. The command prints a note for each, and the row then ends
      Completed with Warnings and shows the notes as the command prints
      them. Any refusal shows in the command's own words on the row. A
      cancel ends the command and leaves no result and no stage.
  rnaseq.cell-map-import:
    title: Import Embedding
    entry_points:
      - "Tools > RNA-seq > Import Embedding…"
      - "CLI: lungfish-cli rnaseq cell-map import"
    inputs: [rnaseq-result, embedding-table]
    outputs: [rnaseq-result]
    viewport_class: none
    sources:
