  ai.assistant:
    title: AI assistant panel
    entry_points:
      - "View > AI Assistant"
    inputs: [active-dataset, chat-prompt]
    outputs: [chat-response]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/AI/AIAssistantPanel.swift
      - Sources/LungfishApp/Services/AI/AIAssistantService.swift
    notes: >-
      Chat panel that answers questions about the active dataset, suggests
      workflows, and helps interpret results using a bring-your-own-key provider.
  containers.run:
    title: Containerized tool execution
    entry_points:
      - "Runs automatically for containerized workflow steps"
      - "CLI: lungfish debug container"
    inputs: [container-image]
    outputs: [container-run-output]
    viewport_class: none
    sources:
      - Sources/LungfishWorkflow/Containers/Container.swift
      - Sources/LungfishWorkflow/Containers/ContainerImageRegistry.swift
      - Sources/LungfishCLI/Commands/DebugCommand.swift
    notes: >-
      Runs Docker or Apptainer images in lightweight Linux VMs on Apple Silicon
      via Apple Containerization for workflow steps that need them.
