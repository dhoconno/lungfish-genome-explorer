    operation_type: rnaSeqQuantification
    tests:
      - Tests/LungfishAppTests/RNASeqQuantDialogTests.swift
      - Tests/LungfishAppTests/RNASeqQuantDialogConformanceTests.swift
      - Tests/LungfishAppTests/RNASeqQuantParityMasks.swift
      - Tests/LungfishAppTests/FASTQOperationsCatalogTests.swift
      - Tests/LungfishAppViewTests/ToolsMenuStructureTests.swift
    notes: >-
      The Tools menu has an RNA-seq category after Genotyping with one tool,
      Count Reads per Gene. The category needs the rna-seq pack, where
      salmon comes from. The pane lists the reference sets under the storage
      root's rnaseq-reference-sets folder. With none, it says to download one
      in Plugin Manager and shows Download Reference Set…, which opens the
      Databases tab, and it fills again when an install there finishes. A set
      with no salmon index for the chosen k and decoys keeps Run off. It sets
      k, decoys, trimming and
      poly-G trimming, each with the help words of the command. One run
      makes one result for all chosen FASTQ bundles, by lungfish-cli rnaseq
      quant with --format json. The Operations row reads Count Reads per Gene and
      records the command that runs, which Copy CLI Command gives. A virtual
      bundle is named by its folder, and the command writes its reads to the
      run's work folder before salmon starts. A cancel ends the command
      (exit 125), which leaves no result and removes its work folder. The
      row shows the standard error lines of the command and no progress bar.
  rnaseq.quality:
    title: Quality numbers and sample correlation of an RNA-seq result
    entry_points:
      - "CLI: lungfish-cli rnaseq quality"
    inputs: [rnaseq-result]
    outputs: [quality-table]
    viewport_class: none
    sources:
      - Sources/LungfishWorkflow/RNASeq/RNASeqQualitySummary.swift
      - Sources/LungfishWorkflow/RNASeq/RNASeqQualitySummary+Correlation.swift
      - Sources/LungfishWorkflow/CLIEvents/CLIEventContract.swift
      - Sources/LungfishWorkflow/Provenance/ScientificProvenancePolicy.swift
      - Sources/LungfishCLI/Commands/RNASeqQualitySubcommand.swift
      - Sources/LungfishCLI/Commands/RNASeqCommand.swift
    module: [LungfishWorkflow, LungfishCLI]
    cli:
      - lungfish-cli rnaseq quality
    tests:
      - Tests/LungfishWorkflowTests/RNASeq/RNASeqQualitySummaryTests.swift
      - Tests/LungfishCLITests/RNASeqQualitySubcommandTests.swift
      - Tests/LungfishCLITests/ScientificProvenancePolicyLeafTests.swift
      - Tests/LungfishCLITests/CLIEventContractCoverageTests.swift
    notes: >-
      Prints one table of a bulk .lungfishrnaseq result and writes nothing.
      It first checks each file of the result against the sha256 that the
      manifest lists. --table samples gives each sample's library size,
      mapping rate and library type, the share of counts on rRNA genes
      (biotype rRNA or Mt_rRNA in genes.tsv) and the share on not-host
      features. The globin share reads Not recorded, since no rule names the
      globin genes yet, and so does the not-host share of a result that
      names no reference set. --table correlation gives Pearson r of
      log2(CPM + 1) between the samples, over the features that the manifest
      does not list under notHost and with a count above 0 in a sample.
      --format takes text, which is the default, json and tsv.
