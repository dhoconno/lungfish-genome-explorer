    module: [LungfishGenotypeUI, LungfishApp]
    notes: >-
      Presents a genotype comparison matrix, haplotype tape, cohort summary, and
      per-sample call evidence with manual haplotyping and annotation overrides.
      This dashboard is not one of the five genomic viewport classes.
      Selection > Genotype Sample holds the sample status commands (Cmd-R,
      Cmd-K, Cmd-Shift-F) and Sample Detail (Cmd-Shift-O). Undo and Redo
      reverse a status change, and every change, an Undo included, writes an
      audit entry whose before value is the replaced status (clearSampleStatus
      when an Undo leaves no status). Selection > Genotype Call holds the
      matrix review commands, which are not undoable.
      Annotation edits encode, hash and write their annotations.json pair
      away from the main thread, one edit at a time in the order they were
      made.
