      - Sources/LungfishApp/Views/Viewer/ViewerViewController+Taxonomy.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+TaxaCollectionArguments.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI]
    cli:
      - lungfish-cli extract taxa-collection
    tests:
      - Tests/LungfishWorkflowTests/Extraction/Kraken2MateNameExtractionTests.swift
      - Tests/LungfishCLITests/ExtractTaxaCollectionCommandTests.swift
    notes: >-
      Extracts reads assigned to any taxon back into a fresh FASTQ dataset for
      downstream mapping or assembly. A Kraken2 extraction returns both mates,
      merged reads and orphans, pairs first, and the bundle records an
      interleaved or mixed layout. It reads R1 and R2 files in step, as
      Kraken2 read them, so mates named x/1 and x/2, x.1 and x.2, or x_1 and
      x_2 extract, and files out of step stop the extraction.
      When a result's BAM is a link to a file outside the result folder, the
      failure says that LGE extracts reads only from BAM files inside the
      folder and asks for a copy in place of the link.
      A taxa collection extraction records the lungfish-cli extract
      taxa-collection command that Copy CLI Command copies, and the command
      writes extracted-<collection id>/<name>_taxid<id>.fastq.gz. A
      clipboard or share extraction records an extract reads
      --by-classifier command, which Copy CLI Command replays. A collection
      extraction picks reads the same way as the other classifiers, and
      extract reads --by-classifier --tool kraken2 takes --taxon-scope exact
      for the reads classified to a taxon itself. lungfish-cli conda extract
      is gone, and its notice names extract reads --by-classifier --tool
      kraken2.

