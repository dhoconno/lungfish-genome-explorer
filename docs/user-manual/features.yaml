  # --- Multiple sequence alignment and phylogenetics ---
  msa.align:
    title: Multiple sequence alignment
    entry_points:
      - "Tools > Alignment & Phylogenetics > MAFFT…"
      - "CLI: lungfish align mafft"
    inputs: [fasta, sequence-collection]
    outputs: [lungfishmsa]
    viewport_class: sequence
    sources:
      - Sources/LungfishApp/App/AppDelegate+ToolsMenu.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenuOperationBegin.swift
      - Sources/LungfishWorkflow/MSA/MAFFTAlignmentPipeline.swift
      - Sources/LungfishCLI/Commands/AlignCommand.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI]
    cli:
      - lungfish-cli align mafft
    operation_type: multipleSequenceAlignmentGeneration
    provenance: MultipleSequenceAlignmentBundle.importAlignment options (workflow multiple-sequence-alignment-mafft)
    tests:
      - Tests/LungfishWorkflowTests/MSA/MAFFTAlignmentPipelineTests.swift
      - Tests/LungfishCLITests/AlignCommandTests.swift
    notes: >-
      Aligns FASTA sequences with MAFFT and creates a native .lungfishmsa
      alignment bundle. A FASTQ bundle given as input contributes the records
      of every file it holds, every chunk of a chunked root and both mates of
      a paired derivative, and the pane's All sequences count includes them.
      A cancel (SIGTERM) of align mafft records the run as cancelled and
      exits 125.
  msa.actions:
    title: MSA editing and analysis
    entry_points:
      - "CLI: lungfish msa consensus"
      - "CLI: lungfish msa distance"
    inputs: [lungfishmsa]
    outputs: [lungfishmsa, consensus-fasta, distance-matrix]
    viewport_class: sequence
    sources:
      - Sources/LungfishCLI/Commands/MSACommand.swift
      - Sources/LungfishCLI/Commands/ImportMSATreeSubcommands.swift
      - Sources/LungfishCLI/Commands/MSAActionCancellation.swift
    module: [LungfishCLI]
    cli:
      - lungfish-cli msa consensus
      - lungfish-cli msa distance
    tests:
      - Tests/LungfishCLITests/MSACommandTests.swift
    notes: >-
      Adds column annotations, builds consensus sequences, extracts rows and
      columns, creates masked or trimmed derivatives, and computes identity or
      distance matrices (msa distance, see msa.inspection.distance-matrix for
      the window's Distances pane).
      A cancel (SIGTERM) of an msa action records the run as cancelled and
      exits 125. msa discriminating-sites is not converted, the four msa
      annotate actions never reach the cancel point, and msa distance on a
      large alignment cannot be cancelled after it has read the alignment. A
      cancel that arrives after the write leaves a complete result under a
      row that reads Cancelled by user.
  msa.inspection.distance-matrix:
    title: Pairwise distance matrix pane for an alignment
    entry_points:
      - "View > Show Distance Matrix"
      - "View > Distance Matrix > Reveal Pair in Alignment"
      - "View > Distance Matrix > Select Row's Sequences"
      - "View > Distance Matrix > Copy Matrix"
      - "View > Distance Matrix > Export Matrix as TSV..."
      - "View > Show Drawer"
      - "File > Export > Distance Matrix (TSV)..."
      - "MSA toolbar > Distance matrix button"
      - "Inspector > Bundle > Pairwise Distance > Show Distance Matrix"
      - "CLI: lungfish msa distance"
    inputs: [lungfishmsa]
    outputs: [distance-matrix, tsv]
    viewport_class: sequence
    sources:
