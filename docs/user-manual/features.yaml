  import.fastq:
    title: Import FASTQ reads
    entry_points:
      - "Import Center > Sequencing Reads > Sequencing Read Files"
      - "Import Center > Sequencing Reads > FASTQ Sample Sheet"
      - "Import Center > Sequencing Reads > ONT Run Folder"
      - "CLI: lungfish import-fastq"
      - "CLI: lungfish import fastq"
      - "CLI: lungfish fastq ingest"
    inputs: [fastq, fastq.gz]
    outputs: [fastq-dataset]
    viewport_class: none
    sources:
      - Sources/LungfishApp/Views/ImportCenter/ImportCenterViewModel.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfigSheet.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfigSheet+Platform.swift
      - Sources/LungfishApp/Services/FASTQIngestionService+OperationBegin.swift
      - Sources/LungfishApp/Services/CLIImportRunner.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+FASTQImportOperationBegin.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+FASTQImportBatch.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfiguration.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportSheetSwitchControls.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportSheetRecipeOption.swift
      - Sources/LungfishCLI/Commands/ImportFastqCommand.swift
      - Sources/LungfishCLI/Commands/ImportFastqCommand+Events.swift
      - Sources/LungfishCLI/Commands/FastqMaterializeSubcommand.swift
      - Sources/LungfishIO/Formats/FASTQ/PlatformInference.swift
      - Sources/LungfishWorkflow/Ingestion/ImportPlatformRequest.swift
      - Sources/LungfishWorkflow/Ingestion/FASTQBatchImporter.swift
      - Sources/LungfishWorkflow/Recipes/RecipeSwitches.swift
      - Sources/LungfishWorkflow/Resources/Recipes/illumina-paired-cleanup.recipe.json
      - Sources/LungfishWorkflow/Ingestion/FASTQBatchImporter+SameBatch.swift
      - Sources/LungfishWorkflow/Ingestion/FASTQBatchImporter+UnpairedReads.swift
      - Sources/LungfishWorkflow/Ingestion/FASTQBatchImporter+PairDetection.swift
      - Sources/LungfishWorkflow/Ingestion/FASTQImportEventStream.swift
      - Sources/LungfishCLI/Commands/FastqIngestSubcommand.swift
      - Sources/LungfishCLI/Commands/FastqIngestSubcommand+Run.swift
      - Sources/LungfishCLI/Commands/FastqImportONTSubcommand+Events.swift
      - Sources/LungfishApp/Services/FASTQIngestionService+CLIRoute.swift
    module: [LungfishApp, LungfishCLI, LungfishIO, LungfishWorkflow]
    cli:
      - lungfish-cli fastq ingest
      - lungfish-cli fastq import-ont
    tests:
      - Tests/LungfishAppTests/FASTQImportSheetDetectionTests.swift
      - Tests/LungfishAppTests/CLIImportRunnerTranscriptTests.swift
      - Tests/LungfishWorkflowTests/Ingestion/FASTQBatchImporterSameBatchTests.swift
      - Tests/LungfishWorkflowTests/Ingestion/FASTQBatchImporterFolderPairsTests.swift
      - Tests/LungfishCLITests/ImportFastqFolderPairsTests.swift
      - Tests/LungfishCLITests/ImportFastqTextOutputPinTests.swift
      - Tests/LungfishCLITests/FastqIngestInPlacePinTests.swift
      - Tests/LungfishCLITests/FastqImportONTEventsTests.swift
      - Tests/LungfishAppTests/FastqIngestRouteSigningReplayTests.swift
      - Tests/LungfishAppTests/FASTQImportSheetRecipeSwitchTests.swift
      - Tests/LungfishAppTests/FASTQImportQualityBinningDefaultTests.swift
      - Tests/LungfishCLITests/QualityBinningDefaultRouteTests.swift
      - Tests/LungfishWorkflowTests/Ingestion/QualityBinningDefaultTests.swift
    notes: >-
      Batch-imports paired-end or single-end FASTQ at any size with virtual
      previews that keep the UI responsive while operations run on the full
      file. The Illumina paired-end cleanup recipe has two presets,
      vsp2-target-enrichment (also vsp2) and wastewater-metagenomics. The
      options --remove-duplicates and --remove-ribosomal-rna, each with a
      --no- form, replace the preset's setting, and the record names the
      preset and each switch's value and source. In the Import FASTQ sheet the
      recipe picker lists each preset by its name. Under it, a checkbox for
      Remove duplicate reads and one for Remove ribosomal RNA reads start at
      the chosen preset's values. The import command gains an option only for
      a checkbox the user changed, and the Workflow line lists the steps that
      run. The platform is inferred per
      sample from the read headers, or a
      BAM's @RG PL, DS and @PG lines, and the sheet shows the evidence under
      its summary. An untouched Platform popup imports with --platform auto,
      and the sidecar's platformAssignment keeps the source, evidence and
      confidence. The sheet, explicit files and --recursive group files by one
      detection. A mate pairs inside its own folder first, and across folders
      only when no other file of the import has either name, else a warning
      names the files. A lone file keeps its whole name. An SRA run's _1, _2 and third file import as one
      bundle once the third-file check passes. --force never replaces a bundle
      an earlier sample of the same import wrote, and no sample writes a
      bundle an earlier sample failed to write. A file that holds pairs beside
      single reads records single_end with its read roles, and the Inspector's
      Pairing row names it "Pairs and single reads" with the counts.
      A FASTQ file copied into a project is ingested in place by running
      lungfish-cli fastq ingest --delete-originals --format json, which
      removes the original last. The ONT import of a run folder runs
      lungfish-cli fastq import-ont --format json. Imports bin quality scores
      with illumina4 (Illumina 7-level) unless the user picks eightLevel or
      none, and the sheet's Quality Binning popup starts at Illumina
      (7-level). A chunked ONT run folder import bins each stored chunk with
      reformat.sh, and Optimize Storage bins with clumpify. A flattened ONT
      import without Optimize Storage keeps every score. The two barcode
      recipes do not bin quality scores, so the popup reads None and is off
      for them. Binning saves space and is lossy. A recipe's declared binning
      applies when no option names one.
      Every recorded command names its binning, and the import record states
      its source as option, recipe or default.
