      - Sources/LungfishRNASeqUI/CellMap/RNASeqEmbeddingPlotView.swift
      - Sources/LungfishRNASeqUI/CellMap/RNASeqEmbeddingLegend.swift
      - Sources/LungfishRNASeqUI/CellMap/RNASeqEmbeddingGenePicker.swift
      - Sources/LungfishRNASeqUI/CellMap/RNASeqEmbeddingSelection.swift
