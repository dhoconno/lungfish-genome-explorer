# features.yaml, Lungfish feature inventory.
# Ownership: Code Cartographer only.
# Schema:
#   <feature_id>:
#     title: <human name>
#     entry_points: [<UI path or CLI command>, ...]
#     inputs: [<file format or data type>, ...]
#     outputs: [<file format or data type>, ...]
#     viewport_class: sequence | alignment | variant | assembly | taxonomy | none
#     sources: [<Sources/ path>, ...]
#     module: [<Sources/ target directory>, ...]   (optional, checked)
#       Every Sources target that holds one of this entry's sources, the
#       target with the most sources first.
#     cli: [<real lungfish-cli subcommand path>, ...]   (optional)
#     operation_type: <OperationType case the app starts the operation with>   (optional)
#     provenance: <provenance record type or sidecar the run writes>   (optional)
#     tests: [<Tests/ path>, ...]   (optional, checked)
#     notes: <free text>
#   Optional fields are filled only where verified in code. The checker
#   scripts/checks/features-yaml-sources.py requires every sources: and tests:
#   path to exist and every module: to be a directory under Sources/.
#   Write the optional list fields as unquoted items so the quote-matching
#   entry-point check does not mistake them for menu paths.

version: 0
features:
  import.vcf:
    title: Import VCF
    entry_points:
      - "Import Center > Variants"
      - "CLI: lungfish import vcf"
    inputs: [vcf, vcf.gz]
    outputs: [variant-browser-dataset]
    viewport_class: variant
    sources:
      - Sources/LungfishIO/Formats/VCF/VCFReader.swift
      - Sources/LungfishIO/Formats/VCF/VCFReferenceInference.swift
      - Sources/LungfishCLI/Commands/ImportCommand+VCF.swift
      - Sources/LungfishCLI/Commands/ImportCommand+VCFModes.swift
      - Sources/LungfishApp/Services/VCFImportCLICommand.swift
      - Sources/LungfishApp/App/VCFAutoIngestor.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenterOperationBegin.swift
      - Sources/LungfishCLI/Commands/ImportCommand.swift
      - Sources/LungfishIO/Bundles/VariantDatabase+INFOExpansion.swift
    module: [LungfishIO, LungfishApp, LungfishCLI]
    tests:
      - Tests/LungfishIOTests/VariantStructuredINFOTests.swift
    notes: >-
      Accepts plain text VCF and bgzipped VCF with accompanying tabix index.
      Inference picks a compatible reference by chromosome set, applying
      RefSeq, UCSC, and Ensembl alias mappings so that a VCF carrying
      MT192765.1 or NC_045512.2 or chrCOV19 resolves to the same reference
      when present in the project.
      At every import profile, SnpEff ANN and VEP CSQ annotations are split
      into their fields, so the High Impact filter and filters on ANN fields
      such as ANN_IMPACT find variants. A file imported before this release
      keeps its old rows until it is imported again.
  viewport.variant-browser:
    title: Variant browser viewport
    entry_points:
      - "Open a VCF dataset from the sidebar"
    inputs: [variant-browser-dataset]
    outputs: []
    viewport_class: variant
    sources:
      - Sources/LungfishApp/Views/Viewer/VCFDatasetViewController.swift
      - Sources/LungfishWorkflow/ViewerExport/Graphics/VariantTrackRenderer.swift
      - Sources/LungfishApp/Views/Inspector/Sections/VariantSection.swift
      - Sources/LungfishCore/Models/VariantTrack.swift
      - Sources/LungfishIO/Bundles/VariantDatabase.swift
    module: [LungfishApp, LungfishCore, LungfishIO, LungfishWorkflow]
    notes: >-
      Presents variants as a sortable table with CHROM, POS, ID, REF, ALT,
      QUAL, FILTER, GT, and AF columns. Selecting a row centers the genome
      context pane on that coordinate. The Inspector surfaces the full INFO
      and FORMAT payload for the selected record.
  fetch.ncbi:
    title: Download a reference sequence from NCBI
    entry_points:
      - "File > Search Online Databases > Search NCBI…"
      - "CLI: lungfish fetch ncbi"
    inputs: [ncbi-accession]
    outputs: [fasta, genbank, provenance-sidecar]
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/FetchCommand.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseSearchDialog.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/GenBankGenomesSearchPane.swift
      - Sources/LungfishApp/ViewModels/GenomeDownloadViewModel.swift
      - Sources/LungfishApp/Services/DownloadCenter.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewController+OperationBegin.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewModel+NucleotideRowDownload.swift
      - Sources/LungfishCLI/Commands/FetchNCBIBundle.swift
      - Sources/LungfishCLI/Support/FetchNCBIBundleRecord.swift
    module: [LungfishApp, LungfishCLI]
    cli:
      - lungfish-cli fetch ncbi
    tests:
      - Tests/LungfishAppTests/DatabaseBrowserNucleotideRowParityReplayTests.swift
      - Tests/LungfishAppTests/DatabaseBrowserNoProjectDownloadRefusalTests.swift
    notes: >-
      Downloads one or more NCBI records through the CLI or database search UI.
      Saved CLI files write a file-specific Lungfish provenance sidecar with
      the resolved fetch options, endpoint, pseudo-input accession, output
      checksum, size, and command line.
      With a project open, the Database Browser's nucleotide and virus rows
      download by running lungfish-cli fetch ncbi --bundle. The bundle's one
      sequence is named with its version, and the command prints events and no
      result document under --format json. With no project open the download
      shows the No Project Open sheet and starts nothing.
  fetch.sra:
    title: Download FASTQ reads from SRA
    entry_points:
      - "File > Search Online Databases > Search SRA…"
      - "CLI: lungfish fetch sra download"
    inputs: [sra-run-accession]
    outputs: [fastq, fastq.gz, provenance-sidecar]
    viewport_class: none
    sources:
      - Sources/LungfishCLI/Commands/FetchCommand.swift
      - Sources/LungfishCLI/Commands/SRADownloadSubcommand.swift
      - Sources/LungfishCLI/Commands/SRADownloadSubcommand+PreferSource.swift
      - Sources/LungfishCLI/Commands/SRADownloadSubcommand+RunReads.swift
      - Sources/LungfishCore/Services/SRA/SRADownloadSourcePreference.swift
      - Sources/LungfishCore/Services/SRA/SRARunReads.swift
      - Sources/LungfishCore/Services/SRA/SRADownloadMessages.swift
      - Sources/LungfishCore/Services/SRA/SRAFASTQDownloadRoute.swift
      - Sources/LungfishCore/Services/ENA/ENAFASTQDownloadValidator.swift
      - Sources/LungfishCore/Services/NCBI/SRAService+SourcePreference.swift
      - Sources/LungfishCore/Services/NCBI/SRAService+ENADownload.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseSearchDialog.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/SRARunsSearchPane.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/SRADownloadSourcePicker.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/SRAWindowRunDownload.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewModel+SRAWindowDownload.swift
      - Sources/LungfishApp/Views/FASTQ/FASTQImportConfigSheet.swift
      - Sources/LungfishApp/Services/DownloadCenter.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewController+OperationBegin.swift
      - Sources/LungfishWorkflow/Provenance/SRAWindowImportProvenance.swift
      - Sources/LungfishCore/Services/SRA/SRADownloadProvenanceValues.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceRecorder+FileRecords.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceRecorder+SidecarLookup.swift
      - Sources/LungfishWorkflow/Provenance/ProvenanceWriter.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/DatabaseBrowserViewModel+SRARowDownload.swift
      - Sources/LungfishCLI/Commands/SRADownloadBundle.swift
      - Sources/LungfishCLI/Commands/SRADownloadReporter.swift
      - Sources/LungfishCLI/Commands/SRADownloadRequest.swift
      - Sources/LungfishApp/Views/DatabaseBrowser/SRADownloadPreparation.swift
    module: [LungfishApp, LungfishCLI, LungfishCore, LungfishWorkflow]
    cli:
      - lungfish-cli fetch sra download
    tests:
      - Tests/LungfishCoreTests/Services/SRADownloadChecksTests.swift
      - Tests/LungfishCLITests/SRADownloadRunChecksTests.swift
      - Tests/LungfishAppTests/SRADownloadSurfaceParityTests.swift
      - Tests/LungfishAppTests/DatabaseBrowserSRARowParityReplayTests.swift
      - Tests/LungfishAppTests/DatabaseBrowserSRARowSigningReplayTests.swift
      - Tests/LungfishAppTests/DatabaseBrowserNoProjectDownloadRefusalTests.swift
      - Tests/LungfishAppTests/SRADownloadPreparationTests.swift
      - Tests/LungfishAppTests/SRADownloadPreparationOutageLineTests.swift
      - Tests/LungfishAppTests/SRADownloadPreparationBrowserCancelTests.swift
    notes: >-
      Downloads SRA reads from ENA with an SRA Toolkit fallback, or from the
      SRA Toolkit first with an ENA fallback when the SRA window's "Download
      source" setting is Prefer NCBI or the CLI gets --prefer-source ncbi.
      --use-toolkit fetches with the toolkit only. fasterq-dump runs with
      --split-3, so reads without a mate land in <run>.fastq and import as
      unpaired reads. Every ENA file is checked against the size and MD5 ENA
      lists, and only ENA's record of the run asked for counts. A failed
      check, an ENA listing of one mate of a paired run, or a record of
      another run sends the whole run to the SRA Toolkit. A lone mate 1 of a
      run ENA or NCBI lists as paired fails the run, and a run listed as
      paired that arrives as one file imports as single-end reads with a
      layoutWarning. fetch sra download takes one run accession. The window
      and the CLI share these checks in LungfishCore and record the same
      provenance, fallback line and one-line failure reasons. Records the
      downloader, preferredSource, options, produced FASTQ files, checksums,
      sizes, and runtime details in the output directory provenance sidecar.
      With a project open, the Database Browser's SRA rows download by
      running lungfish-cli fetch sra download --bundle, and the run's record
      names the workflow sra-fastq-download-bundle with lungfish-cli as its
      tool. Under --format json the command prints events and no result
      document. With no project open the download shows the No Project Open
      sheet and starts nothing. Before the import settings open, the window
      looks up the run's metadata. Cancel in the Database Browser during that
      lookup, or the row's Cancel in the Operations Panel, ends the row
      Cancelled, stops the lookup and opens no settings. When ENA and NCBI
      both fail, the settings still open and the row's log says why in one
      sentence.
  map:
    title: Map reads to a reference
    entry_points:
      - "Tools > Mapping…"
      - "CLI: lungfish map"
      - "CLI: lungfish bam adopt-mapping"
      - "Inspector > Document > Run Settings"
    inputs: [fastq, fasta, reference-bundle]
    outputs: [bam, bai, mapping-result, alignment-track, mapping-provenance]
    viewport_class: alignment
    sources:
      - Sources/LungfishCLI/Commands/MapCommand.swift
      - Sources/LungfishCLI/Commands/BAMAdoptMappingSubcommand.swift
      - Sources/LungfishApp/Views/Mapping/MappingWizardSheet.swift
      - Sources/LungfishApp/App/AppDelegate+ToolsMenuOperationBegin.swift
      - Sources/LungfishWorkflow/Mapping/MappingViewerBundlePreparer.swift
      - Sources/LungfishWorkflow/Mapping/MappingViewerBundlePublicationService.swift
      - Sources/LungfishWorkflow/Mapping/ManagedMappingPipeline.swift
      - Sources/LungfishWorkflow/Mapping/MappingInputResolver.swift
      - Sources/LungfishWorkflow/Mapping/MappingResult.swift
      - Sources/LungfishWorkflow/Mapping/MappingProvenance.swift
      - Sources/LungfishWorkflow/Mapping/MappingProvenance+TrackRecord.swift
      - Sources/LungfishApp/Services/CLIReadsRunner.swift
      - Sources/LungfishApp/App/AppDelegate+ManagedMapping.swift
      - Sources/LungfishCLI/Commands/MapCommand+Events.swift
      - Sources/LungfishWorkflow/Mapping/MappingSummaryBuilder.swift
      - Sources/LungfishApp/Views/Results/Reference/MappingReferenceCountText.swift
      - Sources/LungfishApp/Views/Inspector/MappingDocumentStateBuilder.swift
      - Sources/LungfishApp/Views/Inspector/Sections/MappingDocumentSection.swift
      - Sources/LungfishApp/Views/Inspector/Sections/MappingDocumentStepRow.swift
      - Sources/LungfishApp/Views/Inspector/InspectorStepCopyText.swift
    module: [LungfishWorkflow, LungfishCLI, LungfishApp]
    cli:
      - lungfish-cli map
      - lungfish-cli bam adopt-mapping
    operation_type: mapping
    provenance: MappingProvenance (mapping-provenance.json in the mapping output directory, and <bam stem>.mapping-provenance.json beside each BAM that bam adopt-mapping attaches)
    tests:
      - Tests/LungfishWorkflowTests/Mapping/MappingProvenanceTests.swift
      - Tests/LungfishIntegrationTests/BAMAdoptMappingTrackRecordTests.swift
      - Tests/LungfishWorkflowTests/Mapping/ManagedMappingPipelineTests.swift
      - Tests/LungfishCLITests/MapCommandTests.swift
      - Tests/LungfishAppTests/MappingRouteParityReplayTests.swift
      - Tests/LungfishAppTests/MappingRouteSigningReplayTests.swift
      - Tests/LungfishAppTests/MappingRoutePrivateProjectReplayTests.swift
      - Tests/LungfishAppTests/ReadsLaunchCommandTests.swift
      - Tests/LungfishWorkflowTests/Mapping/MappingResultTests.swift
      - Tests/LungfishAppViewTests/MappingReferenceCountTextTests.swift
      - Tests/LungfishAppTests/MappingDocumentStateBuilderTests.swift
      - Tests/LungfishAppTests/MappingDocumentStepRowTests.swift
    notes: >-
      Runs minimap2 or the selected mapper, normalizes the resulting BAM, writes
      a mapping-result sidecar, and can attach the mapping outputs to a
      reference bundle with `lungfish bam adopt-mapping`.
      Each track that adopt-mapping attaches keeps its own mapping record,
      <bam stem>.mapping-provenance.json beside its BAM, so a second adopt no
      longer overwrites the first, and a bundle made by an earlier release
      keeps its one shared record. A failed adopt-mapping returns the BAM and
      its index to the mapping folder and removes only the files that it made.
      Mapping records list the samtools coverage and samtools view passes that
      made the summary rows, and an exported script names them in a comment
      and does not run them.
      Map Reads runs lungfish-cli map, and a Map Reads onto a reference bundle
      in a project spelled under /private publishes the reference viewer. With
      --format json the command prints CLIEvent lines in
      place of the r5-map-report document, so a script reads the complete
      line.
      A new result lists only the reference sequences that have alignments and
      records how many the reference holds and how many it left out. When it
      left some out, the summary bar above the list says how many have
      alignments, for example 94 of 905,628. Results made by earlier versions
      show as before.
      On the Inspector's Document tab, Run Settings lists each recorded command
      as a step that expands to its whole command. Copy Step, Copy Command and
      Copy All Steps copy steps as plain text from a step's copy button, its
      context menu, its VoiceOver actions or Command-C.
  variants.call:
    title: Call variants from a bundle alignment track
    entry_points:
      - "Tools > Variant Calling > Call Variants…"
      - "Inspector > Analysis > Call Variants…"
      - "CLI: lungfish variants call"
    inputs: [reference-bundle, bundle-alignment-track]
    outputs: [vcf.gz, tbi, variant-track, variant-sqlite-db]
    viewport_class: variant
    sources:
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogState.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingDialogPresenter.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingCatalog.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingEligibility.swift
      - Sources/LungfishApp/Views/BAM/BAMVariantCallingToolPanes.swift
      - Sources/LungfishApp/Views/Inspector/InspectorViewController+VariantWorkflow.swift
      - Sources/LungfishApp/Services/CLIVariantCallingRunner.swift
      - Sources/LungfishWorkflow/Variants/ViralVariantCallingPipeline.swift
      - Sources/LungfishWorkflow/Variants/BAMVariantCallingPreflight.swift
      - Sources/LungfishWorkflow/Variants/BundleVariantCallingModels.swift
      - Sources/LungfishWorkflow/Variants/BundleVariantTrackAttachmentService.swift
      - Sources/LungfishWorkflow/Variants/VariantSQLiteImportCoordinator.swift
      - Sources/LungfishCLI/Commands/VariantsCommand.swift
      - Sources/LungfishCLI/Commands/VariantsCommand+Call.swift
      - Sources/LungfishCLI/Commands/VariantsCommand+CallGATK.swift
    module: [LungfishApp, LungfishWorkflow, LungfishCLI]
    cli:
      - lungfish-cli variants call
    operation_type: variantCalling
    provenance: variants/<basename>.lungfish-provenance.json in the reference bundle (BundleVariantTrackAttachmentService), and variants/gatk/<track id>.gatk-run.lungfish-provenance.json for a GATK call
    tests:
      - Tests/LungfishWorkflowTests/Variants/ViralVariantCallingPipelineTests.swift
      - Tests/LungfishWorkflowTests/Variants/BAMVariantCallingPreflightTests.swift
      - Tests/LungfishWorkflowTests/Variants/BundleVariantTrackAttachmentServiceTests.swift
      - Tests/LungfishCLITests/VariantsCommandTests.swift
      - Tests/LungfishAppTests/GATKVariantCallingCLIGUIParityReplayTests.swift
    notes: >-
      Runs LoFreq, iVar, Medaka, or bcftools against a bundle-owned BAM alignment
      track, normalizes the resulting VCF, imports it into the bundle
      SQLite variant store, and attaches a new variant track. The iVar
      caller requires the user to confirm the BAM was primer-trimmed; the
      Medaka caller requires an ONT basecaller model identifier. The
      bcftools caller runs `mpileup` into `call` and records both native
      tool stages in provenance.
      The GATK caller (--caller gatk) runs GATK HaplotypeCaller and attaches
      the VCF as a variant track under variants/gatk/ as <track id>.vcf.gz
      with its .tbi, the track database and a
      <track id>.gatk-run.lungfish-provenance.json. Its
      own options are --emit-ref-confidence, --ploidy, --intervals,
      --pcr-indel-model, --stand-call-conf, --max-alternate-alleles and
      --pair-hmm-threads. Every variants call caller stops on SIGTERM,
      records the cancel under provenance/cancelled as
      lungfish-variants-call-<id>.lungfish-provenance.json and exits 125.
      The Call Variants dialog's GATK row runs variants call --caller gatk,
      and its attach record names that command. A later GATK run in a
      bundle writes the run record of its own track and leaves the records
      of the other tracks, and a bundle made by an earlier release keeps
      its one shared record.
  bam.primer-trim:
    title: Primer-trim a BAM with iVar
    entry_points:
      - "Inspector > Analysis > Primer-trim BAM…"
      - "CLI: lungfish bam primer-trim"
    inputs: [reference-bundle, bundle-alignment-track, lungfishprimers]
    outputs: [bam, bai, alignment-track, primer-trim-provenance]
    viewport_class: alignment
    sources:
