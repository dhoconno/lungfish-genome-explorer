    module: [LungfishApp, LungfishCLI, LungfishIO, LungfishWorkflow]
    cli:
      - lungfish-cli fastq ingest
      - lungfish-cli fastq import-ont
    tests:
      - Tests/LungfishAppTests/FASTQImportSheetDetectionTests.swift
      - Tests/LungfishAppTests/CLIImportRunnerTranscriptTests.swift
      - Tests/LungfishWorkflowTests/Ingestion/FASTQBatchImporterSameBatchTests.swift
      - Tests/LungfishWorkflowTests/Ingestion/FASTQBatchImporterFolderPairsTests.swift
      - Tests/LungfishCLITests/ImportFastqFolderPairsTests.swift
      - Tests/LungfishCLITests/ImportFastqTextOutputPinTests.swift
      - Tests/LungfishCLITests/FastqIngestInPlacePinTests.swift
      - Tests/LungfishCLITests/FastqImportONTEventsTests.swift
      - Tests/LungfishAppTests/FastqIngestRouteSigningReplayTests.swift
    notes: >-
      Batch-imports paired-end or single-end FASTQ at any size with virtual
      previews that keep the UI responsive while operations run on the full
      file. The platform is inferred per sample from the read headers, or a
      BAM's @RG PL, DS and @PG lines, and the sheet shows the evidence under
      its summary. An untouched Platform popup imports with --platform auto,
      and the sidecar's platformAssignment keeps the source, evidence and
      confidence. The sheet, explicit files and --recursive group files by one
      detection. A mate pairs inside its own folder first, and across folders
      only when no other file of the import has either name, else a warning
      names the files. A lone file keeps its whole name. An SRA run's _1, _2 and third file import as one
      bundle once the third-file check passes. --force never replaces a bundle
      an earlier sample of the same import wrote, and no sample writes a
      bundle an earlier sample failed to write. A file that holds pairs beside
      single reads records single_end with its read roles, and the Inspector's
      Pairing row names it "Pairs and single reads" with the counts.
      A FASTQ file copied into a project is ingested in place by running
      lungfish-cli fastq ingest --delete-originals --format json, which
      removes the original last. The ONT import of a run folder runs
      lungfish-cli fastq import-ont --format json.
