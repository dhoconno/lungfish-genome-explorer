  workflow.snakemake:
    title: Run Snakemake workflows
    entry_points:
      - "Tools > Operations > Workflows"
      - "CLI: lungfish workflow run"
    inputs: [snakemake-workflow]
    outputs: [workflow-run-bundle, project-datasets]
    viewport_class: none
    sources:
      - Sources/LungfishWorkflow/WorkflowRunner.swift
      - Sources/LungfishWorkflow/WorkflowDefinition.swift
      - Sources/LungfishCLI/Commands/WorkflowCommand.swift
    notes: >-
      Runs Snakemake workflows from inside the app with outputs auto-imported as
      project datasets.
  workflow.export:
    title: Export as Nextflow or Snakemake
    entry_points:
      - "File > Export > Nextflow Pipeline"
      - "File > Export > Snakemake Workflow"
    inputs: [workflow-graph, project-history]
    outputs: [nextflow-pipeline, snakemake-workflow]
    viewport_class: none
    sources:
      - Sources/LungfishApp/App/MainMenu.swift
      - Sources/LungfishApp/App/AppDelegate+ImportExport.swift
      - Sources/LungfishWorkflow/ApplicationExports
    notes: >-
      Exports the current operation history or builder graph as a runnable
      Nextflow pipeline or Snakemake workflow.

  # --- Provenance, project, and infrastructure ---
  provenance.export:
    title: Provenance reports and verification
    entry_points:
      - "File > Export > Methods Section"
