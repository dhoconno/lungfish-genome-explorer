      - Tests/LungfishEsVirituUITests/EsVirituResultViewControllerSmokeTests.swift
      - Tests/LungfishAppTests/ClassifierCLIRouteRowTests.swift
      - Tests/LungfishAppTests/ClassifierLaunchRouteTests.swift
      - Tests/LungfishAppTests/ClassifierNoProjectRefusalTests.swift
      - Tests/LungfishAppTests/ClassifierCLIGUIParityReplayTests.swift
    notes: >-
      Runs EsViritu viral metagenomics detection and presents per-sample viral
      assemblies with coverage sparklines and segment completeness. Since 2.7
      (E10) the Tools menu launch runs `lungfish-cli esviritu detect` with
      --project and --format json, and --batch for several samples, and shows
      the command's events in a row with the title, labels and end of run the
      in-process route had. A batch row records that command and offers Copy
      CLI Command. The in-process route and its hidden keys went in 2.9 (E14),
      so every launch takes this one. A launch with no project open shows the
      No Project Open sheet and runs nothing (L1).
      A run that is killed with exit 137 reads EsViritu was stopped before
      it finished, most likely because the Mac ran out of memory, with the
      tail of the standard error as the detail.
