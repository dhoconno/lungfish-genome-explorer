      - Tests/LungfishCLITests/BundleMergeSIGTERMTests.swift
      - Tests/LungfishAppTests/ReferenceBundleMergeRecordConformanceTests.swift
    notes: >-
      lungfish-cli bundle merge merges two or more reference bundles into one
      new bundle, with events on --format json. The sidebar's Merge Into New
      Bundle… for reference bundles runs it, so Cancel stops the merge before
      it publishes, the bundle appears under its name in one step, and the
