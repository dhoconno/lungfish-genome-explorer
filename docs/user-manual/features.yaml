      - Tests/LungfishWorkflowTests/DemultiplexFailedRunLeavesNoBundleTests.swift
    notes: >-
      Demultiplexes reads by internal barcode kit with multi-step support,
      singleton handling, platform-aware adapters, and a barcode scout preview.
      Interleaved pairs are demultiplexed by fragment. Both mates go to the
      barcode their calls agree on, or to the barcode of the one mate that
      carries one, and a pair whose mates carry different barcodes goes to
      unassigned whole. demux-manifest.json records the mate calls under
      mateCalls. Trim Barcodes off (--no-trim) keeps every read whole, virtual
      bundles included. A run stages its bundles in a hidden folder and
      publishes them only when it finishes, and --replace refuses before it
      touches the earlier output and keeps that output until the new bundles
      are in place.
