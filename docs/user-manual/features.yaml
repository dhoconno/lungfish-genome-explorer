    viewport_class: none
    sources:
      - Sources/LungfishApp/App/ProvenanceExportMenuModel.swift
      - Sources/LungfishApp/App/AppDelegate+ImportExport.swift
      - Sources/LungfishApp/App/AppProvenanceExportSourceResolver.swift
