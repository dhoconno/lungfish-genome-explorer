      - Tests/LungfishAppTests/AppProvenanceExportSourceResolverTests.swift
    notes: >-
      Nextflow Pipeline… and Snakemake Workflow… are two of the six
      ProvenanceExportMenuModel items, and they run the same export as the
      other four on the provenance record of the current viewer or sidebar
      selection, with the upstream records it chains to. No workflow builder
      graph exists. ProvenanceExportPlan turns the recorded steps into a plan,
      WorkflowExportGraph gives each file one producer and drops a step's own
      inputs from its outputs, and ProvenanceExporter.exportBundle writes
      main.nf, nextflow.config and containers/manifest.json, or a Snakefile,
      config.yaml and one envs/<tool>.yaml conda file per managed tool, into
      the folder the save panel names. The folder also gets a provenance
      folder with copies of the source records and a record of the export.

