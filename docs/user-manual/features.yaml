    operation_type: ingestion
    tests:
      - Tests/LungfishAppTests/RNASeqPseudobulkDialogTests.swift
      - Tests/LungfishAppTests/RNASeqPseudobulkDialogStateTests.swift
      - Tests/LungfishKitTests/CLIViewerExportRunnerTests.swift
      - Tests/LungfishCLITests/RNASeqCellMapImportRefusalTests.swift
      - Tests/LungfishAppViewTests/ToolsMenuStructureTests.swift
    notes: >-
      The third new tool of the RNA-seq category. It takes one single-cell
      result and the files that a person's own tool made, which are LGE's
      table or 10x's projection and clusters files, picked with an open
      panel. It writes a cell map beside the result with the embedding and
      the cell labels, under a name the person gives. The folder name gets
      the .lungfishrnaseq extension once. One run is lungfish-cli rnaseq
      cell-map import with --format json, and the Operations row records the
      command that runs. The row shows Reading each file, Checking barcodes
      against the result and Writing as the command works. The command
      refuses barcodes that do not match, barcodes the result does not hold
      and counts of another route, and the pane has one control that
      unlocks each. A refusal names that control and keeps the command's
      counts, and the row keeps the command's own words. Barcodes and cells
      left out read as information and the row still ends Completed. A run
      that states other counts ends Completed with Warnings, because the
      command keeps that note as a warning. The row
      reads Completed only when the app can read the new cell map, and the
      app then opens it. A cancel ends the command and leaves no folder and
      no stage.
  import.rnaseq-counts:
    title: Import RNA-seq counts
    entry_points:
      - "Import Center > Sequencing Reads > Existing Bulk RNA-seq Counts"
      - "Import Center > Sequencing Reads > Existing Single-cell Counts"
      - "CLI: lungfish-cli import rnaseq"
    inputs: [salmon-quant-folder, rnaseq-count-table, cellranger-outs-folder, starsolo-folder]
    outputs: [rnaseq-result]
    viewport_class: none
    sources:
