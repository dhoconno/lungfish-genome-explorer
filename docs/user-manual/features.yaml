      - Sources/LungfishWorkflow/Primers/BAMPrimerTrimPipeline.swift
      - Sources/LungfishWorkflow/Primers/BAMPrimerTrimRequest.swift
      - Sources/LungfishWorkflow/Primers/BAMPrimerTrimResult.swift
      - Sources/LungfishWorkflow/Primers/BAMPrimerTrimProvenance.swift
      - Sources/LungfishWorkflow/Primers/PrimerSchemeResolver.swift
      - Sources/LungfishWorkflow/Primers/PrimerTrimProvenanceLoader.swift
      - Sources/LungfishIO/Bundles/PrimerSchemeBundle.swift
      - Sources/LungfishIO/Bundles/PrimerSchemesFolder.swift
      - Sources/LungfishCLI/Commands/BAMCommand.swift
      - Sources/LungfishCLI/Commands/BAMPrimerTrimSubcommand.swift
    module: [LungfishApp, LungfishWorkflow, LungfishIO, LungfishCLI]
    cli:
      - lungfish-cli bam primer-trim
    operation_type: bamPrimerTrim
    provenance: BAMPrimerTrimProvenance (JSON sidecar next to the output BAM)
    tests:
      - Tests/LungfishWorkflowTests/Primers/BAMPrimerTrimPipelineTests.swift
      - Tests/LungfishWorkflowTests/Primers/BAMPrimerTrimProvenanceTests.swift
      - Tests/LungfishCLITests/BAMPrimerTrimSubcommandTests.swift
      - Tests/LungfishAppTests/PrimerTrim/BAMPrimerTrimDialogStateTests.swift
    notes: >-
      Runs `ivar trim` against a bundle-owned BAM alignment track using a
      .lungfishprimers scheme bundle, sorts and indexes the result, and
      attaches a new primer-trimmed alignment track to the bundle with
      provenance JSON capturing resolved options, command line, runtime
      identity, input and output file records, per-step commands, exit status,
      stderr when available, checksums, sizes, and wall time.
      A cancel (SIGTERM) stops the command, records the run as cancelled and
      exits 125.

  # --- Sequences (sequence viewport) ---
  import.sequence:
    title: Import a reference sequence
    entry_points:
      - "Import Center > Reference"
      - "CLI: lungfish import reference"
    inputs: [fasta, genbank, 2bit, gff3, gtf, bed]
    outputs: [lungfishref]
    viewport_class: sequence
    sources:
      - Sources/LungfishCLI/Commands/ImportCommand+FASTA.swift
      - Sources/LungfishApp/App/GenBankSynchronousParser.swift
      - Sources/LungfishApp/App/AppDelegate+ImportCenterOperationBegin.swift
      - Sources/LungfishCLI/Commands/ImportCommand.swift
      - Sources/LungfishCLI/Commands/BundleCommand.swift
      - Sources/LungfishCLI/Commands/BundleCreateSubcommand.swift
      - Sources/LungfishCore/Bundles/BundleManifest.swift
      - Sources/LungfishApp/Views/MainWindow/MainSplitViewController+ReferenceDrop.swift
      - Sources/LungfishApp/Services/CLIReferenceBundleWrapper.swift
    module: [LungfishApp, LungfishCLI, LungfishCore]
    notes: >-
      Imports a standalone FASTA, GenBank, or 2bit sequence plus optional
      GFF3, GTF, or BED annotations as an indexed .lungfishref bundle with a
      .fai index for random access.
      A standalone reference dropped on the sidebar imports through
      lungfish-cli import fasta, so its row shows the command and can be
      cancelled. A FASTA that a FASTQ operation writes is wrapped by the
      same command, which the bundle's record names, and the operation's
      Cancel stops the wrap. The wrap has no row of its own. import fasta
      --bundle-dir names the folder to build in, and giving it with
      --output-dir is refused at parse with exit 64.
  sequence.extract-region-bundle:
    title: Extract a region to a new reference bundle
    entry_points:
      - "Extract Sequence… on a selected region in a reference bundle viewer"
      - "CLI: lungfish extract sequence --bundle"
    inputs: [reference-bundle]
    outputs: [lungfishref]
    viewport_class: sequence
    sources:
      - Sources/LungfishCLI/Commands/ExtractCommand.swift
      - Sources/LungfishCLI/Commands/ExtractSequenceSubcommand+Bundle.swift
      - Sources/LungfishWorkflow/Extraction/SequenceExtractionPipeline.swift
      - Sources/LungfishWorkflow/Extraction/SequenceExtractionBundleBuilder.swift
      - Sources/LungfishWorkflow/Extraction/SequenceExtractionBundleBuilder+Tracks.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+Extraction.swift
      - Sources/LungfishApp/Views/Viewer/ViewerViewController+BundleDisplayOperationBegin.swift
      - Sources/LungfishApp/Services/CLIBundleBuildRunner.swift
    module: [LungfishApp, LungfishCLI, LungfishWorkflow]
    cli:
      - lungfish-cli extract sequence
    tests:
      - Tests/LungfishAppTests/RegionBundleExtractionParityReplayTests.swift
      - Tests/LungfishAppTests/RegionExtractionWithoutBundleParityReplayTests.swift
    notes: >-
      Extracting a region to a new bundle from a viewer that shows a reference
      bundle runs lungfish-cli extract sequence --bundle. Its row in the
      Operations panel records the command, which Copy CLI Command copies, and
      Cancel stops it before it publishes anything. A viewer that shows a
      document with no reference bundle runs lungfish-cli extract sequence
      <fasta> <region> -o <name>.lungfishref --source-document, so its row
      also shows the command and Cancel stops it. A bundle extracted from a
      GenBank file keeps no annotations, as before, and its record says so.
      Each such extraction that finishes or is cancelled keeps its staged
      FASTA under the project's .tmp folder, or under the system temporary
      folder when no project is in reach, so that its record stays true. A
      failed extraction removes it. A region extracted with only spaces
      typed as its bundle name is saved as extracted_sequence. Two
      extractions given the same bundle name at the same time keep both
      bundles, and with --next-free-name the one that finishes second is
      saved under the next free name, such as Name_1.
      extract sequence --bundle never writes over its input. An -o that is the
      source bundle, lies inside it or holds it is refused with exit status 3,
      and the bundle options (--name, --samples, --no-samples, --feature-name,
      --feature-type, --strand, --concatenate-exons and --next-free-name) are
      refused without --bundle.
  bundle.merge:
    title: Merge reference bundles into a new bundle
    entry_points:
      - "Merge into New Bundle for two or more reference bundles selected in the sidebar"
      - "CLI: lungfish bundle merge"
    inputs: [lungfishref]
    outputs: [lungfishref]
    viewport_class: sequence
    sources:
      - Sources/LungfishCLI/Commands/BundleMergeSubcommand.swift
      - Sources/LungfishApp/Services/ReferenceBundleMergeRoute.swift
      - Sources/LungfishApp/Views/Sidebar/SidebarViewController+MenuDelegate.swift
      - Sources/LungfishWorkflow/Bundles/ReferenceBundleMergeService.swift
      - Sources/LungfishWorkflow/Bundles/ReferenceBundleMergeService+Provenance.swift
      - Sources/LungfishWorkflow/Bundles/ReferenceBundleMergeService+Sources.swift
    module: [LungfishApp, LungfishCLI, LungfishWorkflow]
    cli:
      - lungfish-cli bundle merge
    tests:
