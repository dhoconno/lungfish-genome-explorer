# B01: Your first project. The first video of the learner track.
# This file is the whole recipe (README, "The video spec").
# Render: python3 screencasts/render.py screencasts/B01-first-project/video.yaml

slug: B01-first-project
title: Your first project
track: beginners
purpose: >-
  A learner who has just installed LGE opens a demo project of real human sequencing data and
  learns the four places they will use every day. The sidebar holds the project's contents, the
  viewer and Inspector show the selected item, results land under Analyses, and the Operations
  panel lists every task the app runs.
audience: Undergraduate biology students and bench scientists new to bioinformatics.
manual: 01-foundations/06-the-lungfish-project
demo: human-mapping-and-variants-results

filmed_with:
  app: Lungfish
  versions: ["2026.9.72"]
  date: 2026-10-01

narration:
  engine: say
  voice: Ava (Premium)
  words_per_minute: 145
  lead: 0.5          # silence at the start of each narrated beat, after its zoom lands
  tail: 0.6          # silence after the last word before the next beat
  lexicon:           # spoken forms, so every remake says these terms the same way
    HG002: H G zero zero two
    minimap2: mini map two
    FASTQ: fast Q
    LGE: L G E

setup:
  window_points: [1440, 810]
  projects:
    - name: Human Mapping and Variants (with results).lungfish
      from: Downloaded on camera with Help > Demo Projects (Stable, right after B00) into the default LGE Demo Projects folder. Delete any earlier copy first so the button reads Download & Open.
  notes:
    - Start with no project open and the Inspector visible.
    - Crop out the Save to row in the Demo Projects panel, which shows the owner's home folder.

honesty:
  - Downloading a demo project needs a network connection. The video cuts over the download wait and does not imply it is instant.
  - The results in this project were made in advance. Say so rather than implying they appear on opening.

outputs: [wide]
trim_top: 52
window_points: [1440, 810]

beats:
  - {kind: card, id: title, duration: 3.0, icon: true, title: Your first project, sub: Lungfish Genome Explorer for
      beginners, shows: Title card naming the video and the learner track., transition: fade}

  - kind: take
    id: demo
    take: takes-stable/demo.mov
    duration: 13.0
    caption: Start from a demo project with real data
    kicker: Help · Demo Projects
    shows: Help > Demo Projects lists projects of real public data. Human Mapping and Variants (with results) is selected
      and Download & Open clicked.
    capture: Attended. Move any earlier copy of the project to the Trash first. Open Help > Demo Projects (a sheet
      on the front window), record that window with wincap --app-region, scroll to Human Mapping and Variants (with
      results) and press its Download & Open button. The crop leaves out the Save to row, which shows the owner's
      home folder.
    narration: Choose Help, then Demo Projects. Each one holds real public data. Find Human Mapping and Variants,
      with results, and click Download and Open. You need an internet connection.
    verify: [The project title and button label match the panel.]
    crop: [0.237, 0.27, 0.526, 0.6]
    highlights:
    - at: 2.4
      until: 5.5
      regions:
      - [0.02, 0.035, 0.33, 0.05]
      - [0.785, 0.035, 0.2, 0.065]
    in: 0.3

  - kind: take
    id: sidebar
    take: takes-stable/project.mov
    duration: 12.0
    caption: The sidebar lists everything in the project
    kicker: Sidebar · Imports · Reference Sequences · Analyses
    shows: The opened project's sidebar with its Imports, Reference Sequences and Analyses folders.
    capture: 'Record the opened project window (resized to 1440x810) with nothing selected. drive/project-steps.md
      lists the clicks: hold 14 s, click HG002 under Imports, hold, click the minimap2 result.'
    narration: A project is one folder on your Mac. The sidebar on the left shows what is inside. Imports holds the
      reads, short pieces of DNA read by a sequencer.
    verify: [The sidebar group names match the narration.]
    in: 2.0
    zoom:
      at: 1.0
      dur: 0.9
      region: [0.0, 0.02, 0.36, 0.36]
    highlights:
    - at: 6.5
      region: [0.012, 0.14, 0.235, 0.06]

  - kind: take
    id: inspector
    take: takes-stable/project.mov
    duration: 13.0
    caption: Select an item to see its details
    kicker: HG002 reads · Inspector
    shows: Selecting the HG002 reads opens the read summary in the viewer, and the Inspector on the right describes
      the selected bundle.
    capture: Same take as the sidebar beat, from the click on HG002 under Imports.
    narration: Click HG002 under Imports. These are reads from one anonymous human volunteer. The Inspector on the
      right shows how many reads there are and their quality scores.
    in: 14.5
    zoom:
      at: 5.0
      dur: 0.9
      region: [0.76, 0.12, 0.24, 0.45]
    highlights:
    - at: 6.2
      regions:
      - [0.79, 0.205, 0.2, 0.03]
      - [0.79, 0.45, 0.2, 0.08]

  - kind: take
    id: results
    take: takes-stable/results.mov
    duration: 17.4
    caption: Results appear under Analyses
    kicker: Analyses · minimap2
    shows: The minimap2 result under Analyses opens the reads aligned to the chromosome 20 reference slice.
    capture: Start with HG002 selected. Record the project window, click the minimap2 result, then its contig row,
      then run drive/results-focus.json with axdrive (Focus, then position chr20_10.0-10.5Mb:2094-2394) so single
      reads are drawn. Stable 2026.9.72 shows full paths under Run Inputs, so they are blurred.
    narration: Results go under Analyses, and these were made in advance. Open the minimap2 result and zoom in. Each
      read sits where it matches the reference, a slice of human chromosome 20.
    zoom:
      at: 12.0
      dur: 0.9
      region: [0.25, 0.08, 0.5, 0.5]
    highlights:
    - at: 13.2
      region: [0.252, 0.37, 0.5, 0.2]
    blur:
    - [0.77, 0.32, 0.23, 0.2]
    segments:
    - [1.5, 6.0]
    - [13.0, 25.9]

  - kind: take
    id: operations
    take: takes-stable/operations.mov
    duration: 10.0
    caption: The Operations Panel lists every task
    kicker: Operations
    shows: The Operations panel lists the demo download that just finished, with its status.
    capture: Record the project window with wincap --app-region and press the Operations toolbar button. On a fresh
      Stable run the panel lists only the demo download. Its second and third lines show the install path, so they
      are blurred.
    narration: Click Operations in the toolbar. The Operations Panel lists every task the app runs, like this download,
      and whether it finished.
    in: 1.5
    crop: [0.293, 0.137, 0.623, 0.84]
    blur:
    - [0.0, 0.125, 0.6, 0.06]
    highlights:
    - at: 0.8
      region: [0.01, 0.1, 0.65, 0.035]
    verify: [The demo download row reads Completed.]

  - kind: card
    id: end
    duration: 6.0
    icon: true
    title: Learn more in the manual
    shows: End card naming the next video and where to watch it, with the version line.
    narration: To learn more about projects, read the manual chapter The Lungfish Project. More videos are on the
      Videos page of the website.
    lines:
    - {text: Chapter · The Lungfish Project}
    - {text: lungfish-genome-explorer.readthedocs.io, style: url}
    - {text: More videos}
    - {text: dhoconno.github.io/lungfish-genome-explorer/videos.html, style: url}
    - {text: '{filmed_with}', style: version}
