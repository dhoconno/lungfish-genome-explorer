# The Videos page (docs/site/videos.qmd) and the video list at the bottom of the home page
# (docs/site/index.qmd, between its videos:begin and videos:end markers) are generated from this
# file and from every video that has a published.yaml. Edit the intros or the section order here,
# then run
#   python3 screencasts/publish.py --page
# A video names its section in its own spec (site.section). Videos in a section are ordered by slug.

title: Videos
intro: >-
  Short videos that show Lungfish Genome Explorer (LGE) at work. Each one names the version it was
  filmed with. The learner videos have a synthetic narrator and on-screen captions. The overview is
  silent, with its captions on screen.
home_intro: >-
  Each video is a few minutes or less and shows LGE itself. Start with the install video, then
  your first project.
sections: [Getting started, Sequences, Reads, Alignments, Overview]
