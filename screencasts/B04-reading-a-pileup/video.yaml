# B04: Reading a pileup. Learner track, after B03.
# This file is the whole recipe (README, "The video spec").
# Render: python3 screencasts/render.py screencasts/B04-reading-a-pileup/video.yaml

slug: B04-reading-a-pileup
title: Reading a pileup
track: beginners
purpose: >-
  A learner opens reads mapped to a reference, reads the coverage curve, zooms in until single reads
  and changed bases show, tells a change on both chromosome copies from a change on one, and finds
  the matching variant calls.
audience: Undergraduate biology students and bench scientists new to bioinformatics.
manual: 04-alignments/02-reading-an-alignment
demo: human-mapping-and-variants-results

site:                # the entry on docs/site/videos.qmd, written by screencasts/publish.py
  section: Alignments
  summary: >-
    Read the coverage curve, zoom in to single reads, and tell a change on both chromosome copies from a change on one.

filmed_with:
  app: Lungfish
  versions: ["2026.9.72"]
  date: 2026-10-01

narration:
  engine: elevenlabs
  model: eleven_v4
  voice_name: Matilda   # ElevenLabs stock voice, chosen 2026-10-02 (VOICES.md)
  voice_id: XrExE9yKIg1WjnnlVkGX
  seed: 4242
  voice_settings: {stability: 0.6, similarity_boost: 0.75, style: 0, speed: 0.95}
  lead: 0.5
  tail: 0.6
  lexicon:
    "HBB": H B B
    "Phred": Fred
    "Length Dist.": Length distribution
    "Q / Position": Q by position
    "HbS": H B S
    ".dmg": dot D M G
    "500 kb slice": 500 kilobase slice
    HG002: H G zero zero two
    minimap2: mini map two
    "0/1": zero slash one
    "1/1": one slash one
    "has A where the reference has G": has an A where the reference has a G
    "most likely carry A": most likely carry an A
    "At 2,162, 28 of 51 reads have T instead of A": At position 2,162, 28 of the 51 reads have a T instead of an A
    "most likely carries T": most likely carries a T
    "where 0 is the reference allele and 1 the alternate": where zero is the reference allele and one the alternate
    LGE: L G E

setup:
  window_points: [1440, 810]
  projects:
    - name: Human Mapping and Variants (with results).lungfish
      from: lungfish-cli demo fetch human-mapping-and-variants-results --dest ~/LGEFilm/demos (Stable 2026.9.72)

honesty:
  - Positions count from the start of the 500 kb slice, not from the start of chromosome 20. Do not call them chromosome positions.
  - Sorting reads by the base at a position does not work in 2026.9.72, so the video does not show it.
  - The variant calls are named, not filmed. The table drawer in 2026.9.72 opens too short to show rows, and resizing it needs a mouse drag. Re-film the calls beat once the drawer can be resized from the keyboard.

outputs: [wide]
trim_top: 52
window_points: [1440, 810]

beats:
  - {kind: card, id: title, duration: 3.0, icon: true, title: Reading a pileup, sub: Lungfish Genome Explorer for
      beginners, shows: Title card., transition: fade}

  - kind: take
    id: orient
    take: ../_shared/takes/demo-orient.mov
    in: 11.0
    duration: 10.0
    caption: Start from Human Mapping and Variants, with results
    kicker: Help · Demo Projects
    crop: [0.335, 0.215, 0.53, 0.72]
    blur:
    - [0.1, 0.107, 0.33, 0.035]
    - [0.308, 0.19, 0.225, 0.03]
    highlights:
    - at: 1.2
      region: [0.025, 0.205, 0.967, 0.226]
    shows: Help > Demo Projects scrolled to Human Mapping and Variants (with results), outlined.
    capture: 'Shared take of Help > Demo Projects on Stable (screencasts/_shared/takes/demo-orient.mov): the top of
      the list for 9 s, then scrolled to Human Mapping and Variants (with results). Nothing is downloaded. The Save
      to path and an update notice from the owner''s own copy are blurred.'
    narration: This video uses the Human Mapping and Variants demo project, the version with results. Choose Help,
      then Demo Projects, and click Download and Open beside it. The video Your first project shows each step.

  - kind: take
    id: coverage
    take: takes/coverage.mov
    duration: 19.0
    caption: Depth counts the reads covering each base
    kicker: Analyses · minimap2 · Focus
    shows: Opening the minimap2 result and Focus shows the coverage curve over the whole 500 kb slice, and a hover
      reads the depth at one point.
    capture: Click the minimap2 result under Analyses, select the chr20 row, click Focus. The overview shows the coverage
      curve with its max and mean depth.
    narration: A pileup shows aligned reads stacked at their positions on the reference. Under Analyses, open the
      minimap2 result. minimap2 is the read aligner that placed each read. Select its row and click Focus. The curve
      shows read depth, the number of reads covering each base. Here the mean depth is about 45.
    segments:
    - [0.5, 4.5]
    - [14.5, 29.5]
    zoom:
      at: 9.0
      dur: 0.9
      region: [0.28, 0.08, 0.5, 0.35]
    highlights:
    - at: 10.2
      region: [0.39, 0.262, 0.375, 0.078]
  - {kind: take, id: reads, take: takes/reads.mov, duration: 12.0, caption: 'Each bar is one read, differences in
      color', kicker: 'Position field · 2,050 to 2,350', shows: 'Typing a 300 base range in the position field draws
      each read as a bar, with matching bases plain and different bases in colour.', capture: 'Set the position field
      to chr20_10.0-10.5Mb:2050-2350 and confirm (drive/reads.json with axdrive; typing and Return in the background
      does not navigate).', narration: 'Type positions 2,050 to 2,350 into the position field above the viewer and
      press Return. Each read is now a bar. Bases that match the reference are drawn plain, and bases that differ
      are colored. A colored base in one read is usually a sequencing error. A column where many reads differ is a
      likely variant.', in: 0.5}

  - kind: take
    id: both
    take: takes/reads.mov
    duration: 10.0
    caption: All reads show A, so both alleles do
    kicker: Position 2,078 · homozygous alternate · 1/1
    shows: The column at 2,078 where every read has A instead of G, outlined.
    capture: Same take, held, with the 2,078 column outlined.
    narration: Most human chromosomes come in two copies, one from each parent, and the version of a base on each
      copy is an allele. At position 2,078 of this slice, every read has A where the reference has G, so both copies
      most likely carry A. This is homozygous alternate, written 1/1.
    in: 10.0
    zoom:
      at: 0.0
      dur: 0.6
      region: [0.28, 0.3, 0.5, 0.6]
    highlights:
    - at: 0.9
      region: [0.419, 0.364, 0.012, 0.52]

  - kind: take
    id: one
    take: takes/reads.mov
    duration: 9.0
    caption: About half show T, so one allele does
    kicker: Position 2,162 · heterozygous · 0/1
    shows: The column at 2,162 where about half the reads have T instead of A, outlined.
    capture: Same take, held, with the 2,162 column outlined.
    narration: At 2,162, 28 of 51 reads have T instead of A, so one copy most likely carries T and the other the reference
      A. This is heterozygous, written 0/1, where 0 is the reference allele and 1 the alternate. The Variants tab
      below the viewer lists the variants a variant-calling program found, with their genotypes.
    in: 18.0
    zoom:
      at: 0.0
      dur: 0.3
      region: [0.28, 0.3, 0.5, 0.6]
    highlights:
    - at: 0.6
      region: [0.5222, 0.364, 0.012, 0.52]

  - kind: card
    id: end
    duration: 6.0
    icon: true
    title: More videos and the manual
    shows: End card pointing to the manual chapter and the Videos page, with the version line.
    narration: To learn more, read the manual chapter Reading an Alignment. More videos are on the Videos page of
      the website.
    lines:
    - {text: Chapter · Reading an Alignment}
    - {text: lungfish-genome-explorer.readthedocs.io, style: url}
    - {text: More videos}
    - {text: dhoconno.github.io/lungfish-genome-explorer/videos.html, style: url}
    - {text: '{filmed_with}', style: version}
