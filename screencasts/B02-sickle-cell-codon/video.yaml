# B02: Find the sickle cell codon. Learner track, after B01.
# This file is the whole recipe (README, "The video spec").
# Render: python3 screencasts/render.py screencasts/B02-sickle-cell-codon/video.yaml

slug: B02-sickle-cell-codon
title: Find the sickle cell codon
track: beginners
purpose: >-
  A learner opens a real human gene record, jumps to one codon by its position, sees the DNA
  shown as amino acids, learns that one changed base there causes sickle cell disease,
  and marks the codon with an annotation.
audience: Undergraduate biology students and bench scientists new to bioinformatics.
manual: 02-sequences/01-importing-and-viewing
demo: genes-and-sequences
next: B03-run-quality

site:                # the entry on docs/site/videos.qmd, written by screencasts/publish.py
  summary: >-
    Open the human beta-globin record, go to one codon by its position, read its amino acid and see the single base change behind sickle cell disease.

filmed_with:
  app: Lungfish
  versions: ["2026.9.72"]
  date: 2026-10-01

narration:
  engine: elevenlabs
  model: eleven_v4
  voice_name: Matilda   # ElevenLabs stock voice, chosen 2026-10-02 (VOICES.md)
  voice_id: XrExE9yKIg1WjnnlVkGX
  seed: 4242
  voice_settings: {stability: 0.6, similarity_boost: 0.75, style: 0, speed: 0.95}
  lead: 0.5
  tail: 0.6
  lexicon:
    "HBB": H B B
    "Phred": Fred
    "Length Dist.": Length distribution
    "Q / Position": Q by position
    "HbS": H B S
    ".dmg": dot D M G
    "500 kb slice": 500 kilobase slice
    NG_000007.3: N G zero zero zero zero zero seven point three
    NCBI: N C B I
    "the middle A of this codon": the middle base, A, of this codon
    GAG: G, A, G
    GTG: G, T, G
    LGE: L G E

setup:
  window_points: [1440, 810]
  projects:
    - name: Genes and Sequences.lungfish
      from: lungfish-cli demo fetch genes-and-sequences --dest ~/LGEFilm/demos (Stable 2026.9.72). Fetch again with --force before each retake, because Add Annotation writes into the bundle.
  notes:
    - Open the project with nothing selected and the Inspector visible.

honesty:
  - The record is written along the gene's own strand, so the codon reads GAG on screen. Do not mention genome coordinates, where it reads the other way.
  - Codon 7 of the gene is often called position 6 of the protein, because the first amino acid is removed. Do not number the amino acid on screen.

outputs: [wide]
trim_top: 52
window_points: [1440, 810]

beats:
  - {kind: card, id: title, duration: 3.0, icon: true, title: Find the sickle cell codon, sub: Lungfish Genome Explorer
      for beginners, shows: Title card., transition: fade}

  - kind: take
    id: orient
    take: ../_shared/takes/demo-orient.mov
    duration: 10.0
    caption: Start from the Genes and Sequences demo
    kicker: Help · Demo Projects
    crop: [0.335, 0.215, 0.53, 0.72]
    blur:
    - [0.1, 0.107, 0.33, 0.035]
    - [0.308, 0.19, 0.225, 0.03]
    highlights:
    - at: 1.2
      region: [0.025, 0.185, 0.967, 0.165]
    shows: Help > Demo Projects with the Genes and Sequences row outlined.
    capture: 'Shared take of Help > Demo Projects on Stable (screencasts/_shared/takes/demo-orient.mov): the top of
      the list for 9 s, then scrolled to Human Mapping and Variants (with results). Nothing is downloaded. The Save
      to path and an update notice from the owner''s own copy are blurred. Only the first 8.8 s are used here (before
      the list scrolls), holding the last frame while the narration finishes.'
    narration: This video uses the Genes and Sequences demo project. Choose Help, then Demo Projects, and click Download
      and Open beside it. It holds NG_000007.3, the NCBI reference record for the human beta-globin gene cluster.
      The video Your first project shows each step.
    segments:
    - [0.5, 8.8]
  - {kind: take, id: open, take: takes/open.mov, duration: 15.0, caption: Open the human beta-globin gene cluster,
    kicker: Reference Sequences · NG_000007.3, shows: Selecting NG_000007.3 and pressing Focus shows the human beta
      globin region with its genes drawn as features., capture: 'Click NG_000007.3 under Reference Sequences, then
      Focus. Hold on the whole record.', narration: 'Click NG_000007.3 under Reference Sequences, then click Focus
      to show it in the viewer. It holds HBB, the gene for beta-globin, one of the protein chains of hemoglobin, which
      carries oxygen in red blood cells. Annotated features, such as genes and coding sequences, show as colored bars.',
    in: 1.0}
  - {kind: take, id: goto, take: takes/goto.mov, duration: 12.0, caption: Go to Location jumps to the codon, kicker: Sequence
      · Go to Location, shows: 'Sequence > Go to Location with NG_000007:70613-70615 frames three bases reading GAG.',
    capture: 'Choose Sequence > Go to Location (Cmd-L), type NG_000007:70613-70615 and click Go.', narration: 'A codon
      is three bases in a gene''s coding sequence that specify one amino acid. Choose Sequence, then Go to Location,
      type the record name and the codon''s first and last bases, 70,613 to 70,615, and click Go. The viewer zooms
      to three bases, GAG.', in: 1.5}

  - kind: take
    id: protein
    take: takes/goto.mov
    duration: 9.0
    caption: GAG specifies glutamate, written E
    kicker: Translation · E
    shows: The gene's red Translation row shows E under the codon GAG.
    capture: The end of the goto take, held, with the Translation row outlined.
    narration: The Translation row below the bases shows the amino acid each codon specifies, as a one-letter code.
      GAG specifies glutamate, also called glutamic acid, written E.
    in: 14.0
    highlights:
    - at: 1.3
      regions:
      - [0.29, 0.15, 0.47, 0.035]
      - [0.29, 0.255, 0.47, 0.025]
    zoom:
      at: 0.2
      dur: 0.8
      region: &id001 [0.28, 0.06, 0.5, 0.3]

  - kind: take
    id: sickle
    take: takes/goto.mov
    duration: 10.0
    caption: GAG to GTG swaps glutamate for valine
    kicker: Sickle hemoglobin · HbS
    shows: The same codon held while the narration explains the sickle cell change.
    capture: The end of the goto take, held, with the middle base outlined.
    narration: In sickle hemoglobin, HbS, the middle A of this codon is a T. GTG specifies valine, so amino acid 6
      of beta-globin becomes valine instead of glutamate. When oxygen is low, HbS forms long fibers that bend red
      blood cells into a sickle shape. Sickle cell disease needs HbS from both parents.
    in: 20.0
    highlights:
    - at: 0.8
      region: [0.447, 0.15, 0.155, 0.035]
    zoom:
      at: 0.0
      dur: 0.3
      region: *id001
  - {kind: take, id: annotate, take: takes/annotate.mov, duration: 10.5, caption: 'Select the bases, then choose Add
      Annotation', kicker: Sequence · Add Annotation, shows: 'Dragging across the three bases and Sequence > Add Annotation
      with a name, then Add.', capture: 'Drag across the three bases, choose Sequence > Add Annotation, type Sickle
      cell codon, click Add. LGE then reloads the record at full width.', narration: 'An annotation is your own labeled
      mark on a stretch of sequence. Drag across the three bases, choose Sequence, then Add Annotation, type a name,
      and click Add.', in: 0.5}

  - kind: take
    id: saved
    take: takes/saved.mov
    segments:
    - [4.5, 6.0]
    - [10.0, 18.0]
    duration: 9.5
    caption: Your annotation is saved in the project
    kicker: Manual Annotations · Sickle cell codon
    shows: Back at the codon, a Manual Annotations track shows Sickle cell codon under GAG, with the protein row reading
      T P E E K.
    capture: Click Focus, Go to Location NG_000007:70604-70624, Go.
    narration: LGE saves your annotation in the project. Go back to the codon and it shows on the Manual Annotations
      track, a row of the viewer under the bases.
    highlights:
    - at: 2.6
      region: [0.48, 0.34, 0.085, 0.04]
    zoom:
      at: 1.6
      dur: 0.8
      region: [0.28, 0.06, 0.5, 0.4]

  - kind: card
    id: end
    duration: 6.0
    icon: true
    title: Next, check a sequencing run
    shows: End card naming the next video and where to watch it, with the version line.
    narration: Next, learn to check the quality of a sequencing run, on the Videos page of the website.
    lines:
    - {text: Watch it on the Videos page}
    - {text: dhoconno.github.io/lungfish-genome-explorer/videos.html, style: url}
    - {text: '{filmed_with}', style: version}
