# B00: Install Lungfish Genome Explorer. The first video of the learner track; B01 follows it.
# This file is the whole recipe (README, "The video spec").
# Render: python3 screencasts/render.py screencasts/B00-install/video.yaml

slug: B00-install
title: Install Lungfish Genome Explorer
track: beginners
purpose: >-
  A learner who has never used LGE downloads the stable release from the website, installs it,
  opens it for the first time, installs the tools it runs, and creates an empty project.
audience: Undergraduate biology students and bench scientists new to bioinformatics.
manual: 01-foundations/06-the-lungfish-project
next: B01-first-project

filmed_with:
  app: Lungfish
  versions: ["2026.9.72"]
  date: 2026-10-01

narration:
  engine: say
  voice: Ava (Premium)
  words_per_minute: 145
  lead: 0.5
  tail: 0.6
  lexicon:
    LGE: L G E

setup:
  window_points: [1440, 810]
  projects: []
  notes:
    - >-
      Film a true first launch. Quit every LGE app, back up and clear the Stable preferences
      (com.lungfish.browser) and ~/Library/Application Support/Lungfish/window-state.json, move any
      installed Lungfish.app to the Trash, and set LUNGFISH_STORAGE_ROOT (launchctl setenv) to an empty
      folder without spaces so the Welcome window offers the tools install. Restore everything afterwards.
    - The owner clicks the download link and allows the download in Safari.

footage_exception: >-
  Downloading and installing happen outside the app, so the website, the disk image window and the
  macOS prompt are filmed. Everything after the first launch is the app itself.

honesty:
  - The tools install needs an internet connection and takes several minutes. The video cuts over the wait and says it takes a while.
  - LGE runs on Apple Silicon Macs with macOS 26. Say so where the download is shown.

outputs: [wide]
trim_top: 52
window_points: [1440, 810]

beats:
  - {kind: card, id: title, duration: 3.0, icon: true, title: Install Lungfish Genome Explorer, sub: Lungfish Genome
      Explorer for beginners, shows: Title card., transition: fade}

  - kind: take
    id: download
    take: takes/download.mov
    duration: 12.0
    caption: Download the stable release
    kicker: dhoconno.github.io/lungfish-genome-explorer
    shows: The LGE website's download card, and the link to the current stable release.
    capture: Attended. Open the site in a new Safari window sized 1440x810 and record it. The owner clicks the stable
      release link and allows the download. The crop leaves out the toolbar and bookmarks.
    narration: Go to the Lungfish Genome Explorer website and click the current stable release. If Safari asks, allow
      the download. It runs on Apple Silicon Macs with macOS 26.
    segments:
    - [0.5, 8.5]
    - [13.5, 17.5]
    crop: [0.2, 0.14, 0.56, 0.5]
    highlights:
    - at: 2.5
      until: 7.7
      region: [0.51, 0.385, 0.1, 0.05]

  - kind: take
    id: install
    take: takes/install.mov
    duration: 8.0
    caption: Drag the app into Applications
    kicker: Lungfish disk image
    shows: The opened disk image window with the Lungfish app and an Applications folder, and the drag between them.
    capture: Double-click the downloaded DMG. Record its window with wincap --app-region and drag Lungfish onto the
      Applications alias (an on-screen drag, the background drag does not copy).
    narration: Open the downloaded file. In the window that appears, drag Lungfish onto the Applications folder.
    in: 4.0
    crop: [0.0, 0.08, 0.4, 0.42]

  - kind: take
    id: open
    take: takes/open.mov
    duration: 7.5
    caption: Open it from Applications
    kicker: Applications · Lungfish
    shows: Opening Lungfish from Applications and the one-time macOS prompt for an app from the internet.
    capture: Open /Applications in a Finder window with Lungfish selected, record it, and double-click Lungfish. Crop
      to the bottom row and blur every other app, since the folder shows other products by name. The macOS prompt
      is a separate process and was not captured.
    narration: Open Lungfish from your Applications folder. If macOS asks whether to open an app from the internet,
      click Open.
    in: 0.5
    crop: [0.17, 0.81, 0.27, 0.19]
    blur:
    - [0.0, 0.0, 0.3, 1.0]
    - [0.55, 0.0, 0.45, 1.0]
    highlights:
    - at: 1.5
      region: [0.31, 0.06, 0.23, 0.88]
  - {kind: take, id: tools, take: takes/tools.mov, duration: 11.4, caption: 'Install the tools it runs, once', kicker: Welcome
      · Third-Party Tools · Install, shows: 'The Welcome window''s Third-Party Tools card, Install, and the card when
      setup has finished.', capture: 'Record the Welcome window, click Install on the Third-Party Tools card, and
      record the finished card again when setup is done (about 8 minutes here). takes/tools.mov splices tools-start.mov
      (0.5 to 8.5 s) and the first seconds of project.mov.', narration: 'The Welcome window opens. Under Third-Party
      Tools, click Install. LGE downloads the programs it runs for you. It takes a while, and you only do it once.',
    in: 0.0}

  - kind: take
    id: project
    take: takes/project.mov
    duration: 9.2
    caption: Create a project for your work
    kicker: Welcome · Create Project
    shows: Create Project, the save panel with a project name, and the new empty project window.
    capture: Record the Welcome window with wincap --app-region, click Create Project, type My First Project and press
      Return. The panel saves to Documents.
    narration: Click Create Project, type a name, and click Save.
    segments:
    - [3.0, 7.0]
    - [12.8, 16.5]
    - [20.5, 22.0]

  - kind: take
    id: empty
    take: takes/empty.mov
    duration: 6.0
    caption: A project is one folder on your Mac
    kicker: My First Project
    shows: The new project window, empty until data is added.
    capture: Resize the new project window to 1440x810 and record it for a few seconds.
    narration: A project is one folder on your Mac. It holds your data and your results as you work.
    zoom:
      at: 0.6
      dur: 0.8
      region: [0.0, 0.0, 0.4, 0.4]

  - kind: card
    id: end
    duration: 6.0
    icon: true
    title: Next, Your first project
    shows: End card naming the next video and where to watch it, with the version line.
    narration: Next, watch Your first project on the Videos page of the Lungfish Genome Explorer website.
    lines:
    - {text: Watch it on the Videos page}
    - {text: dhoconno.github.io/lungfish-genome-explorer/videos.html, style: url}
    - {text: '{filmed_with}', style: version}
