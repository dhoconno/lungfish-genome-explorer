# Quick video 01, v2: the longer overview, filmed on Lungfish Preview 2026.9.73.
# Render: python3 screencasts/render.py screencasts/01-lge-overview/video-v2.yaml
# Plan and honesty rules: STORYBOARD-v2.md. Takes are driven by drive-v2/*.json (axdrive) and
# recorded with wincap. Terminal beats replay real lungfish-cli output saved in terminal-v2/.

slug: 01-lge-overview-v2
app: Lungfish Preview 2026.9.73
window_points: [1440, 810]
trim_top: 52          # hide the title bar in every app take
outputs: [wide, square]

beats:
  - kind: card
    id: title
    duration: 2.8
    icon: true
    title: Lungfish Genome Explorer
    sub: Sequence analysis, native to the Mac
    transition: fade

  - kind: take
    id: demo
    take: takes-v2/demo.mov       # Help > Demo Projects, filmed with the app frontmost
    in: 0.4
    duration: 9.0
    caption: Start with real public datasets
    kicker: Help · Demo Projects
    crop: [0.0, 0.205, 1.0, 0.75]  # below the Save to row (it shows the owner's home folder)
    square_focus: [0.0, 0.0, 0.75, 1.0]

  - kind: take
    id: sra
    take: takes-v2/sra.mov        # Tools > Search Online Databases > Search SRA
    in: 2.0
    duration: 14.0
    caption: Search SRA and download runs into a project
    kicker: Tools · Search Online Databases · SRA
    crop: [0.18, 0.085, 0.64, 0.645]
    square_focus: [0.0, 0.0, 1.0, 1.0]
    transition: fade

  - kind: take
    id: disk
    take: takes-v2/disk.mov
    in: 1.6
    duration: 8.0
    caption: Clump reads and bin qualities to save space
    kicker: HG002 reads · 18 MB stored as 5.8 MB
    crop: [0.62, 0.064, 0.38, 0.62]
    square_focus: [0.0, 0.0, 1.0, 1.0]

  - kind: take
    id: viewer
    take: takes-v2/viewer.mov
    in: 1.6
    duration: 9.0
    caption: Reads, alignments and variants in one window
    kicker: HG002 · chr20
    square_focus: [0.22, 0.05, 0.56, 1.0]

  - kind: take
    id: pipeline
    take: takes-v2/pipeline.mov
    in: 1.2
    duration: 9.5
    caption: Run nf-core pipelines in Docker containers
    kicker: Viral Recon · Nextflow · Docker
    square_focus: [0.40, 0.0, 0.60, 1.0]

  - kind: take
    id: provenance
    take: takes-v2/provenance.mov
    in: 2.1
    duration: 8.8
    caption: Each result records its tool, version and command
    kicker: Inspector · Provenance · Lineage
    crop: [0.56, 0.064, 0.44, 0.915]
    square_focus: [0.0, 0.0, 1.0, 1.0]

  - kind: take
    id: files
    take: takes-v2/files.mov      # Inspector > Provenance > Files & Outputs
    in: 1.2
    duration: 8.0
    caption: Every input and output is listed with its checksum
    kicker: Inspector · Provenance · Files & Outputs
    crop: [0.56, 0.064, 0.44, 0.915]
    square_focus: [0.0, 0.0, 1.0, 1.0]

  - kind: take
    id: export
    take: takes-v2/export.mov     # File > Export > Provenance > Methods Section…, app-region capture
    in: 6.5
    duration: 8.0
    caption: Export the history as a script or methods text
    kicker: File · Export · Provenance · Methods Section
    square_focus: [0.15, 0.0, 0.62, 1.0]

  - kind: terminal
    id: cli
    title: HG002 chr20.lungfish
    prompt: "$ "
    # Real run with the Preview 2026.9.73 CLI on the project copy. cli-full.txt is the complete
    # output; cli-output.txt keeps the first 12 and last 4 lines with an explicit "…" between.
    command: lungfish-cli variants call --bundle Analyses/minimap2-2026-09-25T00-00-00/GRCh38.chr20.10.0-10.5Mb.lungfishref --alignment-track aln_DC100740 --caller bcftools --name "HG002 bcftools rerun"
    output_file: terminal-v2/cli-output.txt
    max_lines: 18
    type_cps: 120
    line_interval: 0.12
    duration: 8.0
    caption: The same analysis from the app or terminal
    kicker: lungfish-cli
    square_focus: [0.0, 0.0, 0.62, 1.0]
    transition: fade

  - kind: card
    id: end
    duration: 4.5
    icon: true
    title: Lungfish Genome Explorer
    lines:
      - text: Free and open source, MIT license
      - text: For Apple Silicon Macs running macOS 26
      - text: github.com/dhoconno/lungfish-genome-explorer
        style: url
      - text: lungfish-genome-explorer.readthedocs.io
        style: url
