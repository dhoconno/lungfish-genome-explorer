# B03: Judge a sequencing run. Learner track, after B02.
# This file is the whole recipe (README, "The video spec").
# Render: python3 screencasts/render.py screencasts/B03-run-quality/video.yaml

slug: B03-run-quality
title: Judge a sequencing run
track: beginners
purpose: >-
  A learner opens a set of Illumina reads and judges the run from the summary cards and charts,
  learning what the quality scores mean and what healthy values look like.
audience: Undergraduate biology students and bench scientists new to bioinformatics.
manual: 03-reads/03-quality-control
demo: human-reads
next: B04-reading-a-pileup

filmed_with:
  app: Lungfish
  versions: ["2026.9.72"]
  date: 2026-10-01

narration:
  engine: elevenlabs
  model: eleven_v4
  voice_id: XrExE9yKIg1WjnnlVkGX   # Matilda (ElevenLabs stock voice), chosen 2026-10-02
  seed: 4242
  voice_settings: {stability: 0.6, similarity_boost: 0.75, style: 0, speed: 0.95}
  lead: 0.5
  tail: 0.6
  lexicon:
    "HBB": H B B
    "Phred": Fred
    "Length Dist.": Length distribution
    "Q / Position": Q by position
    "HbS": H B S
    ".dmg": dot D M G
    "500 kb slice": 500 kilobase slice
    HG002: H G zero zero two
    Q20: Q twenty
    Q30: Q thirty
    GC: G C
    "2 by 250": two by two fifty
    LGE: L G E

setup:
  window_points: [1440, 810]
  projects:
    - name: Human Reads.lungfish
      from: lungfish-cli demo fetch human-reads --dest ~/LGEFilm/demos (Stable 2026.9.72)
  notes:
    - Check the cards read Mean Q 25.3, Q20 94.6% and Q30 91.3% before filming. Older imports showed 95.0 and 91.0.

honesty:
  - The 80 percent Q30 figure is a rule of thumb for Illumina, not a specification. Say so.
  - Nanopore reads score lower on Q30 by design. Keep the threshold to Illumina.

outputs: [wide]
trim_top: 52
window_points: [1440, 810]

beats:
  - {kind: card, id: title, duration: 3.0, icon: true, title: Judge a sequencing run, sub: Lungfish Genome Explorer
      for beginners, shows: Title card., transition: fade}

  - kind: take
    id: orient
    take: ../_shared/takes/demo-orient.mov
    duration: 10.0
    caption: Start from the Human Reads demo
    kicker: Help · Demo Projects
    crop: [0.335, 0.215, 0.53, 0.72]
    blur:
    - [0.1, 0.107, 0.33, 0.035]
    - [0.308, 0.19, 0.225, 0.03]
    highlights:
    - at: 1.2
      region: [0.025, 0.395, 0.967, 0.2]
    shows: Help > Demo Projects with the Human Reads row outlined.
    capture: 'Shared take of Help > Demo Projects on Stable (screencasts/_shared/takes/demo-orient.mov): the top of
      the list for 9 s, then scrolled to Human Mapping and Variants (with results). Nothing is downloaded. The Save
      to path and an update notice from the owner''s own copy are blurred. Only the first 8.8 s are used here (before
      the list scrolls), holding the last frame while the narration finishes.'
    narration: This video uses the Human Reads demo project. Choose Help, then Demo Projects, and click Download and
      Open beside Human Reads. The video Your first project shows each step.
    segments:
    - [0.5, 8.8]

  - kind: take
    id: cards
    take: takes/qc.mov
    duration: 10.0
    caption: Nine cards summarize all 91,148 reads
    kicker: Imports · HG002 reads
    shows: Selecting the HG002 reads shows nine summary cards across the top of the viewer.
    capture: Click HG002.chr20.10.0-10.5Mb under Imports and hold on the cards.
    narration: Click the HG002 reads under Imports. HG002 is a Genome in a Bottle reference sample, one of the most
      thoroughly sequenced human genomes. The cards across the top summarize all the reads in this file, how many
      reads and bases there are, how long the reads are, and their base quality.
    in: 0.5
    zoom:
      at: 3.5
      dur: 0.9
      region: &id001 [0.2828, -0.0054, 0.4902, 0.22799999999999998]
    highlights:
    - at: 4.6
      region: [0.2928, 0.0046, 0.4702, 0.122]

  - kind: take
    id: qscore
    take: takes/qc.mov
    duration: 10.0
    caption: A Q score is a base call's error chance
    kicker: Q20 · Q30
    shows: The Q20 and Q30 cards, outlined.
    capture: Same take, held on the cards.
    narration: Each base call gets a base quality score, also called a Phred score and written Q. It is the sequencer's
      estimate of the chance that the call is wrong. Q20 means a 1 in 100 chance. Q30 means a 1 in 1,000 chance.
    in: 11.0
    zoom:
      at: 0.0
      dur: 0.3
      region: *id001
    highlights:
    - at: 0.6
      regions:
      - [0.2928, 0.0705, 0.0746, 0.0561]
      - &id002 [0.3721, 0.0705, 0.0746, 0.0561]

  - kind: take
    id: q30
    take: takes/qc.mov
    duration: 9.0
    caption: 91 percent of base calls reach Q30
    kicker: Q30 · 91.3%
    shows: The Q30 card, outlined.
    capture: Same take, held on the cards.
    narration: Here 91 percent of base calls are Q30 or higher. For Illumina's long 250-base reads, the manufacturer's
      target is about 75 percent, so this run is well above it.
    in: 21.0
    zoom:
      at: 0.0
      dur: 0.3
      region: *id001
    highlights:
    - at: 0.6
      regions:
      - *id002

  - kind: take
    id: position
    take: takes/qc.mov
    duration: 13.0
    caption: Base quality drops late in each read, as expected
    kicker: Q / Position
    shows: A click on the Q / Position chart opens it full size, with quality dropping toward base 250 but staying
      above Q20.
    capture: Click the Q / Position chart. The popover is a separate window, so record with wincap --app-region. Click
      outside it to close.
    narration: Click the Q / Position chart to open it. It plots base quality from the first base of each read to
      the last. Quality drops toward the end because, cycle by cycle, the copies of each fragment fall out of step
      and the signal blurs. Here the average stays above Q30 until base 243. Click outside the chart to close it.
    in: 34.5
    zoom:
      at: 3.5
      dur: 0.9
      region: [0.32, 0.25, 0.42, 0.45]

  - kind: take
    id: length
    take: takes/qc.mov
    duration: 10.0
    caption: Reads are 250 bases, GC is 39 percent
    kicker: Length Dist. · GC
    shows: The Length Dist. chart spikes at 250 bases and the GC card reads 39.4 percent.
    capture: Reuses the cards section of takes/qc.mov from before the chart opens.
    narration: Length Dist. peaks at 250 bases, because the run read 250 bases from each end of every fragment, called
      2 by 250 paired-end sequencing. GC content, the share of bases that are G or C, is 39 percent. The human genome
      averages about 41 percent, and a 500 kb slice can differ.
    in: 12.0
    zoom:
      at: 0.0
      dur: 0.3
      region: *id001
    highlights:
    - at: 0.6
      regions:
      - [0.2928, 0.1416, 0.1532, 0.0711]
      - [0.4515, 0.0705, 0.0746, 0.0561]

  - kind: card
    id: end
    duration: 6.0
    icon: true
    title: Next, reading a pileup
    shows: End card naming the next video and where to watch it, with the version line.
    narration: Next, see these reads aligned to a slice of human chromosome 20, on the Videos page of the website.
    lines:
    - {text: Watch it on the Videos page}
    - {text: dhoconno.github.io/lungfish-genome-explorer/videos.html, style: url}
    - {text: '{filmed_with}', style: version}
